<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>哔哩哔哩</title>
<style>
:root{--bg:#0b111b;--fg:#e6edf3;--dim:#93a4bb;--line:#243349;--accent:#fb7299}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.4 -apple-system,"Noto Sans CJK SC",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid var(--line);flex:0 0 auto}
header b{font-size:15px;color:var(--accent)}
header .sp{flex:1 1 auto}
header input{flex:1 1 auto;min-width:0;height:28px;padding:0 8px;font:inherit;font-size:13px;
  color:#e6edf3;background:#16202f;border:1px solid #243349;border-radius:6px}
/* 搜索框：用 div 而不是 input —— input 一旦获得焦点，宿主就会弹出它自己的
   输入法（独立 iframe、盖在页面外），我们要用页面内的输入法，所以避开焦点链 */
#q.qi{flex:1 1 auto;min-width:0;height:28px;padding:0 8px;font:inherit;font-size:13px;
  color:#e6edf3;background:#16202f;border:1px solid #243349;border-radius:6px;
  display:flex;align-items:center;overflow:hidden;white-space:nowrap}
#q.qi.empty::before{content:attr(data-ph);color:#7b8da6}
#ime{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#0d1622;
  border-top:1px solid #2a3c56;box-shadow:0 -6px 18px #0008;
  display:none;flex-direction:column;gap:4px;padding:5px 6px 7px}
#ime.on{display:flex}
#ime .line1{display:flex;align-items:center;gap:6px;min-height:18px}
#ime-mode{font-size:11px;color:#06101c;background:#4c9aff;border-radius:4px;padding:1px 4px}
#ime-comp{font-size:13px;letter-spacing:2px;color:#8fd0ff;flex:1 1 auto;
  white-space:nowrap;overflow:hidden}
#ime-page{font-size:11px;color:#6b7d95}
#ime-cands{display:flex;flex-wrap:wrap;gap:4px;min-height:26px;align-items:center}
.ime-c{font-size:15px;line-height:22px;padding:0 7px;border-radius:5px;
  background:#16202f;color:#e6edf3;border:1px solid #243349}
.ime-c.sel{background:#4c9aff;color:#06101c;border-color:#7fbcff}
.ime-tip{font-size:11px;color:#6b7d95}
#ime .hint{font-size:10px;color:#5c6d84;white-space:nowrap;overflow:hidden}
header button{height:28px;width:30px;padding:0;display:flex;align-items:center;justify-content:center;
  font:inherit;font-size:13px;color:#dce8f8;background:#22304a;border:1px solid #3a4c6b;border-radius:6px}
header button svg{display:block}
#tabs{display:flex;gap:5px;padding:4px 7px 3px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;height:28px;padding:0 10px;font:inherit;font-size:12px;color:#a9bad0;
  background:#16202f;border:1px solid #243349;border-radius:14px}
#tabs button.on{color:#fff;background:#2a3c55;border-color:#3f5876;box-shadow:inset 0 -2px 0 var(--accent)}
body.tempview #tabs { display: none !important; }
#list{flex:1 1 auto;overflow-y:auto;padding:6px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.card{display:flex;gap:7px;padding:6px;border-bottom:1px solid #16202f}
.card:active{background:#16202f}
/* 选中项要一眼看出来：底色、左侧色条、外描边、标题变白 */
.card.sel{background:rgba(251,114,153,.18);border-radius:6px;
  box-shadow:inset 4px 0 0 var(--accent),0 0 0 2px rgba(251,114,153,.55)}
.card.sel .t{color:#fff;font-weight:600}
.card.sel .m{color:#e6b9c8}
.card img{width:96px;height:54px;object-fit:cover;border-radius:4px;background:#16202f;flex:0 0 auto}
.card .info{min-width:0;flex:1 1 auto}
.card .t{font-size:12px;line-height:1.35;max-height:2.7em;overflow:hidden}
.card .m{font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.rot-land header, body.rot-land #status { display: none !important; }
body.in-player #tabs { display: none !important; }
#player{display:none;flex:1 1 auto;flex-direction:column;background:#000}
#player.on{display:flex}
#screen{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#frame{position:absolute;left:50%;top:50%}
#frame canvas{width:100%;height:100%;background:#000;display:block}
/* 字幕：竖屏放在画面下方的黑边里，横屏跟着画面一起转 */
#subs{position:absolute;left:0;right:0;bottom:-24px;text-align:center;color:#fff;
  font:600 13px/1.3 -apple-system,"Noto Sans CJK SC",sans-serif;
  text-shadow:0 1px 2px #000,0 0 4px #000,0 0 6px #000;padding:0 4px;
  pointer-events:none;display:none}
#screen.rot #subs{bottom:3px}
#screen canvas{z-index:1}
#rotbtn{position:absolute;top:6px;right:6px;z-index:9;width:44px;height:32px;padding:0;font:inherit;
  font-size:12px;line-height:30px;text-align:center;color:#dce8f8;background:rgba(20,30,46,.8);
  border:1px solid #3a4c6b;border-radius:6px;pointer-events:auto;transition:opacity .2s}
#screen.hideui #rotbtn, #screen.hideui #pmenubtn{opacity:0;pointer-events:none}
#pinfo{font-size:11px;color:var(--dim);padding:3px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player{position:relative}
#pbar{flex:0 0 auto;background:#0b111b;border-top:1px solid var(--line);padding:4px 6px 7px}
/* 横屏时彻底隐藏竖屏底栏和角标 */
body.rot-land #pbar, body.rot-land #rotbtn, body.rot-land #pmenubtn { display: none !important; }

/* 横屏专用 480x320 全屏浮层：整体旋转 90 度，与物理屏幕完全贴合 */
#land-ui {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  width: 480px;
  height: 320px;
  transform: translate(-50%, -50%) rotate(90deg);
  z-index: 15;
  box-sizing: border-box;
  flex-direction: column;
  justify-content: space-between;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
}
body.rot-land #land-ui { display: flex; }
body.rot-land #land-ui.show { opacity: 1; pointer-events: auto; }

.land-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  height: 38px;
  padding: 0 12px;
  background: linear-gradient(to bottom, rgba(5,9,15,.92), rgba(5,9,15,.4) 75%, transparent);
}
.land-title {
  flex: 1 1 auto;
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 2px #000;
}
.land-top-btns {
  display: flex;
  gap: 8px;
  flex: 0 0 auto;
}
.land-top-btns button {
  height: 26px;
  padding: 0 8px;
  font: inherit;
  font-size: 12px;
  color: #dce8f8;
  background: rgba(22, 32, 47, .85);
  border: 1px solid #3a4c6b;
  border-radius: 6px;
  white-space: nowrap;
}
.land-bot {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 12px 10px;
  background: linear-gradient(to top, rgba(5,9,15,.95), rgba(5,9,15,.5) 75%, transparent);
}
.land-seek {
  height: 6px;
  background: rgba(255,255,255,.2);
  border-radius: 3px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.land-seek i {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0;
  background: var(--accent);
  border-radius: 3px;
}
.land-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.land-time {
  font-size: 12px;
  color: #c0d1e6;
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}
.land-btns {
  display: flex;
  gap: 8px;
  flex: 0 0 auto;
}
.land-btns button {
  height: 30px;
  padding: 0 12px;
  font: inherit;
  font-size: 12px;
  color: #e6edf3;
  background: rgba(27, 38, 55, .88);
  border: 1px solid #3d506d;
  border-radius: 6px;
}
.land-btns button:active { background: #2b3d58; }

#pseek{height:6px;background:#1b2637;border-radius:3px;margin:2px 2px 5px;position:relative;overflow:hidden}
#pseek i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:3px}
#ptime{font-size:11px;color:#8fa3bd;padding:1px 2px 5px;font-variant-numeric:tabular-nums}
#pbtns{display:flex;gap:5px}
#pbtns button{flex:1 1 0;height:34px;padding:0;font:inherit;font-size:12px;color:#dce8f8;
  background:#1b2637;border:1px solid #2c3d55;border-radius:7px}
#pbtns button:active{background:#26374f}
#status{font-size:11px;color:var(--dim);padding:2px 8px}
#settings{display:none;position:fixed;inset:0;z-index:21;background:rgba(5,9,15,.9);
  align-items:center;justify-content:center;padding:10px}
#settings.on{display:flex}
#settings .box{width:100%;background:#101a28;border:1px solid #243349;border-radius:10px;
  padding:10px;display:flex;flex-direction:column;gap:7px}
/* 横屏时设置菜单旋转 90° 呈现在屏幕中央，并展开为双列网格排版 */
body.rot-land #settings .box{width:440px;max-height:280px;transform:rotate(90deg);
  flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:10px 14px}
body.rot-land #settings .hd, body.rot-land #settings #setclose{grid-column:1 / -1}
#settings .hd{font-size:13px;color:var(--accent);padding-bottom:2px}
#settings .row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#c8d6e8}
#settings button{height:28px;padding:0 12px;font:inherit;font-size:12px;color:#dce8f8;
  background:#22304a;border:1px solid #3a4c6b;border-radius:6px}
#login{display:none;position:fixed;inset:0;z-index:20;background:rgba(5,9,15,.94);
  flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
#login.on{display:flex}
#login canvas{background:#fff;border-radius:8px;padding:6px;image-rendering:pixelated}
#login .msg{font-size:12px;color:#c8d6e8;text-align:center;min-height:1.4em}
#login .row{display:flex;gap:8px}
#login button{height:30px;padding:0 14px;font:inherit;font-size:13px;color:#dce8f8;
  background:#22304a;border:1px solid #3a4c6b;border-radius:6px}

/* 相关推荐抽屉 */
#related-drawer{display:none;position:absolute;inset:0;z-index:25;background:rgba(8,13,20,.96);flex-direction:column;padding:0}
#related-drawer.open{display:flex}
body.rot-land #related-drawer{width:480px;height:320px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);border:1px solid #243349}
.rel-list{flex:1 1 auto;overflow-y:auto;padding:8px 10px;-webkit-overflow-scrolling:touch}
.rel-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.rel-item.sel{background:rgba(76,154,255,.14)}
.rel-cover{width:88px;height:50px;border-radius:4px;object-fit:cover;background:#1c2838;flex:0 0 auto}
.rel-meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rel-title{font-size:12px;line-height:1.35;color:#e6edf3;max-height:2.7em;overflow:hidden}
.rel-sub{font-size:11px;color:#8fa3bd;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 评论区抽屉：竖屏覆盖在播放器下方或全屏，横屏旋转 90° 铺满 */
#comments-drawer{display:none;position:absolute;inset:0;z-index:25;background:rgba(8,13,20,.96);flex-direction:column;padding:0}
#comments-drawer.open{display:flex}
body.rot-land #comments-drawer{width:480px;height:320px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);border:1px solid #243349}
.comm-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #243349;background:#111a27;font-size:13px;font-weight:600;color:#e6edf3;flex:0 0 auto}
.comm-head button{width:28px;height:28px;padding:0;border:none;background:transparent;color:#a9bad0;font-size:20px;line-height:24px;cursor:pointer}
.comm-list{flex:1 1 auto;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.comm-item{display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:8px}
.comm-avatar{width:28px;height:28px;border-radius:50%;flex:0 0 auto;background:#1c2838}
.comm-body{flex:1 1 auto;min-width:0}
.comm-user{font-size:12px;font-weight:500;color:#79a5db;display:flex;justify-content:space-between}
.comm-user .comm-like{color:#8fa3bd;font-size:11px}
.comm-text{font-size:13px;line-height:1.4;color:#e6edf3;margin-top:3px;word-break:break-all}
</style>
</head>
<body>
<header><div id="q" class="qi empty" data-ph="搜视频（按 0 或点这里）"></div>
  <button id="back" type="button" aria-label="返回"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="reload" type="button" aria-label="刷新"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button id="hist" type="button" aria-label="历史" title="历史"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></button>
  <button id="acc" type="button" aria-label="登录"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>
  <button id="cfg" type="button" aria-label="设置"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1.03z"/></svg></button></header>
<div id="tabs">
  <button type="button" data-tab="rcmd">1 推荐</button>
  <button type="button" data-tab="hot">2 热门</button>
  <button type="button" data-tab="rank">3 排行</button>
  <button type="button" data-tab="anime">4 番剧</button>
  <button type="button" data-tab="guochuang">5 国创</button>
  <button type="button" data-tab="movie">6 电影</button>
  <button type="button" data-tab="tv">7 剧集</button>
  <button type="button" data-tab="doc">8 纪录</button>
  <button type="button" data-tab="douga">9 动画</button>
  <button type="button" data-tab="game">游戏</button>
  <button type="button" data-tab="music">音乐</button>
  <button type="button" data-tab="tech">科技</button>
  <button type="button" data-tab="cinephile">影视</button>
  <button type="button" data-tab="history">历史</button>
</div>
<div id="status">推荐</div>
<div id="list"></div>
<div id="settings">
  <div class="box">
    <div class="hd">设置</div>
    <div class="row"><span>弹幕</span><button id="setdm" type="button">开</button></div>
    <div class="row"><span>弹幕字号</span><button id="setsz" type="button">中</button></div>
    <div class="row"><span>屏幕亮度</span><button id="setbl" type="button">50%</button></div>
    <div class="row"><span>后台播放</span><button id="setbg" type="button">关</button></div>
    <div class="row"><span>起播缓冲</span><button id="setwm" type="button">2MB</button></div>
    <div class="row"><span>横竖屏</span><button id="setrot" type="button">竖屏</button></div>
    <div class="row"><span>首页默认</span><button id="sethome" type="button">推荐</button></div>
    <div class="row"><span>字幕（竖屏）</span><button id="setsub" type="button">开</button></div>
    <div class="row"><span>字幕（横屏）</span><button id="setsubland" type="button">关</button></div>
    <div class="row"><span>音画补偿</span><button id="setlead" type="button">120ms</button></div>
    <div class="row"><span>画质</span><button id="setqn" type="button">720P</button></div>
    <div class="row"><span>视频缓存</span><button id="setclear" type="button">清空</button></div>
    <div class="row"><span>账号</span><button id="setlogout" type="button">退出登录</button></div>
    <button id="setclose" type="button">关闭</button>
  </div>
</div>
<div id="login">
  <canvas id="qrimg" width="170" height="170"></canvas>
  <div class="msg" id="qrmsg">用哔哩哔哩 App 扫码</div>
  <div class="row"><button id="qlogout" type="button">退出登录</button><button id="qclose" type="button">关闭</button></div>
</div>
<div id="player">
  <div id="screen">
    <div id="frame"><canvas id="cv" width="320" height="180"></canvas>
      <div id="subs"></div>
    </div>
    <!-- 竖屏切横屏角标 -->
    <button id="rotbtn" type="button">横</button>

    <!-- 横屏独立专属全屏控制浮层 -->
    <div id="land-ui">
      <div class="land-top">
        <div class="land-title" id="land-title"></div>
        <div class="land-top-btns">
          <button type="button" id="land-btn-like">赞</button>
          <button type="button" id="land-btn-fav">藏</button>
          <button type="button" id="land-dm">弹幕</button>
          <button type="button" id="land-btn-cfg">设置</button>
          <button type="button" id="land-btn-port">竖屏</button>
        </div>
      </div>
      <div class="land-bot">
        <div class="land-seek" id="land-seek"><i id="land-fill"></i></div>
        <div class="land-row">
          <div class="land-time" id="land-time">--:-- / --:--</div>
          <div class="land-btns">
            <button type="button" data-act="back10">« 10s</button>
            <button type="button" data-act="play" id="land-play">暂停</button>
            <button type="button" data-act="fwd10">10s »</button>
            <button type="button" id="land-btn-comm">评论</button>
            <button type="button" id="land-btn-rel">推荐</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="pbar">
    <div id="pinfo"></div>
    <div id="pseek"><i id="pfill"></i></div>
    <div id="ptime">--:-- / --:--</div>
    <div id="pbtns">
      <button type="button" data-act="back10">« 10s</button>
      <button type="button" data-act="play">暂停</button>
      <button type="button" data-act="fwd10">10s »</button>
      <button type="button" id="btn-like">点赞</button>
      <button type="button" id="btn-fav">收藏</button>
      <button type="button" id="btn-comm">评论</button>
      <button type="button" id="btn-rel">推荐</button>
      <button type="button" data-act="rot">横屏</button>
    </div>
  </div>
  <div id="comments-drawer">
    <div class="comm-head">
      <span id="comm-title">评论</span>
      <button type="button" id="comm-close" aria-label="关闭">×</button>
    </div>
    <div class="comm-list" id="comm-list">
      <div style="padding:20px;text-align:center;color:#8fa3bd">加载评论中…</div>
    </div>
  </div>
  <div id="related-drawer">
    <div class="comm-head">
      <span id="rel-title">相关推荐</span>
      <button type="button" id="rel-close" aria-label="关闭">×</button>
    </div>
    <div class="rel-list" id="rel-list">
      <div style="padding:20px;text-align:center;color:#8fa3bd">加载中…</div>
    </div>
  </div>
</div>
<div id="ime" aria-hidden="true">
  <div class="line1"><span id="ime-mode">中</span><span id="ime-comp"></span><span id="ime-page"></span></div>
  <div id="ime-cands"></div>
  <div class="hint">2-9 拼音 · 1 标点 · 0 空格 · ←→ 选字 · ↑↓ 翻页 · OK 上屏/搜索 · 返回 收起</div>
</div>
<script src="/sdk/e5.js"></script>
<script src="qrcode.js"></script>
<script src="ime-dict.js"></script>
<script src="ime.js"></script>
<script>
(function(){
  var listEl = document.getElementById('list');
  var statusEl = document.getElementById('status');
  var player = document.getElementById('player');
  var cv = document.getElementById('cv');
  var cctx = cv.getContext('2d');
  var pinfo = document.getElementById('pinfo');

  /* 横竖屏：0 竖屏（默认）1 横屏 2 自动（按视频比例，用户明确要求默认关）。
     横屏时画面转 90°，320×480 的屏上 16:9 从 320×180 变成约 270×480。 */
  var screenEl = document.getElementById('screen');
  var rotBtn = document.getElementById('rotbtn');
  var rotMode = +(localStorage.getItem('bili-rot') || 0);
  if (!(rotMode >= 0 && rotMode <= 2)) rotMode = 0;
  /* 默认竖屏：老的自动横屏设置（2）在用户没主动选过时不再生效 */
  if (localStorage.getItem('bili-rot-set') !== '1') rotMode = 0;
  /* 取证用：?rot=1 强制横屏、?rot=0 强制竖屏，便于横竖各跑一次对比清晰度 */
  try{
    var rotArg = new URLSearchParams(location.search).get('rot');
    if (rotArg === '1') rotMode = 1;
    else if (rotArg === '0') rotMode = 0;
  }catch(e){}
  function rotOn(){
    if (rotMode === 1) return true;
    if (rotMode === 2) return cv.width > cv.height * 1.25 && cv.height >= 2;
    return false;
  }
  function layout(){
    if (rotOn()){
      document.body.classList.add('rot-land');
      document.body.classList.add('in-player');
      var lui = document.getElementById('land-ui');
      if (lui) lui.style.transform = 'translate(-50%,-50%) rotate(90deg)';
      flashBar();
    } else {
      document.body.classList.remove('rot-land');
      var landEl = document.getElementById('land-ui');
      if (landEl) landEl.classList.remove('show');
      if (window.__barTimer) { clearTimeout(window.__barTimer); window.__barTimer = 0; }
    }
    var W = screenEl.clientWidth, H = screenEl.clientHeight;
    if (!W || !H || !cv.width || !cv.height) return;
    /* 宽高比只认片源（首帧记下来），不再跟着画布走：
       输出尺寸取偶数，用画布反推会让比例在 1.778/1.784 之间漂，
       来回切换就越来越糊 */
    var a = srcAspect || (cv.width / cv.height), x;
    x = rotOn() ? Math.min(H, W * a) : Math.min(W, H * a);
    var y = x / a;
    var frameEl = document.getElementById('frame');
    if (frameEl){
      frameEl.style.left = '50%'; frameEl.style.top = '50%';
      frameEl.style.width = Math.round(x) + 'px';
      frameEl.style.height = Math.round(y) + 'px';
      frameEl.style.transform = rotOn() ? 'translate(-50%,-50%) rotate(90deg)' : 'translate(-50%,-50%)';
    }
    screenEl.classList.toggle('rot', rotOn());
    /* 旋转后立刻按新方向决定字幕显不显示（暂停时没有新帧，只靠 tickSubs 收不掉） */
    if (subsEl && (rotOn() ? !subOnLand : !subOn)) subsEl.style.display = 'none';
    if (rotBtn) rotBtn.textContent = rotOn() ? '横' : '竖';
    /* 播放器按这个尺寸输出画面：和显示区域一样大，页面不再缩放，字才清楚 */
    window.__maxWant = Math.max(64, Math.round(x));
    var rb = document.querySelector('#pbtns button[data-act="rot"]');
    if (rb) rb.textContent = rotOn() ? '竖屏' : '横屏';
  }
  /* 切换横竖屏：播放中要按新尺寸重启播放器，并跳回原来的进度 */
  function toggleRot(){
    /* 目标由「现在看起来是横还是竖」决定，不能在 1/0 之间硬切：
       自动模式（2）下画面已经是横的，硬切会让第一次按键毫无视觉变化 */
    rotMode = rotOn() ? 0 : 1;
    try{ localStorage.setItem('bili-rot', String(rotMode)); }catch(x){}
    layout();
    if (!inPlayer) return;
    /* 只改输出尺寸：播放器收到命令后重建缩放器，不重启、不重跳、声音不断 */
    var m = window.__maxWant || 480;
    probe('rot', 'mode=' + rotMode + ' screen=' + screenEl.clientWidth + 'x' +
          screenEl.clientHeight + ' out=' + m);
    if (ws && ws.readyState === 1){
      try{ ws.send(new Uint8Array([6, m & 0xff, (m >> 8) & 0xff])); }catch(e){}
    }
    statusEl.textContent = rotOn() ? ('横屏 ' + m + 'px') : ('竖屏 ' + m + 'px');
  }
  if (rotBtn){
    rotBtn.addEventListener('click', function(e){
      if (e) e.stopPropagation();
      rotMode = (rotMode + 1) % 3;
      try{ localStorage.setItem('bili-rot', String(rotMode)); localStorage.setItem('bili-rot-set', '1'); }catch(x){}
      layout();
      statusEl.textContent = ['竖屏', '横屏（转 90°）', '自动：宽视频自动横'][rotMode];
    });
  }
  window.addEventListener('resize', function(){ try{ layout(); }catch(e){} });

  /* 控制栏：触摸也能操作，不必记键盘 */
  var pbtnsEl = document.getElementById('pbtns');
  if (pbtnsEl) pbtnsEl.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'btn-like'){ toggleLike(); return; }
    if (b.id === 'btn-fav'){ toggleFav(); return; }
    if (b.id === 'btn-comm'){ toggleComments(); return; }
    if (b.id === 'btn-rel'){ toggleRelated(); return; }
    var act = b.getAttribute('data-act');
    if (act === 'back10') seekBy(-10000);
    else if (act === 'fwd10') seekBy(10000);
    else if (act === 'play'){ try{ cv.click(); }catch(x){} }
    else if (act === 'rot') toggleRot();
    else if (act === 'exit') leavePlayer();
  });

  /* 画面上任何触摸先取消"自动连播"倒计时 */
  if (screenEl){
    screenEl.addEventListener('touchstart', function(){
      if (autoNextOn) cancelAutoNext();
    }, { passive: true });
  }

  /* 画面上/下划动调亮度：向上滑调亮、向下滑调暗（竖屏用，横屏方向另有按键） */
  (function(){
    var sy = 0, sx = 0, active = false;
    var el = screenEl;
    if (!el) return;
    el.addEventListener('touchstart', function(e){
      if (!inPlayer || !e.touches || e.touches.length !== 1){ active = false; return; }
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; active = true;
    }, { passive: true });
    el.addEventListener('touchend', function(e){
      if (!active || !e.changedTouches || e.changedTouches.length !== 1){ active = false; return; }
      active = false;
      var dx = e.changedTouches[0].clientX - sx;
      var dy = e.changedTouches[0].clientY - sy;
      /* 明显是纵向划动（屏幕坐标），横向就别抢进度条的手势 */
      if (Math.abs(dy) < 40 || Math.abs(dy) < Math.abs(dx) * 1.5) return;
      blIdx = dy < 0 ? Math.min(BL_STEPS.length - 1, blIdx + 1)
                     : Math.max(0, blIdx - 1);
      applyBrightness(true);
    }, { passive: true });
    el.addEventListener('touchcancel', function(){ active = false; }, { passive: true });
  })();

  /* 横屏浮层：有交互就亮出来，3.5 秒无操作自动收起 */
  function flashBar(){
    if (!rotOn()) return;
    var ui = document.getElementById('land-ui');
    if (ui) ui.classList.add('show');
    if (window.__barTimer) clearTimeout(window.__barTimer);
    window.__barTimer = setTimeout(function(){
      var u2 = document.getElementById('land-ui');
      if (u2) u2.classList.remove('show');
    }, 3500);
  }
  ['click', 'touchstart', 'keydown'].forEach(function(ev){
    document.addEventListener(ev, function(){ flashBar(); }, true);
  });

  /* 进度条：点哪跳哪（支持竖屏和横屏） */
  function bindSeek(el, isRot){
    if (!el) return;
    el.addEventListener('click', function(e){
      if (e) e.stopPropagation();
      if (!(curDurS > 0)) return;
      var r = el.getBoundingClientRect();
      var ratio = 0;
      if (isRot){
        /* 横屏顺时针转了 90°，横向对应 clientY */
        if (!r.height) return;
        ratio = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
      } else {
        if (!r.width) return;
        ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      }
      seekBy(ratio * curDurS * 1000 - playerMs());
    });
  }
  bindSeek(document.getElementById('pseek'), false);
  bindSeek(document.getElementById('land-seek'), true);

  /* 横屏控制按钮绑定 */
  var landUi = document.getElementById('land-ui');
  if (landUi){
    landUi.addEventListener('click', function(e){
      var b = e.target.closest('button');
      if (!b) return;
      e.stopPropagation();
      var act = b.getAttribute('data-act');
      if (act === 'back10') seekBy(-10000);
      else if (act === 'fwd10') seekBy(10000);
      else if (act === 'play'){ try{ cv.click(); }catch(x){} }
      else if (b.id === 'land-btn-like') toggleLike();
      else if (b.id === 'land-btn-fav') toggleFav();
      else if (b.id === 'land-btn-comm') toggleComments();
      else if (b.id === 'land-btn-rel') toggleRelated();
      else if (b.id === 'land-rot' || b.id === 'land-btn-port') toggleRot();
      else if (b.id === 'land-btn-cfg'){
        var cfgBtn = document.getElementById('cfg');
        if (cfgBtn) cfgBtn.click();
      }
      else if (b.id === 'land-dm'){
        dmOn = !dmOn;
        /* 必须和设置面板用同一个键（saveCfg -> bili.dm），否则两处开关互不认识 */
        saveCfg('dm', dmOn ? '1' : '0');
        if (!dmOn) dmLive.length = 0;
        syncCfgUi();
        statusEl.textContent = '弹幕 ' + (dmOn ? '开' : '关');
      }
    });
  }

  /* 井号键切横竖屏（# 在 WPE 上可能是 Unidentified + 51） */
  window.addEventListener('keydown', function(e){
    if (!inPlayer) return;
    var isHash = (e.key === '#') || ((!e.key || e.key === 'Unidentified') && e.keyCode === 51);
    if (!isHash) return;
    e.preventDefault();
    toggleRot();
  }, true);
  var items = [];
  var inPlayer = false;
  var ws = null, img = null;
  var curMs = 0, durMs = 0;
  /* 缓冲提示：快进到还没下载的位置时播放器会静默等待，
     这里用「多久没来新帧」把它显示出来，别让人以为卡死了 */
  var lastFrameAt = 0, bufShown = 0, restartTried = 0, everFrame = 0, srcAspect = 0;
  /* 字幕：默认打开；B站要登录才有字幕（接口返回 need_login 时提示一次） */
  var subOn = localStorage.getItem('bili-sub') !== '0';
  /* 横屏画面已经吃满屏，字幕会挡内容，所以默认关 */
  var subOnLand = localStorage.getItem('bili-sub-land') === '1';
  var subs = [], subsEl = document.getElementById('subs'), subHinted = 0, subReq = 0;
  var shotAt = (function(){ var m = /shotat=(\d+)/.exec(location.search); return m ? +m[1] : 20; })();
  var segs = [], segIdx = 0, segSkipUntil = -1;

  /* 播到广告/口播区间就跳到段尾；跳完要等时间追上目标，避免反复跳 */
  function adTick(sec){
    if (!segs.length || !ws || ws.readyState !== 1) return;
    if (segSkipUntil >= 0){
      if (sec + 0.5 < segSkipUntil) return;
      segSkipUntil = -1;
    }
    for (var i = 0; i < segs.length; i++){
      var s = segs[i];
      if (sec >= s.a && sec < s.b - 0.2){
        segSkipUntil = s.b;
        var ms = Math.max(0, Math.round(s.b * 1000));
        try { ws.send(new Uint8Array([5, ms & 255, (ms >> 8) & 255, (ms >> 16) & 255, (ms >> 24) & 255])); } catch(e){}
        statusEl.textContent = '已跳过' + (s.cat === 'intro' ? '片头' : (s.cat === 'selfpromo' ? '广告口播' : '插播段'));
        probe('ad-skip', s.cat + ' ' + s.a + '-' + s.b);
        return;
      }
    }
  }

  function loadSegments(bvid){
    segs = []; segIdx = 0; segSkipUntil = -1;
    fetch('/api/plugins/bili/segments?bvid=' + encodeURIComponent(bvid))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) return;
        segs = d.list || [];
        if (segs.length) probe('segments', String(segs.length));
      }).catch(function(){});
  }
  /* ?shot=1：播到第 20 帧时把画布内容按 RGB565 分块传给后端，用于真机截图 */
  var shotWant = false, shotDone = false, shotFrames = 0;
  try { shotWant = new URLSearchParams(location.search).get('shot') === '1'; } catch(e){}


  /* ---------- 设置 ---------- */
  var qnPref = 80, curCid = 0, currentPrepare = null;
  var settingsEl = document.getElementById('settings');
  var setDm = document.getElementById('setdm');
  var setSz = document.getElementById('setsz');
  var setQn = document.getElementById('setqn');

  function saveCfg(k, v){ try { localStorage.setItem('bili.' + k, String(v)); } catch(e){} }
  function loadCfg(k, d){
    try { var v = localStorage.getItem('bili.' + k); return v === null ? d : v; } catch(e){ return d; }
  }

  var QN_TEXT = {16: '360P', 32: '480P', 64: '720P', 80: '1080P'};
  function syncCfgUi(){
    setDm.textContent = dmOn ? '开' : '关';
    setSz.textContent = dmSize <= 14 ? '小' : (dmSize >= 20 ? '大' : '中');
    setQn.textContent = QN_TEXT[qnPref] || '720P';
    var ldm = document.getElementById('land-dm');
    if (ldm) ldm.textContent = dmOn ? '弹幕 开' : '弹幕 关';
  }

  (function initCfg(){
    var d = loadCfg('dm', '1');
    dmOn = d === '1';
    var sz = +loadCfg('sz', '14');
    if (sz === 17 || sz === 20 || sz === 14) dmSize = sz;
    var qn = +loadCfg('qn', '64');
    if (qn === 16 || qn === 32 || qn === 64) qnPref = qn;
    syncCfgUi();
  })();

  document.getElementById('cfg').addEventListener('click', function(){
    syncCfgUi();
    settingsEl.classList.add('on');
  });
  document.getElementById('setclose').addEventListener('click', function(){
    settingsEl.classList.remove('on');
  });
  setDm.addEventListener('click', function(){
    dmOn = !dmOn;
    saveCfg('dm', dmOn ? '1' : '0');
    if (!dmOn) dmLive.length = 0;
    syncCfgUi();
  });
  setSz.addEventListener('click', function(){
    dmSize = dmSize <= 14 ? 17 : (dmSize === 17 ? 20 : 14);
    saveCfg('sz', dmSize);
    syncCfgUi();
  });
  /* 画质固定 720P：这个账号是大会员，但单文件 MP4 接口最多只给 720P，
     1080P 要走 DASH 分轨再合并，属于另一套方案，先不放进设置里误导人。 */
  document.getElementById('setclear').addEventListener('click', function(){
    fetch('/api/plugins/bili/clear-cache').then(function(r){ return r.json(); })
      .then(function(){ statusEl.textContent = '视频缓存已清空'; })
      .catch(function(){});
  });
  document.getElementById('setlogout').addEventListener('click', function(){
    fetch('/api/plugins/bili/logout').then(function(r){ return r.json(); })
      .then(function(){ setAcc(''); statusEl.textContent = '已退出登录'; })
      .catch(function(){});
  });

  /* ---------- 登录（扫码） ---------- */
  var accBtn = document.getElementById('acc');
  var loginEl = document.getElementById('login');
  var qrImg = document.getElementById('qrimg');
  var qrMsg = document.getElementById('qrmsg');
  var qrTimer = null;

  function stopQr(){
    if (qrTimer){ clearInterval(qrTimer); qrTimer = null; }
  }

  function setAcc(name){
    if (name){ accBtn.textContent = name; accBtn.dataset.on = '1'; }
    else { accBtn.textContent = '登录'; accBtn.dataset.on = ''; }
  }

  function checkLogin(){
    fetch('/api/plugins/bili/login-state').then(function(r){ return r.json(); })
      .then(function(d){ setAcc(d && d.logged ? (d.uname || '已登录') : ''); })
      .catch(function(){});
  }

  /* 二维码用页面里的 JS 画（设备上的 qrencode 不支持 PNG 输出） */
  function drawQr(url){
    var q = qrcode(0, 'M');
    q.addData(url, 'Byte');
    q.make();
    var n = q.getModuleCount();
    var cv = qrImg;
    /* 320 像素宽的屏幕上尽量画大一点，159px 的二维码手机不好对焦 */
    var scale = Math.max(2, Math.floor(282 / (n + 4)));
    var px = scale * (n + 4);
    cv.width = px; cv.height = px;
    cv.style.width = px + 'px'; cv.style.height = px + 'px';
    var g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, px, px);
    g.fillStyle = '#000';
    for (var y = 0; y < n; y++)
      for (var x = 0; x < n; x++)
        if (q.isDark(y, x)) g.fillRect((x + 2) * scale, (y + 2) * scale, scale, scale);
    probe('qr-drawn', n + 'x' + n + ' px=' + px);
  }

  function startQr(){
    stopQr();
    qrImg.style.display = '';
    qrMsg.textContent = '正在获取二维码…';
    fetch('/api/plugins/bili/login-qr').then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok){ qrMsg.textContent = '二维码获取失败：' + ((d && d.error) || '未知'); return; }
        drawQr(d.url);
        qrMsg.textContent = '用哔哩哔哩 App 扫码登录';
        qrTimer = setInterval(function(){
          fetch('/api/plugins/bili/login-poll').then(function(r){ return r.json(); })
            .then(function(p){
              if (!p || !p.ok) return;
              if (p.state === 'scanned'){ qrMsg.textContent = '已扫码，请在手机上点确认'; }
              else if (p.state === 'expired'){
                stopQr(); qrMsg.textContent = '二维码过期，正在重新获取…';
                setTimeout(startQr, 800);
              } else if (p.state === 'ok'){
                stopQr();
                qrMsg.textContent = '登录成功：' + (p.uname || '');
                probe('login', p.uname || '');
                setTimeout(function(){
                  loginEl.classList.remove('on');
                  setAcc(p.uname || '已登录');
                  checkLogin();

  loadHome(homeTab);
                }, 900);
              }
            }).catch(function(){});
        }, 2000);
      }).catch(function(){ qrMsg.textContent = '二维码获取失败'; });
  }

  accBtn.addEventListener('click', function(){
    loginEl.classList.add('on');
    fetch('/api/plugins/bili/login-state').then(function(r){ return r.json(); })
      .then(function(d){
        if (d && d.logged){
          stopQr();
          qrImg.style.display = 'none';
          qrMsg.textContent = '已登录：' + (d.uname || '') + (d.vip ? '（大会员）' : '');
        } else {
          startQr();
        }
      }).catch(function(){ startQr(); });
  });

  document.getElementById('qclose').addEventListener('click', function(){
    stopQr();
    loginEl.classList.remove('on');
  });

  document.getElementById('qlogout').addEventListener('click', function(){
    stopQr();
    fetch('/api/plugins/bili/logout').then(function(r){ return r.json(); })
      .then(function(){ setAcc(''); qrMsg.textContent = '已退出'; qrImg.style.display = 'none'; })
      .catch(function(){});
  });

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function dur(s){
    s = Number(s) || 0;
    var m = Math.floor(s / 60), ss = s % 60;
    return m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  /* 调试探针：默认关闭，只在 URL 带 ?probe=1 时启用。
     绝对不能放在每帧路径上：每帧发一次 fetch 会把页面主线程打满，
     结果就是"有声音、画面卡住、进度条不动"（实测 17482 帧 → 17482 个请求）。 */
  var PROBE_ON = false;
  try{ PROBE_ON = new URLSearchParams(location.search).get('probe') === '1'; }catch(e){}
  function probe(status, info){
    if (!PROBE_ON) return;
    try{
      fetch('/api/plugins/bili/probe', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({status: status, info: info || ''})});
    }catch(e){}
  }

  function render(){
    var h = '';
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      var meta = esc(it.author || '');
      if (it.durtxt) meta += (meta ? ' · ' : '') + esc(it.durtxt);
      else if (it.dur) meta += (meta ? ' · ' : '') + dur(it.dur);
      if (it.play) meta += (meta ? ' · ' : '') + (it.play > 10000 ? (Math.round(it.play / 10000) + '万') : it.play) + (it.live ? ' 人气' : ' 播放');
      h += '<div class="card' + (i === selIdx ? ' sel' : '') + '" data-i="' + i + '">' +
           '<img loading="lazy" src="/api/plugins/bili/img?u=' + encodeURIComponent(it.pic) + '" alt="">' +
           '<div class="info"><div class="t">' + esc(it.title) + '</div>' +

  /* ---------- 播放结束 -> 相关视频 + 5 秒自动连播 ---------- */
  var autoNextTimer = 0, autoNextList = [], autoNextSel = 0, autoNextOn = false;

  function onPlaybackEnded(){
    autoNextOn = true;
    autoNextSel = 0;
    autoNextList = [];
    try{ loadTip(true, '播放结束 · 正在找相关视频…', 0); }catch(e){}
    var it = nowPlaying();
    if (!it || !it.bvid){ finishEnded(); return; }
    fetch('/api/plugins/bili/related?bvid=' + encodeURIComponent(it.bvid))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!autoNextOn) return;
        autoNextList = (d && d.ok) ? (d.list || []) : [];
        relItems = autoNextList;
        if (!autoNextList.length){ finishEnded(); return; }
        startAutoNextCountdown(5);
      })
      .catch(function(){ if (autoNextOn) finishEnded(); });
  }

  function clearAutoNext(){
    if (autoNextTimer){ clearTimeout(autoNextTimer); autoNextTimer = 0; }
  }

  function startAutoNextCountdown(sec){
    clearAutoNext();
    var left = sec;
    var first = autoNextList[0] || {};
    function tick(){
      if (!autoNextOn) return;
      if (left <= 0){
        autoNextOn = false;
        clearAutoNext();
        try{ loadTip(false, '', 0); }catch(e){}
        playRelated(0);
        return;
      }
      try{ loadTip(true, '播放结束 · ' + left + ' 秒后播放：' + (first.title || ''), 0); }catch(e){}
      left--;
      autoNextTimer = setTimeout(tick, 1000);
    }
    tick();
  }

  /* 用户有任何按键/触摸就取消自动连播 */
  function cancelAutoNext(){
    if (!autoNextOn) return false;

    try{ loadTip(false, '', 0); }catch(e){}
    statusEl.textContent = '已取消自动连播';
    return true;
  }

  function finishEnded(){

  var dmAll = [], dmIdx = 0, dmLive = [], dmTrack = 0;
  /* 这里不能再赋初值：initCfg 已经从 localStorage 读回来了，
     再写一次 true/14 会把用户设置覆盖掉（之前弹幕设置存不住就是这个） */
  var dmOn, dmSize;
  var dmLastMs = 0;

  function loadDanmaku(cid){
    dmAll = []; dmIdx = 0; dmLive.length = 0;
    if (!cid || !dmOn) return;
    fetch('/api/plugins/bili/danmaku?cid=' + cid).then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) return;
        var list = d.list || [];
        list.sort(function(a, b){ return a.t - b.t; });
        dmAll = list;
        probe('danmaku', String(list.length));
      }).catch(function(){});
  }

  function dmSpawn(it){
    if (it.m === 4 || it.m === 5){
      dmLive.push({ x: 0, y: it.m === 5 ? 14 : cv.height - 26, text: it.x,
                    color: it.c, fixed: true, born: curMs, w: 0 });
      return;
    }
    dmTrack = (dmTrack + 1) % 6;
    dmLive.push({ x: cv.width + 8, y: 16 + dmTrack * 20, text: it.x,
                  color: it.c, fixed: false, born: curMs, w: 0 });
  }

  function dmColor(c){
    var s = (c >>> 0).toString(16);
    while (s.length < 6) s = '0' + s;
    return '#' + s;
  }

  function drawDanmaku(ms, dt){
    if (!dmOn || !dmAll.length) return;
    /* 跳转后时间会突变：别把中间几千条一次性倒出来 */
    if (ms < dmLastMs - 500 || ms > dmLastMs + 1500){
      dmLive.length = 0;
      dmIdx = 0;
      while (dmIdx < dmAll.length && dmAll[dmIdx].t * 1000 < ms) dmIdx++;
    }
    while (dmIdx < dmAll.length && dmAll[dmIdx].t * 1000 <= ms){ dmSpawn(dmAll[dmIdx]); dmIdx++; }
    var g = cctx;
    g.textBaseline = 'top';
    g.font = dmSize + 'px "Noto Sans CJK SC",sans-serif';
    for (var i = dmLive.length - 1; i >= 0; i--){
      var e = dmLive[i];
      if (!e.w) e.w = g.measureText(e.text).width;
      if (e.fixed){
        if (ms - e.born > 3200){ dmLive.splice(i, 1); continue; }
        e.x = (cv.width - e.w) / 2;
      } else {
        if (ms - e.born > 9000){ dmLive.splice(i, 1); continue; }
        e.x -= 0.115 * dt;
        if (e.x + e.w < -4){ dmLive.splice(i, 1); continue; }
      }
      g.lineWidth = 3;
      g.strokeStyle = 'rgba(0,0,0,.72)';
      g.strokeText(e.text, e.x, e.y);
      g.fillStyle = dmColor(e.color);
      g.fillText(e.text, e.x, e.y);
    }
  }

  /* ---------- 播放进度记忆 ----------
     和手机客户端一样按视频记住"看到哪了"：退出、暂停、每 5 秒存一次，
     再进来同一部片子自动跳回去；快到结尾（最后 15 秒）就当作看完了清掉。 */
  var POS_KEY = 'bili-pos', posLastSave = 0;
  function posAll(){
    try{ var v = JSON.parse(localStorage.getItem(POS_KEY) || '{}'); return (v && typeof v === 'object') ? v : {}; }
    catch(e){ return {}; }
  }
  function posSave(bvid, ms, durS){
    if (!bvid || !(ms > 1000)) return;
    var all = posAll(), keep = {}, ks = Object.keys(all), n = 0;
    for (var i = ks.length - 1; i >= 0 && n < 200; i--){ keep[ks[i]] = all[ks[i]]; n++; }
    keep[bvid] = { p: Math.round(ms), d: Math.round(durS || 0), t: Date.now() };
    try{ localStorage.setItem(POS_KEY, JSON.stringify(keep)); }catch(e){}
  }
  function posGet(bvid){
    var r = posAll()[bvid];
    return (r && r.p > 5000) ? r : null;
  }
  function posClear(bvid){
    var all = posAll();
    if (!all[bvid]) return;
    delete all[bvid];
    try{ localStorage.setItem(POS_KEY, JSON.stringify(all)); }catch(e){}
  }
  function nowPlaying(){
    /* 当前视频就是 items[curIndex]；这个页面没有 current 变量 */
    return items[curIndex] || null;
  }
  function syncCloudHeartbeat(bvid, cid, posMs){
    if (!bvid || !cid || !(posMs > 0)) return;
    try{
      fetch('/api/plugins/bili/heartbeat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          bvid: bvid,
          cid: cid,
          played_time: Math.round(posMs / 1000)
        })
      }).catch(function(){});
    }catch(e){}
  }

  function saveNow(){
    try{
      var it = nowPlaying();
      if (!inPlayer || !it) return;
      var pos = playerMs();
      posSave(posKey(it.bvid, curCid), pos, curDurS);
      posLastSave = Date.now();
      syncCloudHeartbeat(it.bvid, curCid, pos);
    }catch(e){ /* 存档失败绝不能影响退出播放 */ }
  }
  function posKey(bvid, cid){ return cid ? bvid + '@' + cid : bvid; }

  /* 字幕：二分找当前时间那一行；换了视频要重新拉 */
  function loadSubs(bvid, cid){
    /* 切视频时上一个请求可能还在飞：先作废所有在飞的请求（包括下面提前 return 的分支），
       只认最后一次请求的结果，否则会把旧视频的字幕贴上来 */
    var my = ++subReq;
    subs = [];
    if (subsEl) subsEl.style.display = 'none';
    if (!subOn || !cid) return;
    fetch('/api/plugins/bili/subtitle?bvid=' + encodeURIComponent(bvid) + '&cid=' + cid)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (my !== subReq) return;
        if (!d || !d.ok){
          probe('subs-fail', bvid + ' ' + (d && d.error ? d.error : '?'));
          return;
        }
        subs = d.list || [];
        probe('subs', bvid + ' cid=' + cid + ' lan=' + (d.lan || '-') + ' n=' + subs.length);
        if (!subs.length && d.need_login && !subHinted){
          subHinted = 1;
          statusEl.textContent = '这个视频的字幕需要登录后才能看';
        }
      })
      .catch(function(){});
  }
  function tickSubs(ms){
    if (!subsEl) return;
    if (!subOn || !subs.length || (rotOn() && !subOnLand)){
      if (subsEl.style.display !== 'none') subsEl.style.display = 'none';
      return;
    }
    var lo = 0, hi = subs.length;
    while (lo < hi){ var mid = (lo + hi) >> 1; if (subs[mid].b <= ms) lo = mid + 1; else hi = mid; }
    var line = subs[lo];
    if (line && ms >= line.a && ms < line.b){
      if (subsEl.textContent !== line.t) subsEl.textContent = line.t;
      if (subsEl.style.display !== 'block') subsEl.style.display = 'block';
    } else if (subsEl.style.display !== 'none'){
      subsEl.style.display = 'none';
    }
  }

  /* 后端推来的一帧：8 字节头（宽、高各 u16 + 毫秒 u32，小端）+ RGB565 像素 */
  function onFrame(buf){
    var b = new Uint8Array(buf);
    if (b.length < 8) return;
    var w = b[0] | (b[1] << 8), h = b[2] | (b[3] << 8);
    var ms = (b[4] | (b[5] << 8) | (b[6] << 16) | (b[7] << 24)) >>> 0;
    if (w < 2 || h < 2) return;
    curMs = ms;
    lastFrameAt = Date.now();
    if (!everFrame){
      var fe = document.getElementById('frame');
      probe('out', 'req=' + (window.__maxWant || 0) + ' frame=' + w + 'x' + h +
            ' show=' + (fe ? (fe.style.width + 'x' + fe.style.height) : '-') +
            ' rot=' + (rotOn() ? 1 : 0) +
            ' screen=' + screenEl.clientWidth + 'x' + screenEl.clientHeight);
    }
    everFrame = 1;
    playOffsetMs = ms; playTickAt = Date.now();
    if (bufShown){ bufShown = 0; statusEl.textContent = '播放中'; }
    adTick(ms / 1000);
    if (!srcAspect && w > 1 && h > 1) srcAspect = w / h;
    if (cv.width !== w || cv.height !== h){
      /* 取证：换片/切横竖屏时尺寸不一致，是花屏的主要嫌疑 */
      probe('frame-resize', cv.width + 'x' + cv.height + ' -> ' + w + 'x' + h + ' bytes=' + b.length);
      cv.width = w; cv.height = h; img = null;
      layout();
    } else if (b.length !== 8 + w * h * 2){
      /* 帧头尺寸和实际负载对不上：解码/传输层有问题 */
      probe('frame-mismatch', w + 'x' + h + ' expect=' + (8 + w * h * 2) + ' got=' + b.length);
    }
    /* img 也要按帧尺寸校验，不能只看画布：换片时尺寸一样但缓存是旧的 */
    if (!img || img.width !== w || img.height !== h) img = cctx.createImageData(w, h);
    var d = img.data, o = 8, n = w * h;
    for (var i = 0, p = 0; i < n; i++, p += 4){
      var v = b[o] | (b[o + 1] << 8); o += 2;
      var r = (v >> 11) & 0x1f, g = (v >> 5) & 0x3f, bl = v & 0x1f;
      d[p] = (r << 3) | (r >> 2);
      d[p + 1] = (g << 2) | (g >> 4);
      d[p + 2] = (bl << 3) | (bl >> 2);
      d[p + 3] = 255;
    }
    cctx.putImageData(img, 0, 0);
    var dt = ms - dmLastMs;
    if (!(dt > 0 && dt < 400)) dt = 35;
    drawDanmaku(ms, dt);
    tickSubs(ms);
    dmLastMs = ms;
    if (shotWant && !shotDone && ++shotFrames >= shotAt){ shotDone = true; shotUpload(w, h); }
  }

  /* 从画布读回像素再上传：证明的是“画布上真的有画面”，不是收到的原始帧 */
  function shotUpload(w, h){
    try{
      var d = cctx.getImageData(0, 0, w, h).data;
      var bytes = new Uint8Array(w * h * 2);
      for (var i = 0, p = 0, o = 0; i < w * h; i++, p += 4){
        var r = d[p] >> 3, g = d[p + 1] >> 2, b = d[p + 2] >> 3;
        var v = (r << 11) | (g << 5) | b;
        bytes[o++] = v & 0xff; bytes[o++] = v >> 8;
      }
      var b64 = '', i2 = 0, STEP = 6000, n = bytes.length;
      while (i2 < n){
        var sl = bytes.subarray(i2, Math.min(i2 + STEP, n));
        var arr = new Array(sl.length);
        for (var k = 0; k < sl.length; k++) arr[k] = String.fromCharCode(sl[k]);
        b64 += btoa(arr.join(''));
        i2 += STEP;
      }
      var CH = 3000, parts = ['w=' + w + ',h=' + h + ',n=' + n + ';'];
      for (var p2 = 0; p2 < b64.length; p2 += CH) parts.push(b64.slice(p2, p2 + CH));
      var idx = 0;
      function send(){
        if (idx >= parts.length){ probe('shot-done', w + 'x' + h + ' parts=' + parts.length); return; }
        var my = idx++;
        fetch('/api/plugins/bili/shot', {method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({part: my, b64: parts[my]})}).then(send).catch(function(e){ probe('shot-fail', String(e)); });
      }
      send();
    }catch(e){ probe('shot-fail', String(e)); }
  }

  var connectTimer = null;
  function closeWs(){
    if (connectTimer){ clearTimeout(connectTimer); connectTimer = null; }
    if (ws){
      try {
        ws.onopen = null;
        ws.onmessage = null;
        ws.onerror = null;
        ws.onclose = null;
        ws.close();
      } catch(e){}
      ws = null;
    }
  }

  function connectPlayer(port, tries){
    closeWs();
    tries = tries || 0;
    var url = 'ws://127.0.0.1:' + port;
    probe('ws-connect', url + ' try=' + tries);
    var thisWs = new WebSocket(url);
    ws = thisWs;
    thisWs.binaryType = 'arraybuffer';
    thisWs.onopen = function(){
      if (ws !== thisWs) return;
      statusEl.textContent = '播放中';
      if (pendingSeekMs >= 0){
        var at = pendingSeekMs; pendingSeekMs = -1;
        try{ thisWs.send(seekCmd(at)); }catch(e){}
        playOffsetMs = at; playTickAt = Date.now();
      } else {
        playOffsetMs = 0;
      }
      playTickAt = Date.now(); playing = true;
      probe('ws-open', url);
    };
    thisWs.onmessage = function(ev){
      if (ws !== thisWs) return;
      onFrame(ev.data);
    };
    thisWs.onerror = function(err){
      if (ws !== thisWs) return;
      probe('ws-error', url);
    };
    thisWs.onclose = function(e){
      if (ws !== thisWs) return;
      ws = null;
      probe('ws-close-live', 'code=' + (e ? e.code : '') + ' clean=' + (e ? e.wasClean : '') + ' try=' + tries);
      /* 播放断了就把宿主菜单还回去，别让人卡在全屏黑屏里出不来 */
      hostChrome(false);
      if (!inPlayer) return;
      /* 播放器进程刚起来时索引（moov）可能还没下载完：大片光读索引就要
         8~10 秒，文件本身还没下到那么远时播放器会一直等。这里给它 180 次
         （约 90 秒）窗口，期间明确显示"正在索引"，不要让人以为卡死了。 */
      if (tries < 180 && !everFrame){
        statusEl.textContent = tries < 6 ? '连接播放器…'
                            : ('正在索引视频… ' + Math.round(tries * 0.5) + 's');
        if (tries === 6) probe('ws-slow-index', 'waiting for player to listen');
        connectTimer = setTimeout(function(){
          if (inPlayer) connectPlayer(port, tries + 1);
        }, 500);
        return;
      }
      /* 只有"放过画面之后"的断线才算播放结束 */
      if (everFrame){
        statusEl.textContent = '播放结束';
        probe('ws-close', 'ended code=' + (e ? e.code : ''));
        onPlaybackEnded();
        return;
      }
      statusEl.textContent = '播放器没有响应，点画面重试或返回';
      probe('ws-close', 'start-failed tries=' + tries + ' code=' + (e ? e.code : ''));
      try{ loadTip(true, '播放器启动失败 · 按 OK 重试', 0); }catch(err){}
    };
  }

  /* 后台下载是异步的，这里轮询到 ready 为止（最多 150 秒） */
  function waitReady(n, my){
    return fetch('/api/plugins/bili/ready?wk=' + wmKb).then(function(r){ return r.json(); }).then(function(d){
      /* 换了视频就停止轮询，别让上一次的下载把界面文字改回去 */
      if (my !== undefined && my !== playToken) return null;
      /* 门槛一到就先开播放器：e5play 启动要 2 秒左右，
         这段时间正好和剩下的下载重叠。 */
      if (d && (d.ready || (d.bytes && d.bytes >= wmKb * 1024))) return d;
      if (d && d.state === 'failed'){ probe('dl-failed', String(d.code)); return null; }
      if (d && d.state === 'downloading' && d.bytes) statusEl.textContent = '下载中… ' + Math.round(d.bytes / 1048576) + 'MB';
      if (n > 500) return null;
      statusEl.textContent = '下载中… ' + n + 's';
      /* 300ms 一轮：门槛只有半兆，一秒一轮会白白多等近一秒 */
      return new Promise(function(res){ setTimeout(function(){ res(waitReady(n + 1, my)); }, 300); });
    });
  }

  var bgAudio = localStorage.getItem('bili-bg') === '1';
  /* 起播门槛，单位 KB。512KB 足够解出开头几帧。 */
  var wmKb = +(localStorage.getItem('bili-wk') || 512);
  if (!(wmKb > 0) || wmKb < 256 || wmKb > 65536) wmKb = 512;
  function wmLabel(){ return wmKb >= 1024 ? (wmKb / 1024) + 'MB' : wmKb + 'KB'; }
  var bgPlaying = false, lastPort = 9511;

  function syncBg(){
    var b = document.getElementById('setbg');
    if (b) b.textContent = bgAudio ? '开' : '关';
  }

  var playToken = 0;

  function play(i){
    var it = items[i];
    if (!it) return;
    curIndex = i;
    var my = ++playToken;
    /* 取流和下载也要禁止息屏：下载几十兆要好几分钟，空闲计时器 60 秒就会锁屏 */
    try{ if (typeof e5 !== 'undefined' && e5.keepAwake) e5.keepAwake(true); }catch(e){}
    /* 先把上一个播放器收掉：不停就开下一个，端口和缓存文件都被占着，
       第二个视频会一直卡在加载。 */
    closeWs();
    pendingSeekMs = -1;
    srcAspect = 0;
    lastFrameAt = 0;
    restartTried = 0;
    everFrame = 0;
    img = null;
    bgPlaying = false;
    inPlayer = false;
    player.classList.remove('on');
    listEl.style.display = '';
    statusEl.textContent = '准备中…';
    probe('play-start', it.bvid);
    syncRelation(it.bvid);
    fetch('/api/plugins/bili/player-stop').then(function(r){ return r.json(); }).catch(function(){}).then(function(st){
      /* 只有确实停掉了旧播放器才需要等它释放缓存文件 */
      return new Promise(function(res){ setTimeout(res, (st && st.stopped) ? 400 : 0); });
    }).then(function(){
      if (my !== playToken) return null;
      statusEl.textContent = '取流与缓存中…';
      return fetch('/api/plugins/bili/prepare?bvid=' + encodeURIComponent(it.bvid) +
                    '&cid=' + (it.cid || 0) + '&qn=' + qnPref);
    })
      .then(function(r){ return r ? r.json() : null; })
      .then(function(d){
        if (my !== playToken) return null;
        curDurS = it.dur || 0;
        probe('prepare-done', d ? (d.ok ? 'ok' : ('err:' + d.error)) : 'null');
        if (!d || !d.ok){ statusEl.textContent = '取流失败：' + ((d && d.error) || '?'); return null; }
        curCid = d.cid || it.cid || 0;
        currentPrepare = d;
        pinfo.textContent = it.title;
    var lt = document.getElementById('land-title'); if (lt) lt.textContent = it.title;
        statusEl.textContent = '下载中…';
        return waitReady(0, my);
      })
      .then(function(d){
        if (my !== playToken) return null;
        restartTried = 0; everFrame = 0;
        if (!d){ statusEl.textContent = '下载失败'; return null; }
        pinfo.textContent = it.title + ' · ' + Math.round((d.size || d.bytes || 0) / 1048576) + 'MB';
    var lt2 = document.getElementById('land-title'); if (lt2) lt2.textContent = it.title;
        loadSegments(it.bvid);
        loadDanmaku(curCid);
        loadSubs(it.bvid, curCid);
        statusEl.textContent = '启动播放器…';
        return fetch('/api/plugins/bili/player-start?max=' + (window.__maxWant || 480) +
                     '&lead=' + leadMs).then(function(r){ return r.json(); });
      })
      .then(function(st){
        if (my !== playToken) return null;
        probe('start-done', st ? (st.ok ? 'ok' : ('err:' + st.error)) : 'null');
        if (!st || !st.ok){ if (st) statusEl.textContent = '播放器启动失败：' + (st.error || '?'); return; }
        inPlayer = true;
        document.body.classList.add('in-player');
        lastPort = st.port || 9511;
        listEl.style.display = 'none';
        player.classList.add('on');
        /* 进播放器时先按当前横竖屏设置摆一次画面 */
        try{ layout(); }catch(e){}
        /* 对比云端历史进度与本地进度，取更新、更靠后的位置断点续看 */
        var localResume = posGet(posKey(it.bvid, curCid)) || posGet(it.bvid);
        var cloudMs = (currentPrepare && currentPrepare.cloud_ms) ? currentPrepare.cloud_ms : 0;
        var resumeMs = Math.max(localResume ? localResume.p : 0, cloudMs);
        if (resumeMs > 5000 && (!(it.dur) || resumeMs < (it.dur * 1000) - 15000)){
          pendingSeekMs = resumeMs;
          var rm = Math.floor(resumeMs / 60000), rs = Math.floor((resumeMs % 60000) / 1000);
          var isCloud = cloudMs > (localResume ? localResume.p : 0);
          statusEl.textContent = (isCloud ? '云端进度：' : '从上次位置继续 ') + rm + ':' + (rs < 10 ? '0' : '') + rs;
        }
        /* 播放期间别让宿主息屏锁屏，否则会被踢回桌面（声音还在） */
        try{ if (typeof e5 !== 'undefined' && e5.keepAwake) e5.keepAwake(true); }catch(e){}
        /* 续播先问后端目标位置的数据到底在不在。
           不在（waiting）就**不要** seek：seek 到未下载区域会让播放器一直
           等数据——音频由 ffmpeg 从该位置直接解码，所以有声音；视频一帧
           都出不来，进度条也不动。这时改为从头播放，画面立刻就能出来。
           数据已经下载到才真正续播。 */
        if (pendingSeekMs > 0 && curDurS > 0){
          statusEl.textContent = '检查续播位置…';
          return fetch('/api/plugins/bili/seek?ms=' + Math.round(pendingSeekMs) +
                       '&dur=' + Math.round(curDurS * 1000))
            .then(function(r){ return r.json(); })
            .then(function(sd){
              probe('resume-seek', sd ? ('need=' + sd.need + ' off=' + (sd.off || 0) +
                                         ' waiting=' + (sd.waiting ? 1 : 0)) : 'null');
              if (!sd || sd.waiting || sd.error){
                /* 目标位置还没下载到：从头播，别让用户对着黑屏等 */
                pendingSeekMs = -1;
                var rm = Math.floor(resumeMs / 60000), rs = Math.floor((resumeMs % 60000) / 1000);
                try{ loadTip(true, '上次看到 ' + rm + ':' + (rs < 10 ? '0' : '') + rs +
                                   '，这些数据还没下载到，先从头播放', 4000); }catch(e){}
                probe('resume-from-head', 'target=' + Math.round(resumeMs));
              }
            })
            .catch(function(){ pendingSeekMs = -1; })
            .then(function(){ connectPlayer(lastPort, 0); });
        }
        connectPlayer(lastPort, 0);
      })
      .catch(function(e){ probe('play-fail', String(e)); statusEl.textContent = '请求失败 ' + e; });
  }


  /* ---------- 进度与跳转 ---------- */
  /* e5play 的命令：byte 4 = 暂停/继续，byte 5 + 4 字节小端毫秒 = 跳到指定位置。
     播放器不回传当前时间，所以这里按墙钟估算。 */
  var playOffsetMs = 0, playTickAt = 0, playing = false, curDurS = 0;

  function playerMs(){
    /* 缓冲（没有新帧）时进度就停在最后一帧，不能按墙钟继续跑，
       否则快进到未下载区时会显示一个根本还没播到的时间 */
    if (bufShown) return playOffsetMs;
    return playOffsetMs + (playing ? (Date.now() - playTickAt) : 0);
  }

  var pendingSeekMs = -1;
  /* 跳转命令：byte 5 + 4 字节小端毫秒 */
  function seekCmd(ms){
    var b = new Uint8Array(5);
    b[0] = 5;
    b[1] = ms & 0xff; b[2] = (ms >> 8) & 0xff;
    b[3] = (ms >> 16) & 0xff; b[4] = (ms >>> 24) & 0xff;
    return b;
  }
  function seekBy(deltaMs){
    if (!ws || ws.readyState !== 1) return;
    var target = Math.max(0, playerMs() + deltaMs);
    if (curDurS > 0 && target > curDurS * 1000) target = curDurS * 1000;
    /* 往前跳时让后端从目标位置续传，跳过的那几十兆不用等 */
    if (deltaMs > 0 && curDurS > 0){
      fetch('/api/plugins/bili/seek?ms=' + Math.round(target) + '&dur=' + Math.round(curDurS * 1000))
        .then(function(r){ return r.json(); })
        .then(function(d){ if (d && d.need) statusEl.textContent = '从目标位置续传…'; })
        .catch(function(){});
    }
    try{ ws.send(seekCmd(target)); }catch(e){ return; }

  function onKey(kind, key){
    /* 输入法开着时所有键先给它：2-9 在这里是拼音键，不能再拿去切首页 */
    if (window.E5IME && E5IME.isOpen()){
      if (E5IME.key(kind, key)) return true;
    }
    if (settingsEl.classList.contains('on')){
      if (kind === 'back'){ settingsEl.classList.remove('on'); return true; }
      return false;
    }
    if (loginEl.classList.contains('on')){
      if (kind === 'back'){ loginEl.classList.remove('on'); stopQr(); return true; }
      return false;
    }
    /* 列表页：0 打开搜索，1-9 键直切前 9 个主要分类 */
    if (!inPlayer && kind === 'digit'){
      if (key === '0'){ if (window.E5IME) E5IME.open(); return true; }
      var numIdx = parseInt(key, 10) - 1;
      if (numIdx >= 0 && numIdx < HOME_ORDER.length){
        loadHome(HOME_ORDER[numIdx]);
        return true;
      }

      /* 播放刚结束、正在倒计时自动连播：任何键都先取消，再交回原逻辑 */

        if (listEl) listEl.style.display = '';
        return true;
      }
      /* 相关推荐打开时：上下选择、OK 播放、返回/4 关闭 */
      if (relOpen){
        if (kind === 'back' || (kind === 'digit' && key === '4')){ closeRelated(); return true; }
        if (kind === 'up'){ moveRelated(-1); return true; }
        if (kind === 'down'){ moveRelated(1); return true; }
        if (kind === 'ok'){ playRelated(relSel); return true; }
        return true;
      }
      /* 评论区打开时：上下方向键滚动评论，3 键或返回键关闭评论区 */
      if (commOpen){
        if (kind === 'back' || (kind === 'digit' && key === '3')){ closeComments(); return true; }
        if (kind === 'up'){ if (commList) commList.scrollTop -= 60; return true; }
        if (kind === 'down'){ if (commList) commList.scrollTop += 60; return true; }
        return true;
      }
      /* 播放器快捷键：1 点赞 / 取消点赞，2 收藏 / 取消收藏，3 打开/关闭评论区 */
      if (kind === 'digit' && key === '1'){ toggleLike(); return true; }
      if (kind === 'digit' && key === '2'){ toggleFav(); return true; }
      if (kind === 'digit' && key === '3'){ toggleComments(); return true; }
      if (kind === 'digit' && key === '4'){ toggleRelated(); return true; }
      if (kind === 'digit' && key === '5'){ cycleBrightness(); return true; }
      if (kind === 'ok'){ cv.click(); return true; }
      /* 横屏时画面转了 90°：画面的左/右对应物理的上/下，按键跟着转 */
      if (rotOn()){
        if (kind === 'up'){ seekBy(-10000); return true; }
        if (kind === 'down'){ seekBy(10000); return true; }
      } else {
        if (kind === 'left'){ seekBy(-10000); return true; }
        if (kind === 'right'){ seekBy(10000); return true; }
      }
      if (kind === 'back'){
        /* 横屏先回竖屏（符合直觉：退一步先退到竖屏），再按才退出播放 */
        if (rotOn()){

        probe('back', 'leave player mode=' + rotMode + ' bg=' + bgAudio);
        leavePlayer(); return true;

      return false;

    /* 列表页：左右方向键在全部 14 个分类间无缝循环切换并自动横向滚入视野 */

    if (kind === 'down'){ selectCard(selIdx < 0 ? 0 : selIdx + 1); return true; }
    if (kind === 'ok'){

  setInterval(function(){

      /* 出过画面后卡死超过 10 秒才尝试重启一次（出首帧前全权由 connectPlayer 等待索引，绝不误杀） */

          .catch(function(){});

    } else if (bufShown){ bufShown = 0; statusEl.textContent = '播放中'; }
    /* 时间与按钮状态跟着真实进度走 */
    var cur = Math.max(0, Math.round(playerMs() / 1000));
    var tot = curDurS > 0 ? Math.round(curDurS) : 0;
    var mm = function(v){ return (v < 10 ? '0' : '') + v; };
    var timeStr = mm(Math.floor(cur / 60)) + ':' + mm(cur % 60) + ' / ' +
                  (tot ? (mm(Math.floor(tot / 60)) + ':' + mm(tot % 60)) : '--:--');
    var tEl = document.getElementById('ptime');
    if (tEl) tEl.textContent = timeStr;

    var lpb = document.getElementById('land-play');
    if (lpb) lpb.textContent = playing ? '暂停' : '播放';

    /* 每 5 秒记一次进度；播到最后 15 秒就清掉，下次从头开始 */
    var playingItem = nowPlaying();
    if (inPlayer && playingItem && playing){
      var nowPos = playerMs();
      var pk = posKey(playingItem.bvid, curCid);
      if (curDurS > 0 && nowPos > curDurS * 1000 - 15000){

      } else if (Date.now() - posLastSave > 5000){
        posSave(pk, nowPos, curDurS);
        posLastSave = Date.now();
        syncCloudHeartbeat(playingItem.bvid, curCid, nowPos);

    }

    if (curDurS > 0){
      var ratio = Math.max(0, Math.min(1, (playerMs() / 1000) / curDurS));
      var wStr = (ratio * 100).toFixed(1) + '%';
      var fill = document.getElementById('pfill');
      if (fill) fill.style.width = wStr;
      var lfill = document.getElementById('land-fill');

    }
  }, 800);
  window.addEventListener('pagehide', function(){ hostChrome(false); }, true);
  /* 插件被切到后台/宿主把页面藏起来时，一定要把播放器停掉：
     否则 WS 还连着，解码和声音会继续在后台跑（表现就是"退出了还有声音"） */
  document.addEventListener('visibilitychange', function(){
    if (document.hidden && inPlayer && !bgAudio) stopPlayback();
  });
  window.addEventListener('pagehide', function(){
    try{ (new Image()).src = '/api/plugins/bili/player-stop?t=' + Date.now(); }catch(e){}
  });

  var setBgBtn = document.getElementById('setbg');
  if (setBgBtn) setBgBtn.addEventListener('click', function(){
    bgAudio = !bgAudio;
    localStorage.setItem('bili-bg', bgAudio ? '1' : '0');
    syncBg();
    statusEl.textContent = bgAudio ? '后台播放已开：返回时声音继续' : '后台播放已关';
  });
  syncBg();

  var setRotBtn = document.getElementById('setrot');
  if (setRotBtn){
    var ROT_NAME = ['竖屏', '横屏', '自动'];
    setRotBtn.textContent = ROT_NAME[rotMode] || '竖屏';
    setRotBtn.addEventListener('click', function(){
      rotMode = (rotMode + 1) % 3;
      try{
        localStorage.setItem('bili-rot', String(rotMode));
        localStorage.setItem('bili-rot-set', '1');
      }catch(x){}
      setRotBtn.textContent = ROT_NAME[rotMode];
      layout();
      if (inPlayer && ws && ws.readyState === 1){
        var m = window.__maxWant || 480;
        try{ ws.send(new Uint8Array([6, m & 0xff, (m >> 8) & 0xff])); }catch(e){}
      }
      statusEl.textContent = '横竖屏：' + ROT_NAME[rotMode] + '，下个视频或现在生效';
    });
  }

  var setWmBtn = document.getElementById('setwm');
  if (setWmBtn){
    setWmBtn.textContent = wmLabel();
    setWmBtn.addEventListener('click', function(){
      wmKb = wmKb === 512 ? 1024 : (wmKb === 1024 ? 2048 : (wmKb === 2048 ? 4096 : 512));
      localStorage.setItem('bili-wk', String(wmKb));
      setWmBtn.textContent = wmLabel();
      statusEl.textContent = '起播缓冲 ' + wmLabel() + '，下个视频生效';
    });
  }

  var QN_NAME = {16: '360P', 32: '480P', 64: '720P'};
  function syncQn(){ syncCfgUi(); }
  var setQnBtn = document.getElementById('setqn');
  if (setQnBtn) setQnBtn.addEventListener('click', function(){
    qnPref = qnPref === 16 ? 32 : (qnPref === 32 ? 64 : 16);
    saveCfg('qn', qnPref);
    syncCfgUi();
    if (inPlayer){
      statusEl.textContent = '切到 ' + (QN_NAME[qnPref] || qnPref) + '，重新缓冲…';
      play(curIndex);
    } else {
      statusEl.textContent = '画质 ' + (QN_NAME[qnPref] || qnPref) + '，下个视频生效';
    }
  });
  syncCfgUi();

  loadHome(homeTab);
  try{
    if (new URLSearchParams(location.search).get('autoplay') === '1'){
      var waiter = setInterval(function(){
        if (items.length){ clearInterval(waiter); play(0); }
      }, 500);
    }
  }catch(e){}
})();
</script>
</body>
</html>
