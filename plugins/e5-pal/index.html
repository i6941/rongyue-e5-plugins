<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>仙剑奇侠传</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }

#view {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: #000;
}
#screen {
  image-rendering: pixelated;
  image-rendering: -webkit-optimize-contrast;
  object-fit: contain;
  background: #000;
  transform-origin: center center;
}
#rotgroup {
  position: absolute; left: 6px; top: 6px; z-index: 9; display: flex; gap: 3px;
}
#rotgroup button {
  width: 34px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(20,16,12,0.55); border: 1px solid rgba(216,201,168,0.45); border-radius: 6px;
  color: #d8c9a8; -webkit-tap-highlight-color: transparent;
}
#rotgroup svg { width: 22px; height: 22px; display: block; }
#rotgroup button.on { background: rgba(216,201,168,0.85); border-color: #d8c9a8; color: #1a140c; }
#rotgroup button:active { background: rgba(216,201,168,0.35); }
/* 设置面板：按键重绑 + 说明 */
#btnset {
  position: absolute; right: 64px; top: 6px; z-index: 9;
  height: 30px; padding: 0 8px; border-radius: 15px;
  font: inherit; font-size: 12px; color: #d8c9a8;
  background: rgba(20,16,12,0.55); border: 1px solid rgba(216,201,168,0.45);
  -webkit-tap-highlight-color: transparent;
}
#btnset:active { background: rgba(216,201,168,0.35); color: #fff; }
#cfg {
  position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column;
  background: rgba(8,7,5,0.96); color: #e8dcc4;
}
#cfg.open { display: flex; }
#cfghead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  background: #14100c; border-bottom: 1px solid #3a3020; font-size: 13px; }
#cfghead .sp { flex: 1 1 auto; }
#cfghead button { height: 30px; padding: 0 12px; border-radius: 6px; font: inherit; font-size: 13px;
  color: #e8dcc4; background: #241c14; border: 1px solid #4a3c28; }
#cfglist { flex: 1 1 auto; overflow-y: auto; padding: 6px; }
#cfglist .row { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px;
  margin-bottom: 4px; background: #191410; border: 1px solid #332a1c; border-radius: 6px; font-size: 13px; }
#cfglist .row .nm { flex: 0 0 84px; color: #cbb995; }
#cfglist .row .kv { flex: 1 1 auto; color: #8ff0b0; font-size: 12px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; }
#cfglist .row.listen { border-color: #ffd479; background: #2a2410; }
#cfglist .row.listen .kv { color: #ffd479; }
#cfgfoot { flex: 0 0 auto; padding: 8px; font-size: 11px; color: #9a8b70; background: #100d09;
  border-top: 1px solid #332a1c; }
#tip {
  position: absolute; bottom: 8px; left: 0; right: 0;
  text-align: center; color: rgba(255,255,255,0.4); font-size: 11px;
  pointer-events: none; transition: opacity 0.5s;
}
/* 退出按钮：返回键在游戏里只当"菜单/取消"，退出必须有一个明确入口 */
#exitbtn {
  position: absolute; right: 6px; top: 6px; z-index: 9;
  height: 30px; padding: 0 10px; border-radius: 15px;
  font: inherit; font-size: 12px; color: #d8c9a8;
  background: rgba(20,16,12,0.55); border: 1px solid rgba(216,201,168,0.45);
  -webkit-tap-highlight-color: transparent;
}
#exitbtn:active { background: rgba(216,201,168,0.35); color: #fff; }
#loading {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: #0b0d13;
  color: #e0d0b0; font-size: 14px; gap: 12px; z-index: 10;
}
.spinner {
  width: 24px; height: 24px; border: 3px solid rgba(224,208,176,0.2);
  border-top-color: #e0d0b0; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="/sdk/e5.js"></script>
<script src="/shared/e5-no-sleep.js"></script>
</head>
<body>

<div id="view">
  <canvas id="screen"></canvas>
  <div id="rotgroup">
    <button type="button" data-rot="portrait" title="竖着拿" aria-label="竖屏"><svg viewBox="0 0 30 30"><rect x="9" y="3" width="12" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="10.5" y="21" width="9" height="4" rx="0.6" fill="currentColor"/></svg></button>
    <button type="button" data-rot="right" title="横着拿，键盘在右手" aria-label="横屏键盘在右"><svg viewBox="0 0 30 30"><rect x="3" y="9" width="24" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="21.5" y="10.5" width="4" height="9" rx="0.6" fill="currentColor"/></svg></button>
    <button type="button" data-rot="left" title="横着拿，键盘在左手" aria-label="横屏键盘在左"><svg viewBox="0 0 30 30"><rect x="3" y="9" width="24" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="4.5" y="10.5" width="4" height="9" rx="0.6" fill="currentColor"/></svg></button>
  </div>
  <div id="tip">按键：OK/Enter 调查/确认 · 返回/3 菜单/取消</div>
  <button id="btnset" type="button" aria-label="设置">设置</button>
  <button id="exitbtn" type="button" aria-label="退出">退出</button>
  <div id="loading"><div class="spinner"></div><div>正在启动仙剑奇侠传…</div></div>
</div>

<div id="cfg">
  <div id="cfghead"><b>设置 · 按键</b><span class="sp"></span><button id="cfgclose" type="button">保存并关闭</button></div>
  <div id="cfglist"></div>
  <div id="cfgfoot">点一行，再按一个实体键即可改绑；方向/确认/取消/菜单/自动战斗都能改。返回键固定在方框外使用。</div>
</div>

<script>
(function() {
  var cvs = document.getElementById('screen');
  var ctx = cvs.getContext('2d', { alpha: false });
  var loading = document.getElementById('loading');
  var tip = document.getElementById('tip');
  var ws = null;
  var running = false;
  var btnMask = 0;
  var backDownAt = 0;
  var backGuardUntil = 0;

  /* 熄屏策略统一交给 /shared/e5-no-sleep.js（四插件共用）。这里只读窗口时长。 */
  function idleHoldMs() {
    var m = 10;
    try { var v = localStorage.getItem('e5IdleHold'); if (v !== null) m = parseFloat(v); } catch(e) {}
    if (!isFinite(m) || m < 0) m = 10;
    return m <= 0 ? 0 : m * 60000;
  }
  function noSleepStart() {
    try { if (typeof E5NoSleep !== 'undefined') E5NoSleep.start({ minutes: Math.round(idleHoldMs() / 60000) }); } catch(e) {}
  }
  noSleepStart();

  /* 显示方向：竖屏 / 横屏键盘在右 / 横屏键盘在左（只旋转画面，仙剑没有触屏输入） */
  var rotateMode = 'portrait';
  try {
    var savedRot = localStorage.getItem('e5palRotate');
    if (savedRot === 'portrait' || savedRot === 'left' || savedRot === 'right') rotateMode = savedRot;
  } catch(e) {}
  function rotUI() {
    var bs = document.querySelectorAll('#rotgroup button');
    for (var i = 0; i < bs.length; i++) {
      var on = bs[i].getAttribute('data-rot') === rotateMode;
      if (on) bs[i].classList.add('on'); else bs[i].classList.remove('on');
    }
  }
  function setRotate(m) {
    rotateMode = (m === 'left' || m === 'right') ? m : 'portrait';
    try { localStorage.setItem('e5palRotate', rotateMode); } catch(e) {}
    fit();
  }
  (function () {
    var bs = document.querySelectorAll('#rotgroup button');
    for (var i = 0; i < bs.length; i++) {
      (function (b) {
        b.addEventListener('click', function () { setRotate(b.getAttribute('data-rot')); });
      })(bs[i]);
    }
  })();

  /* 画面自适应缩放（物理屏 320x480，游戏 320x200）；横屏按旋转后的外框算 */
  function fit() {
    var ww = window.innerWidth || 320, wh = window.innerHeight || 480;
    var gw = 320, gh = 200;
    var scale;
    if (rotateMode === 'left' || rotateMode === 'right') {
      scale = Math.min(ww / gh, wh / gw);
      cvs.style.width = Math.round(gw * scale) + 'px';
      cvs.style.height = Math.round(gh * scale) + 'px';
      cvs.style.transform = 'rotate(' + (rotateMode === 'right' ? '90deg' : '-90deg') + ')';
    } else {
      scale = Math.min(ww / gw, wh / gh);
      cvs.style.width = Math.round(gw * scale) + 'px';
      cvs.style.height = Math.round(gh * scale) + 'px';
      cvs.style.transform = '';
    }
    rotUI();
  }
  window.addEventListener('resize', fit);
  fit();

  /* 隐藏宿主工具栏，保持全屏沉浸感（带卸载与看门狗清理） */
  var STYLE_ID = 'e5-pal-hide-bar';
  function applyHideBar() {
    try {
      if (window.parent && window.parent.document) {
        var style = window.parent.document.getElementById(STYLE_ID);
        if (!style) {
          style = window.parent.document.createElement('style');
          style.id = STYLE_ID;
          style.textContent = '#mobile-toolbar, #mobile-nav, #bar { display: none !important; } #app-frame { top: 0 !important; bottom: 0 !important; height: 100% !important; }';
          window.parent.document.head.appendChild(style);
        }
      }
    } catch(e) {}
  }
  function removeHideBar() {
    try {
      if (window.parent && window.parent.document) {
        var el = window.parent.document.getElementById(STYLE_ID);
        if (el) el.remove();
      }
    } catch(e) {}
  }
  function stopBackend() {
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/plugins/e5-pal/emu/stop');
      } else {
        fetch('/api/plugins/e5-pal/emu/stop', { method: 'POST', keepalive: true });
      }
    } catch(e) {}
  }

  function onExitCleanup() {
    removeHideBar();
    try { if (typeof E5NoSleep !== 'undefined') E5NoSleep.stop(); } catch(e) {}
    stopBackend();
  }
  applyHideBar();
  window.addEventListener('pagehide', onExitCleanup);
  window.addEventListener('beforeunload', onExitCleanup);
  window.addEventListener('unload', onExitCleanup);

  function leave() {
    if (window._left) return;
    window._left = true;
    onExitCleanup();
    setTimeout(function() {
      if (window.e5 && window.e5.exit) window.e5.exit();
      else location.href = '/';
    }, 80);
  }

  /* 键盘位图映射：
     bit0: B(菜单/取消, Esc)
     bit1: Y(逃跑)
     bit2: SELECT(状态, Tab)
     bit3: START(确认/调查, Enter)
     bit4: UP
     bit5: DOWN
     bit6: LEFT
     bit7: RIGHT
     bit8: A(确认/调查, Space)
     bit9: X(重复)
     bit12: L2(菜单)
     bit13: R2(自动战斗)
  */
  function sendButtons(mask) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    var b = new ArrayBuffer(4);
    var v = new DataView(b);
    v.setUint32(0, mask, true);
    ws.send(b);
  }

  /* 按键表：动作 -> 位图位。可在「设置」里改绑，存 localStorage。 */
  var ACTS = [
    { id: 'up', name: '上', bit: 4 },
    { id: 'down', name: '下', bit: 5 },
    { id: 'left', name: '左', bit: 6 },
    { id: 'right', name: '右', bit: 7 },
    { id: 'ok', name: '确认/调查', bit: 3 },
    { id: 'cancel', name: '菜单/取消', bit: 0 },
    { id: 'select', name: '状态(Tab)', bit: 2 },
    { id: 'auto', name: '自动战斗', bit: 13 }
  ];
  var DEF_KEYS = {
    up: ['ArrowUp', '1'], down: ['ArrowDown', '7'], left: ['ArrowLeft', '4'], right: ['ArrowRight', '5'],
    ok: ['Enter', '6', 'Space'], cancel: ['Backspace', '3', 'Escape'], select: ['9', 'Tab'], auto: ['0']
  };
  var keys = {};
  try {
    var savedKeys = JSON.parse(localStorage.getItem('e5palKeys') || 'null');
    ACTS.forEach(function (a) {
      var v = savedKeys && savedKeys[a.id];
      keys[a.id] = (v && v.length) ? v.slice() : DEF_KEYS[a.id].slice();
    });
  } catch(e) {
    ACTS.forEach(function (a) { keys[a.id] = DEF_KEYS[a.id].slice(); });
  }
  function saveKeys() { try { localStorage.setItem('e5palKeys', JSON.stringify(keys)); } catch(e) {} }
  function keyTok(e) {
    if (e.key && e.key !== 'Unidentified') return e.key;
    return 'code:' + (e.keyCode || 0);
  }
  function bitFor(code, key) {
    var tok = key || ('code:0');
    for (var i = 0; i < ACTS.length; i++) {
      var ks = keys[ACTS[i].id] || [];
      for (var j = 0; j < ks.length; j++) {
        if (ks[j] === tok) return ACTS[i].bit;
      }
    }
    return -1;
  }

  /* 设置面板：点一行再按实体键改绑 */
  var cfgOpen = false, listenId = '';
  var cfgEl = document.getElementById('cfg');
  var cfgList = document.getElementById('cfglist');
  function labelOf(t) {
    var m = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Enter: '确认', Space: '空格', Escape: 'Esc', Tab: 'Tab' };
    if (m[t]) return m[t];
    if (t.indexOf('code:') === 0) return '码' + t.slice(5);
    return t;
  }
  function renderCfg() {
    if (!cfgList) return;
    cfgList.innerHTML = '';
    ACTS.forEach(function (a) {
      var row = document.createElement('div');
      row.className = 'row' + (listenId === a.id ? ' listen' : '');
      row.innerHTML = '<span class="nm"></span><span class="kv"></span>';
      row.querySelector('.nm').textContent = a.name;
      row.querySelector('.kv').textContent = listenId === a.id ? '按一个键…' : (keys[a.id] || []).map(labelOf).join(' / ') || '未设置';
      row.addEventListener('click', function () {
        listenId = a.id;
        renderCfg();
      });
      cfgList.appendChild(row);
    });
  }
  function openCfg() { cfgOpen = true; listenId = ''; cfgEl.classList.add('open'); renderCfg(); }
  function closeCfg() { cfgOpen = false; listenId = ''; cfgEl.classList.remove('open'); saveKeys(); }
  var setBtn = document.getElementById('btnset');
  if (setBtn) {
    setBtn.addEventListener('click', function (e) { e.preventDefault(); if (cfgOpen) closeCfg(); else openCfg(); });
    setBtn.addEventListener('touchend', function (e) { e.preventDefault(); if (cfgOpen) closeCfg(); else openCfg(); }, { passive: false });
  }
  var cfgCloseBtn = document.getElementById('cfgclose');
  if (cfgCloseBtn) cfgCloseBtn.addEventListener('click', function (e) { e.preventDefault(); closeCfg(); });

  function onKeyDown(e) {
    if (e.repeat) return;
    /* 设置面板打开时：按键用来改绑，不发给游戏（电源键仍交给共享组件处理） */
    if (cfgOpen) {
      if (typeof E5NoSleep !== 'undefined' && E5NoSleep.powerKey(e)) return;
      if (listenId) {
        keys[listenId] = [keyTok(e)];
        listenId = '';
        saveKeys(); renderCfg();
      }
      e.preventDefault();
      return;
    }
    if (typeof E5NoSleep !== 'undefined' && E5NoSleep.powerKey(e)) { /* 电源键防误触：共享组件处理 */ }
    if (e.key === 'Backspace' || e.key === 'BrowserBack' || e.keyCode === 8 || e.keyCode === 166) {
      if (Date.now() < backGuardUntil) { e.preventDefault(); return; }
      backDownAt = Date.now();
    }
    var b = bitFor(e.code, keyTok(e));
    if (b >= 0) {
      btnMask |= (1 << b);
      sendButtons(btnMask);
      e.preventDefault();
    }
  }

  function onKeyUp(e) {
    if (e.key === 'Backspace' || e.key === 'BrowserBack' || e.keyCode === 8 || e.keyCode === 166) {
      backDownAt = 0;
      /* 返回键在游戏里只当"菜单/取消"（B/Esc）：以前按住 800ms 就退出整个插件，
         而仙剑的取消/关菜单都要按住它，手一停就被踢出游戏。
         退出一律用右上角「退出」按钮。 */
    }
    var b = bitFor(e.code, keyTok(e));
    if (b >= 0) {
      btnMask &= ~(1 << b);
      sendButtons(btnMask);
      e.preventDefault();
    }
  }

  /* 退出按钮：与返回键分离，点一下才退出 */
  var exitBtn = document.getElementById('exitbtn');
  if (exitBtn) {
    exitBtn.addEventListener('click', function(e) { e.preventDefault(); leave(); });
    exitBtn.addEventListener('touchend', function(e) { e.preventDefault(); leave(); }, { passive: false });
  }

  /* 返回键也要"吞掉"：不注册 onKey 的话 SDK 会把返回键当退出应用发给宿主，
     一按返回就把插件关掉。游戏里返回键由上面的 keyBit 当 B/Esc 用。 */
  try {
    if (window.e5 && window.e5.onKey) {
      window.e5.onKey(function(k) {
        if (k.kind === 'back' || k.kind === 'digit') return true;
        if (k.kind === 'menu') return true;
        return false;
      });
    }
  } catch(e) {}

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  try {
    if (window.parent && window.parent.document) {
      window.parent.document.addEventListener('keydown', onKeyDown);
      window.parent.document.addEventListener('keyup', onKeyUp);
    }
  } catch(e) {}

  /* 核心拉起与 WebSocket 连接 */
  function connect() {
    var wsUrl = 'ws://127.0.0.1:9510';
    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    ws.onopen = function() {
      console.log('WS connected');
      if (loading) loading.style.display = 'none';
      setTimeout(function() { if (tip) tip.style.opacity = '0'; }, 4000);
    };

    ws.onmessage = function(ev) {
      if (!(ev.data instanceof ArrayBuffer)) return;
      var bytes = new Uint8Array(ev.data);
      if (bytes.length < 4) return;
      var w = bytes[0] | (bytes[1] << 8);
      var h = bytes[2] | (bytes[3] << 8);
      if (w <= 0 || h <= 0) return;

      if (cvs.width !== w || cvs.height !== h) {
        cvs.width = w; cvs.height = h;
        fit();
      }
      var imgData = ctx.createImageData(w, h);
      var pix32 = new Uint32Array(imgData.data.buffer);
      var pix16 = new Uint16Array(ev.data, 4);
      var len = Math.min(pix32.length, pix16.length);

      for (var i = 0; i < len; i++) {
        var v = pix16[i];
        var r = (v >> 11) & 0x1f; r = (r << 3) | (r >> 2);
        var g = (v >> 5) & 0x3f;  g = (g << 2) | (g >> 4);
        var b = v & 0x1f;         b = (b << 3) | (b >> 2);
        pix32[i] = 0xff000000 | (b << 16) | (g << 8) | r;
      }
      ctx.putImageData(imgData, 0, 0);
    };

    ws.onclose = function() {
      console.log('WS closed');
      if (!window._left) {
        setTimeout(connect, 1000);
      }
    };
  }

  /* 页面加载时自动拉起后端并连接 */
  fetch('/api/plugins/e5-pal/emu/start', { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.ok) {
        setTimeout(connect, 200);
      } else {
        if (loading) loading.textContent = '启动失败: ' + (d.error || '未知错误');
      }
    })
    .catch(function(err) {
      if (loading) loading.textContent = '网络错误: ' + err;
    });

  if (window.e5 && window.e5.keepAwake) window.e5.keepAwake(true);
})();
</script>
</body>
</html>
