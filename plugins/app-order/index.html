<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>应用排序</title>
<style>
:root{--bg:#0f141b;--fg:#e6edf3;--dim:#8b949e;--line:#222c38;--accent:#58a6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.5 -apple-system,"Noto Sans CJK SC",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid var(--line);flex:none}
header b{font-size:13px;font-weight:400;color:var(--dim);flex:1}
main{flex:1;overflow:auto;padding:4px 0 10px}
.row{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid #17202b}
.row.sel{background:#182230;box-shadow:inset 3px 0 0 var(--accent)}
.row .n{flex:1;min-width:0;word-break:break-word}
.row .id{font-size:11px;color:var(--dim);margin-left:6px}
.row button{width:34px;height:28px;margin-left:5px;font:inherit;font-size:14px;color:var(--fg);
  background:#1b2532;border:1px solid var(--line);border-radius:5px}
.row button:disabled{opacity:.3}
.tip{padding:10px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><b>上下箭头调整顺序 · 改完重开应用列表生效</b></header>
<main id="main"></main>
<script src="/sdk/e5.js"></script>
<script>
(function(){
  var main = document.getElementById('main');
  var items = [], sel = -1;

  function api(path, body){
    var opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {};
    return fetch('/api/plugins/app-order/' + path, opt).then(function(r){ return r.json(); });
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function render(){
    var h = '';
    for (var i = 0; i < items.length; i++){
      var it = items[i];
      h += '<div class="row' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">' +
           '<div class="n">' + esc(it.name) + '<span class="id">' + esc(it.id) + '</span></div>' +
           '<button type="button" data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
           '<button type="button" data-act="down" data-i="' + i + '"' +
           (i === items.length - 1 ? ' disabled' : '') + '>▼</button></div>';
    }
    main.innerHTML = h || '<div class="tip">没有插件</div>';
  }

  function load(){
    api('list').then(function(d){
      if (!d || !d.ok){ main.innerHTML = '<div class="tip">读取失败</div>'; return; }
      items = d.list || [];
      if (sel >= items.length) sel = items.length - 1;
      render();
    }).catch(function(){ main.innerHTML = '<div class="tip">请求失败</div>'; });
  }

  function move(i, dir){
    var it = items[i];
    if (!it) return;
    api('move', {id: it.id, dir: dir}).then(function(d){
      if (!d || !d.ok){ return; }
      sel = dir === 'up' ? Math.max(0, i - 1) : Math.min(items.length - 1, i + 1);
      load();
    });
  }

  main.addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]');
    if (b && !b.disabled){ move(+b.dataset.i, b.dataset.act); return; }
    var row = e.target.closest('.row');
    if (row){ sel = +row.dataset.i; render(); }
  });

  /* 宿主会吞按键，得在父页面挂转发器 */
  function hostKeyForward(){
    try{
      var d = window.parent.document;
      if (!d || d.__e5OrderKeyFwd) return;
      d.__e5OrderKeyFwd = true;
      d.addEventListener('keydown', function(e){
        try{
          var f = d.getElementById('app-frame');
          if (!f || f.hidden) return;
          if (!/\/plugins\/app-order\//.test(f.getAttribute('src') || '')) return;
          var w = f.contentWindow; if (!w) return;
          w.document.dispatchEvent(new w.KeyboardEvent('keydown', {
            key: e.key, code: e.code, keyCode: e.keyCode, which: e.which,
            repeat: e.repeat, bubbles: true, cancelable: true }));
        }catch(x){}
      }, false);
    }catch(e){}
  }

  function exitApp(){
    try{ if (window.parent !== window && typeof e5 !== 'undefined' && e5.exit){ e5.exit(); return; } }catch(e){}
    location.href = '/';
  }

  function onKey(kind){
    if (kind === 'up'){ sel = sel <= 0 ? 0 : sel - 1; render(); return true; }
    if (kind === 'down'){ sel = sel < items.length - 1 ? sel + 1 : sel; render(); return true; }
    if (kind === 'left'){ if (sel > 0) move(sel, 'up'); return true; }
    if (kind === 'right'){ if (sel < items.length - 1) move(sel, 'down'); return true; }
    if (kind === 'back'){ exitApp(); return true; }
    return false;
  }

  if (typeof e5 !== 'undefined' && e5.onKey) e5.onKey(function(k){ return onKey(k.kind); });
  hostKeyForward();
  load();
})();
</script>
</body>
</html>
