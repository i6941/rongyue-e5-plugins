<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浏览器</title>
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--line:#21262d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:14px/1.55 -apple-system,"Noto Sans CJK SC","Source Han Sans SC",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:4px;padding:4px;border-bottom:1px solid var(--line)}
header input{flex:1;min-width:0;background:#161b22;border:1px solid var(--line);
  color:var(--fg);border-radius:6px;padding:7px 8px;font-size:13px}
header button{background:#21262d;border:1px solid var(--line);color:var(--fg);
  border-radius:6px;padding:0 10px;font-size:13px}
header button:active{background:#30363d}
#status{font-size:11px;color:var(--dim);padding:3px 9px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow:auto;padding:6px 10px 18px;-webkit-overflow-scrolling:touch}
#frame{flex:1;width:100%;border:0;background:#fff;display:none}
body.web main{display:none}
body.web #frame{display:block}
h1{font-size:16px;line-height:1.35;margin:2px 0 10px}
p{margin:0 0 9px;word-wrap:break-word}
.err{color:#ff7b72}
.home a{display:block;padding:10px;border:1px solid var(--line);border-radius:8px;
  margin:7px 0;color:var(--fg);text-decoration:none}
.home a span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.links{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.lh{font-size:11px;color:var(--dim);margin:2px 0 4px}
.links div.item{padding:5px 0;border-bottom:1px solid #161b22;font-size:13px}
.links a{color:var(--accent);text-decoration:none}
.fallback{display:inline-block;padding:9px 12px;border:1px solid var(--accent);border-radius:8px;
  color:var(--accent);text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header>
  <button id="back" type="button" title="返回">‹</button>
  <input id="url" type="text" placeholder="网址或搜索" autocomplete="off"
         autocapitalize="off" spellcheck="false">
  <button id="go" type="button">打开</button>
  <button id="mode" type="button">原文</button>
</header>
<div id="status"></div>
<main id="doc"></main>
<iframe id="frame" title="网页" referrerpolicy="no-referrer"></iframe>
<script>
(function(){
  var doc = document.getElementById('doc');
  var statusEl = document.getElementById('status');
  var input = document.getElementById('url');
  var goBtn = document.getElementById('go');
  var backBtn = document.getElementById('back');
  var stack = [];
  var busy = false;
  var webMode = false;
  var frame = document.getElementById('frame');
  var modeBtn = document.getElementById('mode');

  /* 第三个字段是打开方式：web = 原文（动态站，跑真网页），reader = 阅读视图 */
  var HOME = [
    ['Hi-PDA 论坛', 'https://www.4d4y.com/forum/', 'web'],
    ['哔哩哔哩', 'https://www.bilibili.com/', 'web'],
    ['维基百科', 'https://zh.m.wikipedia.org/', 'reader'],
    ['Hacker News', 'https://news.ycombinator.com/', 'reader'],
    ['搜索 OpenWrt', 'q:OpenWrt', 'reader']
  ];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  /* 报告给后端，方便在设备上确认 iframe 到底有没有加载成功 */
  function probe(status, url){
    try{
      fetch('/api/plugins/browser/probe', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({mode: webMode ? 'web' : 'reader', status: status, url: url || ''})
      });
    }catch(e){}
  }

  function showWeb(url){
    webMode = true;
    document.body.classList.add('web');
    modeBtn.textContent = '阅读';
    statusEl.textContent = '原文模式 · ' + url;
    /* onload 必须先挂再设 src，否则加载快的页面会错过回调 */
    var done = false;
    frame.onload = function(){ done = true; probe('loaded', frame.src); };
    frame.src = url;
    probe('start', url);
    setTimeout(function(){ if(!done) probe('timeout', frame.src); }, 12000);
  }
  function showReader(){
    webMode = false;
    document.body.classList.remove('web');
    modeBtn.textContent = '原文';
    frame.src = 'about:blank';
    probe('reader', input.value);
  }

  function home(){
    var h = '<div class="home"><p style="color:#8b949e;font-size:12px;margin:2px 0 6px">' +
            '输入网址，或输入关键词搜索</p>';
    for (var i = 0; i < HOME.length; i++){
      h += '<a href="#" data-href="' + esc(HOME[i][1]) + '" data-mode="' + esc(HOME[i][2]) + '">' +
           esc(HOME[i][0]) + '<span>' + esc(HOME[i][1].replace(/^q:/, '搜索：')) +
           (HOME[i][2] === 'web' ? ' · 原文' : '') + '</span></a>';
    }
    h += '</div>';
    doc.innerHTML = h;
    statusEl.textContent = '阅读器模式 · 只显示正文和链接';
    input.value = '';
    stack = [];
  }

  function setBusy(v){
    busy = v;
    goBtn.disabled = v;
    goBtn.textContent = v ? '…' : '打开';
  }

  function render(d){
    if (!d || !d.ok){
      /* 抓不到正文时给出两条出路：直接看原文，或换搜索引擎 */
      var bad = (d && d.url) || input.value || '';
      doc.innerHTML = '<p class="err">' + esc((d && d.error) || '加载失败') + '</p>' +
        (bad ? '<p><a href="#" class="fallback" data-web="' + esc(bad) + '">用原文模式打开这个地址</a></p>' : '');
      statusEl.textContent = bad;
      return;
    }
    var h = '<h1>' + esc(d.title) + '</h1>';
    for (var i = 0; i < d.text.length; i++) h += '<p>' + esc(d.text[i]) + '</p>';
    if (d.links && d.links.length){
      h += '<div class="links"><div class="lh">本页链接（' + d.links.length + '）</div>';
      for (var k = 0; k < d.links.length; k++){
        var l = d.links[k];
        h += '<div class="item"><a href="#" data-href="' + esc(l.h) + '">' +
             esc(l.t || l.h) + '</a></div>';
      }
      h += '</div>';
    }
    doc.innerHTML = h;
    doc.scrollTop = 0;
    statusEl.textContent = d.title + ' · ' + d.text.length + ' 段 · ' +
      (d.links ? d.links.length : 0) + ' 链接 · ' + d.ms + 'ms';
    input.value = d.url;
  }

  function target(q){
    q = (q || '').trim();
    if (!q) return '';
    if (/^https?:\/\//i.test(q)) return q;
    if (/^q:/i.test(q)) return 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(q.slice(2));
    if (/^[\w-]+(\.[\w-]+)+(\/[^\s]*)?$/.test(q)) return 'https://' + q;
    return 'https://lite.duckduckgo.com/lite/?q=' + encodeURIComponent(q);
  }

  function go(q, push){
    var url = target(q);
    if (!url || busy) return;
    if (webMode){ showWeb(url); input.value = url; return; }
    setBusy(true);
    statusEl.textContent = '加载中…';
    var t0 = Date.now();
    fetch('/api/plugins/browser/browse?url=' + encodeURIComponent(url))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (push !== false && input.value && !/^q:/.test(input.value)) stack.push(input.value);
        render(d);
      })
      .catch(function(e){
        doc.innerHTML = '<p class="err">' + esc(String(e)) + '</p>';
        statusEl.textContent = '请求失败';
      })
      .then(function(){ setBusy(false); });
  }

  doc.addEventListener('click', function(e){
    var w = e.target.closest ? e.target.closest('a[data-web]') : null;
    if (w){
      e.preventDefault();
      var u = w.getAttribute('data-web');
      input.value = u;
      showWeb(u);
      return;
    }
    var a = e.target.closest ? e.target.closest('a[data-href]') : null;
    if (!a) return;
    e.preventDefault();
    var h = a.getAttribute('data-href');
    if (!h) return;
    if (a.getAttribute('data-mode') === 'web'){ showWeb(target(h)); input.value = target(h); return; }
    if (h.indexOf('q:') === 0){ go(h, false); return; }
    stack.push(input.value || '');
    go(h, false);
  });

  goBtn.addEventListener('click', function(){ go(input.value, false); });
  modeBtn.addEventListener('click', function(){
    if (webMode) { showReader(); if (input.value) go(input.value, false); }
    else { var u = target(input.value); if (u) showWeb(u); }
  });
  backBtn.addEventListener('click', function(){
    var prev = stack.pop();
    if (prev) go(prev, false); else home();
  });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.keyCode === 13){ e.preventDefault(); go(input.value, false); }
  });

  home();
  /* 设备上验证用：?web=1&url=... 直接以原文模式打开 */
  try{
    var qp = new URLSearchParams(location.search);
    var u0 = qp.get('url');
    if (qp.get('web') === '1' && u0) showWeb(u0);
    /* 诊断：WPE 自己能不能访问外网 */
    if (qp.get('probe') === '1'){
      probe('probe-start', 'https://example.com/');
      function tryUrl(u, tag){
        fetch(u, {mode: 'no-cors'}).then(function(){
          probe('ok:' + tag, u);
        }).catch(function(e){
          probe('err:' + tag + ':' + String(e).slice(0, 60), u);
        });
      }
      tryUrl('http://example.com/', 'http');
      tryUrl('https://example.com/', 'https');
      tryUrl('http://connectivitycheck.gstatic.com/generate_204', 'gstatic-http');
    }
  }catch(e){}
})();
</script>
</body>
</html>
