<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>复古游戏机</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{margin:0;background:#0b111b;color:#edf3fc;font:12px "Noto Sans CJK SC",sans-serif;position:relative;min-height:100%}
header{position:absolute;top:0;left:0;right:0;height:34px;z-index:5;padding:3px 4px 3px 6px;background:#0b111b;border-bottom:1px solid #29354a;overflow:hidden;display:flex;align-items:center;gap:6px}
h1{font-size:12px;margin:0;display:inline-block;flex:0 1 auto;max-width:44%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;white-space:nowrap}#status{font-size:10px;color:#a8bad0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;flex:1 1 auto;vertical-align:middle}
main{position:absolute;top:60px;bottom:36px;left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#stage{display:none;position:absolute;inset:0;background:#000}
body.ingame #tabs{display:none}
#menu{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:6px 6px 8px}
.cell{position:relative;display:block;width:100%;padding:0 0 4px;background:#141d2c;color:inherit;border:1px solid #223047;border-radius:6px;font:inherit;overflow:hidden}
.cell.sel{border-color:#65bdff;background:#1d2c44}
.cell .art{position:relative;width:100%;height:56px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#cfe4ff;background:#1b2740}
.cell .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell .cap{display:block;padding:2px 4px 0;font-size:11px;line-height:1.2;height:28px;overflow:hidden;text-align:left}
.cell .num{position:absolute;left:3px;top:3px;z-index:2;min-width:16px;height:16px;line-height:16px;padding:0 3px;text-align:center;background:#0b111b;border:1px solid #2f4463;border-radius:4px;color:#9fc6ef;font-size:10px}
.cell.sel .num{background:#65bdff;color:#04121f;border-color:#65bdff}
/* 每个格子右上角标出它属于哪个机种（FC/MD/GBA） */
.cell .sys{position:absolute;right:3px;top:3px;z-index:2;padding:0 4px;height:14px;line-height:14px;
  background:rgba(11,17,27,.85);border:1px solid #2f4463;border-radius:3px;color:#9fc6ef;font-size:9px}
/* 机种 tab：上面一行，数字 1-4 直接切 */
#tabs{position:absolute;top:34px;left:0;right:0;height:26px;z-index:5;display:flex;gap:4px;padding:3px 6px;background:#0b111b;border-bottom:1px solid #29354a;overflow:hidden}
#tabs button{flex:1 1 0;min-width:0;height:20px;padding:0 4px;font:inherit;font-size:11px;line-height:18px;color:#a8bad0;background:#141d2c;border:1px solid #223047;border-radius:10px;white-space:nowrap;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#tabs button b{color:#65bdff;font-weight:700;margin-right:2px}
#tabs button.on b{color:#04121f}
#tabs button.on{color:#04121f;background:#65bdff;border-color:#65bdff;font-weight:600}
/* 存档弹窗 */
#slots{position:absolute;inset:0;z-index:19;display:none;align-items:center;justify-content:center;background:rgba(4,7,12,.82)}
#slots.open{display:flex}
#slots .sbox{width:280px;max-width:92%;background:#101827;border:1px solid #2b3a52;border-radius:10px;overflow:hidden}
#slots .stitle{height:28px;line-height:28px;padding:0 10px;font-size:13px;color:#edf3fc;background:#16202f;border-bottom:1px solid #2b3a52}
#slots .row{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;font-size:12px;color:#cfe0f5;border-bottom:1px solid #1b2433}
#slots .row.sel{background:#1d2c44;color:#fff}
#slots .row .nm{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#slots .row .st{flex:0 0 auto;font-size:11px;color:#8ff0b0}
#slots .row.empty .st{color:#8a93a3}
#slots .sfoot{padding:6px 10px;font-size:10px;color:#8a93a3;background:#0d1420;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage.on{display:flex;align-items:center;justify-content:center}
/* 顶部条（游戏名/分辨率/帧率）+ 底部 HUD 各自占一条，画面在中间那块 */
body.ingame #stage.on{padding:18px 0 40px 0}
#topbar{position:absolute;top:0;left:0;right:0;height:18px;z-index:6;display:none;align-items:center;gap:6px;padding:0 5px;background:#0b111b;border-bottom:1px solid #29354a;font-size:10px;color:#a8bad0;overflow:hidden;white-space:nowrap}
body.ingame #topbar{display:flex}
#topbar b{color:#8ff0b0}
#topbar #tkey{color:#ffd479;max-width:78px;overflow:hidden}
#topbar #tfps{color:#a8bad0}
#topbar .sp{flex:1 1 auto}
#ejs_game{display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
/* 社区常见做法：画面比例和屏幕不一致时，别留一片死黑，而是把空处做成"机身饰边" */
    /* 游戏内把装饰都去掉：渐变背景和阴影每帧都要重新合成，
       手机浏览器是软件渲染，这两项会跟模拟器抢 CPU，表现为"玩着玩着卡死"。 */
body.ingame #stage{background:#000}
body.ingame #ejs_game{border-radius:0;box-shadow:none;border:1px solid #1b2436}
body.ingame.fitfull #ejs_game{border-radius:0;box-shadow:none}
#ejs_game>div{max-width:100%;max-height:100%}
#ejs_game canvas{image-rendering:pixelated;display:block;max-width:100%;max-height:100%}
/* 画面层的滤镜：一整块叠在黑边以内，纯 CSS 合成，不参与每帧绘制 */
#screenwrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#screenwrap canvas{position:relative;z-index:1}
#fx{position:absolute;inset:0;z-index:2;pointer-events:none;display:none}
body.fx-scan #fx{display:block;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 1px,rgba(0,0,0,.32) 1px 2px)}
body.fx-lcd #fx{display:block;background:repeating-linear-gradient(to right,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px),repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px)}
/* 底部操作条：手指能按到的尺寸（原来 15px 高、30px 宽，点不中） */
#hud{position:absolute;left:0;right:0;bottom:0;height:40px;z-index:8;display:flex;align-items:center;gap:5px;
  padding:0 6px;background:#0b111b;border-top:1px solid #29354a;font-size:10px;color:#a8bad0;
  user-select:none;-webkit-user-select:none}
#hud b{color:#8ff0b0}
#hud .sp{flex:1 1 auto}
#hud button{margin:0;flex:1 1 0;min-width:0;height:32px;padding:0 2px;font:inherit;font-size:15px;font-weight:600;
  line-height:30px;text-align:center;background:#22304a;color:#dce8f8;border:1px solid #3a4c6b;border-radius:6px;
  white-space:nowrap;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#hud button:active{background:#31527f;color:#fff;border-color:#5b7fb0}
#foot{display:flex;align-items:center;gap:8px}
#foot .sp{flex:1 1 auto}
#foot button{height:28px;min-width:68px;padding:0 12px;font:inherit;font-size:14px;font-weight:600;color:#dce8f8;background:#22304a;border:1px solid #3a4c6b;border-radius:6px;touch-action:manipulation}
#foot button:active{background:#31527f;color:#fff}
#hud button.hit{background:#3a5f96;color:#fff;border-color:#7fa6dd}
/* 开局提示条：把这一版的按键分工直接写在屏幕上，玩一会儿就消失 */
#hint{position:absolute;left:6px;right:6px;top:50%;transform:translateY(-50%);z-index:7;display:none;
  padding:5px 6px;background:rgba(8,13,22,.85);border:1px solid #2b3a52;border-radius:6px;
  color:#cfe0f5;font-size:11px;line-height:16px;text-align:center}
body.ingame #hint.show{display:block}
/* 读档/恢复时的轻提示：不占布局，只在屏幕中间浮一小会儿 */
#loadtip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:none;
  padding:6px 12px;background:rgba(8,13,22,.92);border:1px solid #2b3a52;border-radius:14px;
  color:#cfe0f5;font-size:12px;white-space:nowrap}
#loadtip.show{display:block}
/* 卡死后的恢复面板：模拟器主循环被打断时给出"一键重进"，存档会自动读回 */
#stall{position:absolute;left:0;right:0;top:18px;bottom:40px;z-index:9;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;background:rgba(4,7,12,.93)}
#stall.show{display:flex}
#stall .stxt{font-size:16px;color:#ffd479}
#stall .srow{display:flex;gap:10px}
#stall button{height:42px;padding:0 14px;font:inherit;font-size:14px;color:#dce8f8;background:#22304a;border:1px solid #3a4c6b;border-radius:8px}
/* ---- 按键设置面板 ---- */
#cfg{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:#0b111b}
#cfg.open{display:flex}
/* 打开后的头 450ms 不吃点击：手指还按在「# 按键」上，合成 click 会落到
   同一位置的「关闭」按钮，面板只闪一下就没了。 */
#cfg.opening{pointer-events:none}
#cfghead{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:4px 6px;background:#101827;border-bottom:1px solid #29354a;font-size:12px}
#cfghead .sp{flex:1 1 auto}
#cfgtip{font-size:10px;color:#ffd479;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:62%}
#cfgsys{font-size:10px;padding:1px 5px;border:1px solid #3a4c6b;border-radius:4px;color:#9fc6ef;background:#16202f}
#cfghead button{font:inherit;font-size:13px;height:30px;padding:0 11px;color:#dce8f8;background:#22304a;border:1px solid #3a4c6b;border-radius:5px}
#cfgrid{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px 6px 8px;align-content:start;overflow-y:auto}
.cfgcell{position:relative;height:52px;padding:5px 8px;background:#141d2c;border:1px solid #223047;border-radius:6px;text-align:left}
.cfgcell .nm{font-size:13px;color:#edf3fc}
.cfgcell .kv{font-size:12px;color:#8ff0b0;margin-top:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:30px}
.cfgcell.sel{border-color:#65bdff;background:#1d2c44}
.cfgcell.listen{border-color:#ffd479;background:#2a2440}
.cfgcell.listen .kv{color:#ffd479}
.cfgcell .clr{position:absolute;right:3px;top:3px;width:28px;height:28px;padding:0;font:inherit;font-size:15px;line-height:26px;
  color:#9fb4cf;background:#182234;border:1px solid #2b3a52;border-radius:4px}
.cfgcell .clr.hit{background:#3a5f96;color:#fff}
/* 方向选择：三个手机简笔画（竖持 / 横持键盘在左 / 横持键盘在右）。
   选中项高亮边框，当前方向一眼可见。 */
#cfgrot{flex:0 0 auto;display:flex;gap:6px;padding:6px 6px 0;background:#101827}
#cfgrot button{flex:1 1 0;height:44px;padding:0;color:#a8bad0;background:#182234;border:1px solid #2b3a52;border-radius:8px;
  display:flex;align-items:center;justify-content:center}
#cfgrot button svg{width:30px;height:30px;display:block}
#cfgrot button.on{color:#04121f;background:#65bdff;border-color:#65bdff}
#cfgrot button:active{opacity:.85}
#cfgfx{flex:0 0 auto;display:flex;gap:6px;padding:6px 6px 0;background:#101827}
#cfgfx button{flex:1 1 0;height:38px;font:inherit;font-size:13px;color:#dce8f8;background:#182234;border:1px solid #2b3a52;border-radius:6px}
#cfgfx button:active{background:#31527f}
footer{position:absolute;bottom:0;left:0;right:0;height:36px;z-index:6;padding:4px 8px;background:#0b111b;border-top:1px solid #29354a;color:#a8bad0;font-size:10px;overflow:hidden;white-space:nowrap}
#fver{float:right;color:#65bdff;font-weight:600;margin-left:6px}
body.ingame footer{display:none}
/* 进游戏后页头/页脚那些字没信息量，却白占竖向空间：藏掉，把画面让出来 */
body.ingame header{display:none}
body.ingame main{top:0;bottom:0}
/* ---- 横屏三态 + 虚拟按键 ----
   方向约定（以画面转正为准倒推机身转向）：
   键左 = rotate(-90deg)：画面顺时针出现在机身里，用户要把机身顺时针转
   （顶部朝东）才看着是正的，此时键盘（机身底部）落在左手；
   键右 = rotate(90deg)：机身逆时针转（顶部朝西），键盘落在右手。
   旋转只作用在 #ejs_game（顶条/操作条/虚拟按键都保持屏幕方向）。 */
body.rot-r #ejs_game{transform:rotate(90deg)}
body.rot-l #ejs_game{transform:rotate(-90deg)}
#vpad{position:absolute;left:0;right:0;top:18px;bottom:40px;z-index:9;display:none;
  pointer-events:none;user-select:none;-webkit-user-select:none}
#vpad.on{display:block}
#vpad .vb{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  width:58px;height:58px;border-radius:50%;background:rgba(19,29,44,.55);border:1px solid rgba(89,121,170,.65);
  color:#dce8f8;font-size:20px;font-weight:700;touch-action:none;-webkit-tap-highlight-color:transparent}
#vpad .vb.hit{background:rgba(96,146,224,.8);color:#fff;border-color:#8fb4e8}
#vpad .vb.sm{width:70px;height:32px;border-radius:6px;font-size:10px}
/* 键右模式：左手用的虚拟摇杆（圆盘 + 可拖动帽，8 向输出，斜向=两键同按）。
   位置落在用户视角左下角：CSS 左边缘 + 上边缘（横屏后 CSS 的 y 轴是用户的左右轴）。 */
#vpad .joy{position:absolute;left:20px;top:22px;width:112px;height:112px;border-radius:50%;
  background:rgba(19,29,44,.45);border:1px solid rgba(89,121,170,.6);pointer-events:auto;touch-action:none}
#vpad .joy.hit{border-color:#8fb4e8}
#vpad .joy .nub{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;
  border-radius:50%;background:rgba(96,146,224,.65);border:1px solid #8fb4e8;pointer-events:none;
  transition:background .08s}
#vpad .joy.hit .nub{background:rgba(120,170,240,.85)}
#vpadclose{position:absolute;right:6px;top:6px;z-index:2;display:none;width:28px;height:28px;border-radius:14px;
  align-items:center;justify-content:center;background:rgba(19,29,44,.6);border:1px solid rgba(89,121,170,.5);
  color:#a8bad0;font-size:14px;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
#vpad.on #vpadclose{display:flex}
#vpadclose.hit{background:rgba(96,146,224,.8);color:#fff}
/* × 的位置要避开虚拟键：键左时键在用户右下（CSS 右上），
   所以 × 放 CSS 左下（=用户左上）；键右时键在用户左下（CSS 左上），
   × 放 CSS 右下（=用户右上）。 */
body.rot-l #vpadclose{left:6px;bottom:6px;right:auto;top:auto}
body.rot-r #vpadclose{right:6px;bottom:6px;left:auto;top:auto}
#vpadshow{position:absolute;left:6px;top:24px;z-index:9;display:none;width:30px;height:30px;border-radius:8px;
  align-items:center;justify-content:center;background:rgba(19,29,44,.6);border:1px solid rgba(89,121,170,.5);
  color:#a8bad0;font-size:14px;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
#vpadshow.on{display:flex}
/* 收起虚拟键后的唤回按钮，放在和 × 相同的角，避免压住游戏画面中心 */
body.rot-r #vpadshow{left:auto;right:6px;bottom:6px;top:auto}
/* 运行库自带的 UI 全部藏掉：菜单栏、上下文菜单、弹窗、开始按钮、虚拟手柄、设置页… */
.ejs_menu_bar,.ejs_menu_button,.ejs_context_menu,.ejs_popup_container,.ejs_popup_box,.ejs_popup_body,
.ejs_start_button,.ejs_message,.ejs_control_bar,.ejs_control_body,.ejs_settings_parent,.ejs_settings_main_bar,
.ejs_settings_center_left,.ejs_settings_center_right,.ejs_cheat_parent,.ejs_cheat_main,.ejs_netplay_header,
.ejs_big_screen,.ejs_virtual,.ejs_dpad_bar,.ejs_dpad_main,.ejs_volume_parent,.ejs_threads,.ejs_option_row,
.ejs_game_background,.ejs_loading_text{display:none !important}
</style></head><body>
<header><h1 id="title">复古游戏机</h1><div id="status">选择游戏</div><button id="bcore" type="button" hidden>核心</button></header>
<div id="tabs"><button type="button" data-sys="ALL" class="on"><b>1</b> 全部</button></div>
<main>
  <div id="menu"></div>
  <div id="stage"><div id="ejs_game"></div>
    <div id="topbar"><span id="tname">—</span><span id="tres">—</span><span class="sp"></span><span id="tkey"></span><span id="tfps">FPS --</span></div>
    <div id="hud"><span class="sp"></span>
      <button id="bview" type="button" title="画面模式" aria-label="画面模式">铺</button>
      <button id="brot" type="button" title="横屏方向：键左/键右/竖屏" aria-label="横屏方向">转</button>
      <button id="bslot" type="button" title="存档槽" aria-label="存档槽">槽</button>
      <button id="bsave" type="button" title="存档" aria-label="存档">存</button>
      <button id="bload" type="button" title="读档" aria-label="读档">取</button>
      <button id="bpause" type="button" title="暂停/继续" aria-label="暂停/继续">❚❚</button>
      <button id="bset" type="button" title="设置" aria-label="设置">⚙</button>
      <button id="quit" type="button" title="退出游戏" aria-label="退出游戏">退</button></div>
    <div id="hint"></div>
    <div id="loadtip">存档读取中…</div>
    <div id="slots"><div class="sbox">
      <div class="stitle">存档</div>
      <div id="slotlist"></div>
      <div class="sfoot">↑↓ 选 · 确认 读档 · ← 存档 · 返回 关闭</div>
    </div></div>
    <div id="stall"><div class="stxt">画面卡住了</div><div class="srow">
      <button id="sresume" type="button">重进（读回存档）</button></div></div>
  </div>
</main>
<footer id="foot"><span id="fver"></span><span class="sp"></span>
  <button id="fset" type="button" title="设置" aria-label="设置">⚙ 设置</button>
  <button id="fexit" type="button">退出</button></footer>
<div id="cfg">
  <div id="cfghead"><b>设置</b><span id="cfgsys">FC</span><span id="cfgtip">选一项，再按一个键</span><span class="sp"></span><button id="cfgclose" type="button" aria-label="保存并关闭" style="font-size:14px;line-height:28px;padding:0 10px">保存</button></div>
  <div id="cfgrid"></div>
  <div id="cfgfx"><button id="cfgscan" type="button">滤镜：关</button><button id="cfgscale" type="button">比例：宽铺</button></div>
  <div id="cfgrot">
    <button type="button" data-rot="portrait" title="竖着拿" aria-label="竖屏"><svg viewBox="0 0 30 30"><rect x="9" y="3" width="12" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="10.5" y="21" width="9" height="4" rx="0.6" fill="currentColor"/></svg></button>
    <button type="button" data-rot="left" title="横着拿，键盘在左手" aria-label="横屏键盘在左"><svg viewBox="0 0 30 30"><rect x="3" y="9" width="24" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="4.5" y="10.5" width="4" height="9" rx="0.6" fill="currentColor"/></svg></button>
    <button type="button" data-rot="right" title="横着拿，键盘在右手" aria-label="横屏键盘在右"><svg viewBox="0 0 30 30"><rect x="3" y="9" width="24" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="21.5" y="10.5" width="4" height="9" rx="0.6" fill="currentColor"/></svg></button>
  </div>
</div>
<script src="/sdk/e5.js"></script>
<script>
'use strict';
var $=function(id){return document.getElementById(id)};
/* 这台机器的触摸不一定合成 click 事件，所以按钮直接绑触摸事件；
   同时保留 mousedown/click（鼠标或辅助输入），用时间窗去重，一次点击只执行一遍。
   列表要能滚动：手指按下先不触发，抬起时若位移超过阈值就当滚动，不进游戏。 */
var globalClickGuardUntil = 0;
function globalClickGuard(ms){
  globalClickGuardUntil = Math.max(globalClickGuardUntil, Date.now() + (ms || 450));
}
function bindTap(el,fn){
  if(!el) return;
  var sx=0,sy=0,moved=false,armed=false,last=0;
  function pos(e){
    var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
    return {x:t.clientX||0,y:t.clientY||0};
  }
  el.addEventListener('touchstart',function(e){
    if(Date.now() < globalClickGuardUntil){ armed=false; return; }
    if(e.touches&&e.touches.length>1){ armed=false; return; }
    var p=pos(e); sx=p.x; sy=p.y; moved=false; armed=true;
  },{passive:true});
  el.addEventListener('touchmove',function(e){
    if(!armed) return;
    var p=pos(e);
    if(Math.abs(p.x-sx)>12||Math.abs(p.y-sy)>12) moved=true;
  },{passive:true});
  el.addEventListener('touchend',function(e){
    if(!armed) return; armed=false;
    if(moved) return;                       /* 这一下是在滚动列表 */
    if(Date.now() < globalClickGuardUntil) return;
    var now=Date.now(); if(now-last<350) return; last=now;
    /* 触摸触发后，接下来的 450ms 内屏蔽一切合成 click，杜绝底层元素被误点穿！ */
    globalClickGuard(450);
    try{ el.classList.add('hit'); setTimeout(function(){ el.classList.remove('hit'); },180); }catch(x){}
    try{ fn(e); }catch(x){}
  },{passive:true});
  el.addEventListener('touchcancel',function(){ armed=false; });
  el.addEventListener('click',function(e){
    if(Date.now() < globalClickGuardUntil){
      if(e && e.preventDefault) e.preventDefault();
      if(e && e.stopPropagation) e.stopPropagation();
      return;
    }
    var now=Date.now(); if(now-last<350) return; last=now;
    try{ fn(e); }catch(x){}
  });
}
/* 抓 fetch 失败：WebKit 的未处理拒绝只报一句 "Load failed"，看不出是哪个 URL */
(function(){
  var of=window.fetch;
  if(typeof of!=='function') return;
  window.fetch=function(u,o){
    var t0=Date.now();
    var url=(typeof u==='string'?u:((u&&u.url)||'?'));
    return of.apply(this,arguments).then(function(r){
      try{ logs.push('fetch '+Math.round(Date.now()-t0)+'ms '+r.status+' '+url); if(logs.length>20) logs.shift(); }catch(e){}
      return r;
    }).catch(function(err){
      try{ logs.push('fetch失败 '+Math.round(Date.now()-t0)+'ms '+url+' :: '+err); if(logs.length>20) logs.shift(); }catch(e){}
      throw err;
    });
  };
})();
/* 运行库把核心文件缓存在 IndexedDB 的 EmulatorJS-core 库里。
   之前那次卡死很可能把不完整/损坏的 .data 写进了缓存，之后每次启动都用这份
   坏文件 → wasm 陷阱 → 加载完两三秒就死。清一次缓存让它重新从本地文件取。 */
function clearEjsCoreCache(cb){
  try{
    if(!window.indexedDB){ if(cb) cb('no-idb'); return; }
    var rq=indexedDB.deleteDatabase('EmulatorJS-core');
    rq.onsuccess=function(){ if(cb) cb('ok'); };
    rq.onerror=function(){ if(cb) cb('err'); };
    rq.onblocked=function(){ if(cb) cb('blocked'); };
  }catch(e){ if(cb) cb('ex '+e); }
}
try{
  if(!localStorage.getItem('e5corecleared')){
    localStorage.setItem('e5corecleared','1');
    clearEjsCoreCache(function(r){ try{ logs.push('清核心缓存 '+r); }catch(e){} });
  }
}catch(e){}

/* 全局错误监听：wasm 陷阱只会给一句 "RuntimeError: ...", 这里把文件名和行号也留下 */
window.addEventListener('error',function(e){
  try{
    /* 没有 message 的 error 是资源加载失败（封面图不在设备上），不是脚本异常 */
    if(!e.message) return;
    var msg=(e.message||'')+' @ '+(e.filename||'?')+':'+(e.lineno||'?')+':'+(e.colno||'?');
    logs.push('uncaught '+msg); if(logs.length>20) logs.shift();
    lastErr='uncaught '+msg.slice(0,160);
    if(e.error&&e.error.stack){ logs.push('estack '+String(e.error.stack).replace(/\s+/g,' ').slice(0,300)); if(logs.length>20) logs.shift(); }
  }catch(x){}
},true);
/* 关掉运行库的手柄轮询：它每 10ms 查一次 navigator.getGamepads，
   在这台机器的 WebKit 上可能读到一个"幽灵手柄"，把核心不认的按钮号
   （9、12~15）发进核心的输入回调，触发 wasm 陷阱、主循环停摆。
   我们只用实体按键，不需要手柄 API。 */
try{
  navigator.getGamepads=function(){ return []; };
  if(navigator.webkitGetGamepads) navigator.webkitGetGamepads=function(){ return []; };
}catch(e){}

var BASE='/plugins/e5-emulator/';
/* 插件版本：和 manifest.json 的 version 保持一致，界面上能看到当前跑的是哪一版 */
var APP_VER='1.17.0';

/* ---------------- 原生引擎（e5emu） ----------------
   浏览器里跑 wasm 核心在这台机器上过不去：解压核心要十几秒，进游戏两三秒后
   wasm 抛陷阱、主循环停摆，反复开关还会把 WebGL2 上下文耗尽。所以 FC 游戏
   默认走原生：后端拉起 /usr/bin/e5emu，它把 RGB565 帧通过本机 WebSocket 推给
   这个页面，页面只负责把帧画出来、把按键位图发回去。
   运行库（EmulatorJS）只作为原生二进制缺失时的自动兜底，设置里不再提供切换；
   调试时仍可用 ?engine=ejs 临时指定。 */
var ENGINE='native';
(function(){
  try{
    var p=new URLSearchParams(location.search).get('engine');
    if(p==='ejs'||p==='native') ENGINE=p;
  }catch(e){}
})();
var nat={ws:null,cvs:null,ctx:null,img:null,w:0,h:0,frames:0,lastFrames:0,fpsAt:0,open:false,
         err:'',paused:false,installed:null,mask:0,seen:-1,stallTicks:0,savedAgo:0,autoLoaded:false};
/* 宿主把插件框架收起来（通知、来电、菜单键都会这样）时，先挂起而不是退出：
   停掉进程省 CPU，框架回来再重新拉起并读回存档，游戏进度不会丢。 */
var susp={on:false,count:0,at:0,why:'',ticks:0};
function nativeActive(){ return ENGINE==='native'; }
/* 每个内核编译成一个独立二进制：fceumm → e5emu，genesis_plus_gx → e5emu-genesis，
   mgba → e5emu-gba，fbneo → e5emu-arcade，dosbox_pure → e5emu-dos，
   sdlpal → e5emu-pal。哪个装了就走原生，没装就退回运行库。

   注意：dosbox_pure 和 sdlpal 是「只有原生实现」的机种——EmulatorJS 的
   data/ 里根本没有这两个核心的 wasm 包。它们一旦落到 nativeWanted()==false，
   就会去加载不存在的网页核心，页面报「无法加载运行库」。
   所以这两类必须走原生，没有网页兜底。 */
function nativeCoreKey(g){
  if(!g) return '';
  if(g.core==='fceumm') return 'nes';
  if(g.core==='genesis_plus_gx') return 'md';
  if(g.core==='mgba') return 'gba';
  if(g.core==='fbneo') return 'arc';
  if(g.core==='dosbox_pure') return 'dos';
  if(g.core==='sdlpal') return 'pal';
  return '';
}
/* 这些机种没有网页版核心，只能走原生 */
function nativeOnly(g){
  return !!g && (g.core==='dosbox_pure' || g.core==='sdlpal');
}
function nativeWanted(g){
  if(!nativeActive()||!g) return false;
  var k=nativeCoreKey(g);
  if(!k) return false;
  if(nat.installed===false) return false;
  if(nat.bins&&nat.bins[k]===false) return false;
  return true;
}
function natUrl(){
  try{ var w=new URLSearchParams(location.search).get('ws'); if(w) return w; }catch(e){}
  return 'ws://127.0.0.1:9510';
}
function natApi(path,body){
  try{ if(typeof e5!=='undefined'&&e5.api) return e5.api(path,{body:body||{}}); }catch(e){}
  return Promise.resolve(null);
}
/* 画布按「目标尺寸」建，源帧用 imageSmoothingEnabled=false 直接画上去：
   最近邻由我们自己保证，不依赖引擎对 CSS image-rendering 的支持
   （WPE 上 pixelated 不一定生效，那样就会被双线性糊掉）。 */
function natCanvas(g){
  var c=document.createElement('canvas');
  c.id='natcvs'; c.width=g.w; c.height=g.h;
  c.style.width='100%'; c.style.height='100%';
  var wrap=document.createElement('div'); wrap.id='screenwrap';
  var fx=document.createElement('div'); fx.id='fx';
  wrap.appendChild(c); wrap.appendChild(fx);
  $('ejs_game').replaceChildren(wrap);
  nat.cvs=c; nat.ctx=c.getContext('2d');
  var src=document.createElement('canvas'); src.width=g.w; src.height=g.h;
  nat.src=src; nat.srcCtx=src.getContext('2d');
  nat.img=nat.srcCtx.createImageData(g.w,g.h);
  var d=nat.img.data; for(var i=3;i<d.length;i+=4) d[i]=255;
  nat.w=g.w; nat.h=g.h; nat.frames=0; nat.lastFrames=0; nat.fpsAt=0;
  nat.open=false; nat.err=''; nat.seen=-1; nat.stallTicks=0; nat.paused=false;
}
function natBegin(g){
  natCanvas(g);
  $('status').textContent='启动原生核心 '+g.f+' …';
  $('tres').textContent='启动中…';
  natApi('/emu/start',{rom:g.f}).then(function(r){
    try{
      if(r&&r.ok===false){ logs.push('emu/start '+(r.error||'fail')); nat.err=r.error||'start fail'; }
      nat.hasState=!!(r&&r.state);
      nat.slots=(r&&r.slots)||[];
      nat.startedAt=Date.now();
    }catch(e){}
    natConnect(0);
  }).catch(function(e){ logs.push('emu/start 拒绝 '+e); natConnect(0); });
}
/* 后端拉起进程和端口监听有几毫秒到一秒的差：连不上就退避重试，最多 8 秒 */
function natConnect(tryN){
  tryN=tryN||0;
  if(!running) return;
  /* 旧连接要先彻底断开，否则它继续收帧，画面会被画两遍、帧率也会翻倍 */
  try{
    if(nat.ws){ var old=nat.ws; nat.ws=null; old.onmessage=null; old.onclose=null; old.onerror=null; old.close(); }
  }catch(e){}
  var ws;
  try{ ws=new WebSocket(natUrl()); }catch(e){ natFail('原生连接失败 '+e); return; }
  nat.ws=ws; ws.binaryType='arraybuffer';
  var opened=false;
  /* 握手有可能一直挂着：端口在监听、但服务端正忙着上一个客户端（只接受一个
     连接），Chrome 既不报错也不断开，就一直停在 CONNECTING。所以自己定个时限，
     到点主动断开再重连，不然后面所有的重试逻辑都等不到 onclose。 */
  var timer=setTimeout(function(){
    if(opened) return;
    try{ ws.onopen=null; ws.onmessage=null; ws.onerror=null; ws.onclose=null; ws.close(); }catch(e){}
    if(nat.ws===ws) nat.ws=null;
    nat.open=false; nat.err='连接超时';
    if(running&&tryN<20){ setTimeout(function(){ natConnect(tryN+1); },400); }
  },2500);
  ws.onopen=function(){
    opened=true; clearTimeout(timer); nat.open=true; nat.err=''; marks.wsOpen=Date.now()-t0;
    try{ $('status').textContent='原生已连接 · '+current.sys+' '+current.n; }catch(e){}
    natSendInput();
  };
  ws.onmessage=function(ev){ try{ natDraw(ev.data); }catch(e){ nat.err='draw '+e; } };
  ws.onerror=function(){ if(!opened) nat.err='ws error'; };
  ws.onclose=function(){
    clearTimeout(timer);
    if(nat.ws===ws) nat.ws=null;
    nat.open=false;
    if(!running) return;
    if(!opened && tryN<20){ setTimeout(function(){ natConnect(tryN+1); },400); return; }
    if(opened){ try{ $('status').textContent='原生连接断开'; }catch(e){} showStall(); }
  };
}
/* 帧格式：宽 u16le、高 u16le、RGB565 像素。565→888 用位移拼装，
   每个像素 4 次位运算；61,440 像素一帧，实测在设备上够用。 */
function natDraw(buf){
  if(!(buf instanceof ArrayBuffer)||buf.byteLength<8) return;
  var dv=new DataView(buf);
  var w=dv.getUint16(0,true), h=dv.getUint16(2,true);
  if(!w||!h||buf.byteLength<4+w*h*2) return;
  if(!nat.img||nat.img.width!==w||nat.img.height!==h){
    nat.w=w; nat.h=h;
    nat.src.width=w; nat.src.height=h;
    nat.img=nat.srcCtx.createImageData(w,h);
    var d0=nat.img.data; for(var i=3;i<d0.length;i+=4) d0[i]=255;
    fitLastW=0; fitLastH=0;
    /* 核心换了分辨率就重新算外框（只在这一刻做一次，不占每帧的开销） */
    try{ fit(); }catch(e){}
  }
  var out=new Uint32Array(nat.img.data.buffer);
  var src=new Uint16Array(buf,4,w*h);
  /* 留一份最新帧的引用：这台 WebKit 的 canvas.toDataURL 对非空画面会吐
     乱码，截图只能走"原始像素 → 后端拼 PNG"这条路。 */
  nat.rawBuf=buf; nat.rawW=w; nat.rawH=h;
  /* RGB565：R 在高 5 位、B 在低 5 位；ImageData 的内存序是 R,G,B,A（小端下
     Uint32 的低字节是 R）。所以 R 要左移 3 放到低字节，B 要放到第 3 字节。 */
  for(var i=0,n=w*h;i<n;i++){
    var p=src[i];
    out[i]=0xff000000|(((p>>11)&0x1f)<<3)|(((p>>5)&0x3f)<<10)|((p&0x1f)<<19);
  }
  /* 关掉平滑，把源帧最近邻画到画布的真实尺寸上（画布由 fit() 设成目标尺寸） */
  nat.srcCtx.putImageData(nat.img,0,0);
  nat.ctx.imageSmoothingEnabled=false;
  nat.ctx.drawImage(nat.src,0,0,nat.cvs.width,nat.cvs.height);
  nat.frames++;
}
function natSendInput(){
  /* 只遍历 ACTIONS 里真实存在的按钮号：libretro 的 B 是 0，
     之前写成 "n>0" 就把射击键整个过滤掉了（6 按了没反应就是这个）。 */
  var mask=0;
  for(var i=0;i<ACTIONS.length;i++){ var n=ACTIONS[i].btn; if(held[n]===true) mask|=(1<<n); }
  nat.mask=mask;
  var ws=nat.ws;
  if(!ws||ws.readyState!==1) return;
  var a=new Uint8Array(4);
  a[0]=mask&255; a[1]=(mask>>8)&255; a[2]=(mask>>16)&255; a[3]=(mask>>24)&255;
  try{ ws.send(a); }catch(e){}
}
/* 存档槽：0 = 自动续玩（退出、挂起、每 30 秒写一次），1..3 = 手动槽。
   自动存档只写自己的槽，不会覆盖你手动存的进度。 */
var slot=1;
try{ var s0=parseInt(localStorage.getItem('e5slot')||'1',10); if(s0>=1&&s0<=3) slot=s0; }catch(e){}
function slotLabel(){ /* HUD 上固定叫「存档」，具体槽位在弹窗里选 */ }
function natCmd2(cmd,sl){
  var ws=nat.ws;
  if(!ws||ws.readyState!==1) return false;
  try{ ws.send(new Uint8Array([cmd&255,sl&255])); return true; }catch(e){ return false; }
}
/* 单字节命令：1=存即时档 2=读即时档 3=电池存档落盘 4=暂停/继续 */
function natCmd(c){
  var ws=nat.ws;
  if(!ws||ws.readyState!==1) return false;
  try{ ws.send(new Uint8Array([c&255])); return true; }catch(e){ return false; }
}
/* 屏幕中间的小提示：读档/恢复时给个交代，别让画面突然一跳 */
var loadTipTimer=0;
function loadTip(on,text,ms){
  try{
    var el=$('loadtip'); if(!el) return;
    if(text) el.textContent=text;
    el.classList.toggle('show',!!on);
    clearTimeout(loadTipTimer);
    if(on&&ms) loadTipTimer=setTimeout(function(){ try{ el.classList.remove('show'); }catch(e){} },ms);
  }catch(e){}
}
function natStop(){
  try{ if(nat.ws){ var w=nat.ws; nat.ws=null; w.onclose=null; w.close(); } }catch(e){}
  nat.open=false;
  natApi('/emu/stop',{});
}
function natFail(msg){
  nat.err=msg; phase='stalled';
  try{ $('status').textContent=msg; $('tres').textContent=msg;
       var st=$('stall'); if(st){ st.querySelector('.stxt').textContent=msg; } }catch(e){}
  showStall();
}
/* 挂起：宿主把框架藏起来（通知/来电/菜单键），先停进程，别让游戏白跑 */
function nativeSuspend(why){
  if(susp.on) return;
  noteExit('suspend:'+(why||'hidden'));
  susp.on=true; susp.count++; susp.at=Date.now(); susp.why=why||'hidden';
  phase='suspended';
  try{ natCmd2(1,0); }catch(e){}      /* 先把自动槽落盘，回来能接着打 */
  try{ natStop(); }catch(e){}
  try{ $('status').textContent='已挂起（宿主切走了）'; }catch(e){}
}
/* 框架回来了：重新拉起进程，3 秒后自动读回上一次的即时存档 */
function nativeResume(){
  if(!susp.on||!running||!current) return;
  noteExit('resume');
  susp.on=false; susp.ticks=0;
  phase='loading'; nat.autoLoaded=false; nat.seen=-1; nat.stallTicks=0;
  try{ $('status').textContent='恢复中…'; }catch(e){}
  natApi('/emu/start',{rom:current.f}).then(function(){ natConnect(0); })
    .catch(function(){ natConnect(0); });
}
/* 每秒一次的 native 侧维护：算帧率、补宿主样式、卡死检测、自动存档 */
var kaTick=0;
function nativeTick(){
  /* 游戏在跑的时候每 5 秒重申一次「别锁屏」：这一条消息一旦丢了，
     60 秒后宿主就会按空闲锁屏，表现就是玩着玩着黑屏、回来像被强制退出 */
  /* 宿主 idle=60 秒就关屏。这里每秒续一次 keepAwake（原来 2 秒一次，
     消息一丢就会在 60 秒后黑屏）；续的是 keepAwake，不是输入，不影响用户主动息屏。 */
  try{ if(typeof e5!=='undefined'&&e5.keepAwake) e5.keepAwake(true); }catch(e){}
  if(susp.on) return;          /* 挂起期间不刷帧率、不续宿主心跳，让看门狗把菜单栏还回去 */
  fit();
  var now=Date.now();
  if(nat.fpsAt) window.__fps=(nat.frames-nat.lastFrames)*1000/Math.max(1,now-nat.fpsAt);
  nat.lastFrames=nat.frames; nat.fpsAt=now;
  try{ $('tfps').innerHTML='<b>'+(window.__fps?window.__fps.toFixed(1):'--')+'</b> FPS'; }catch(e){}
  if(nat.frames>0&&phase!=='running'){
    phase='running'; marks.firstFrame=now-t0;
    try{ $('status').textContent='运行中 · '+current.sys+' '+current.n; }catch(e){}
    if(susp.count){ loadTip(true,'已从息屏恢复',1500); }
    if(selftestWant&&!selftestDone){ selftestDone=true; try{ runSelftest(); }catch(e){} }
  }
  if(nat.frames===0&&now-t0>9000){ natFail('原生核心没有出帧（设置里可切到运行库）'); }
  else if(nat.frames>0){ try{ $('tres').textContent=nat.w+'×'+nat.h+(nat.paused?' · 暂停':''); }catch(e){} }
  if(nat.paused){ nat.stallTicks=0; nat.seen=nat.frames; }
  else if(nat.seen===nat.frames){ nat.stallTicks++; } else { nat.stallTicks=0; nat.seen=nat.frames; }
  if(nat.stallTicks>=4&&nat.frames>0){ try{ $('tres').textContent='画面卡住'; }catch(e){} showStall(); }
  /* 进游戏 3 秒后读回上次的即时档；之后每 30 秒存一次 */
  if(!nat.autoLoaded&&nat.frames>0&&now-t0>3000){
    nat.autoLoaded=true;
    if(nat.hasState&&natCmd2(2,0)){ lastSave='已读回上次进度'; loadTip(true,'存档读取中…',1400); }
  }
  nat.savedAgo++;
  if(nat.savedAgo>=30&&nat.frames>0){ nat.savedAgo=0; if(natCmd2(1,0)) lastSave='自动存档 '+new Date().toLocaleTimeString(); }
  hostChrome(true);
}


/* 这台机器的 WPE 浏览器没有可用的音频输出（缺 GStreamer 的 autoaudiosink）：
   核心初始化音频时会抛 NotAllowedError，主循环随即停住（灰屏、FPS 0、按键无效）。

/* 页面不可见时 requestAnimationFrame 不触发 → 兜底用 setTimeout，息屏后游戏也不会停 */
(function(){
  var native=window.requestAnimationFrame?window.requestAnimationFrame.bind(window):null;
  window.requestAnimationFrame=function(cb){
    if(native&&document.visibilityState==='visible') return native(cb);
    return setTimeout(function(){ cb(performance.now()); },16);
  };
  window.cancelAnimationFrame=function(id){ clearTimeout(id); };
})();

/* ==== 机种范围（拆分插件用）====
   同一份页面代码可以派生成多个插件：复古游戏机（FC/MD/GBA/街机）、
   DOS 游戏、仙剑。SCOPES 为空表示不限制；tools/split-emulator-plugins.py
   生成子插件时会把这一行替换成对应的机种列表，其余代码完全一致，
   避免三份副本各自漂移。
   这样做的前提：页面里没有任何按机种写死的分支（已核对，sys 只用于
   标签高亮和游戏表分组），所以过滤只是"少显示几组"而已。 */
var SCOPES=['FC','MD','GBA','ARC'];

function gamesInScope(){
  if(!SCOPES.length) return GAMES;
  return GAMES.filter(function(g){ return SCOPES.indexOf(g.sys)>=0; });
}

/* 页面被销毁（宿主 closeApp / 刷新 / 崩溃重载）时也要留一条：
   fetch keepalive 和 sendBeacon 都能在卸载阶段尽量把请求发出去。 */
function flushStat(reason){
  try{
    var body={tag:'exit', reason:reason, t:new Date().toISOString(), phase:phase, snap:snapshot()};
    var raw=JSON.stringify(body);
    if(raw.length>3800){ body.snap.keyLog=String(body.snap.keyLog||'').slice(0,360); raw=JSON.stringify(body); }
    if(navigator.sendBeacon){
      navigator.sendBeacon('/api/plugins/e5-emulator/stat', new Blob([raw],{type:'application/json'}));
    }else{
      fetch('/api/plugins/e5-emulator/stat',{method:'POST',body:raw,keepalive:true,
        headers:{'Content-Type':'application/json'}});
    }
  }catch(e){}
}

/* 标签按当前插件的机种范围动态生成：复古游戏机显示 FC/MD/GBA/街机，
   DOS 插件只显示 DOS，仙剑插件只有一项时连标签都不必给。
   顺序固定，数字键 1..N 的映射也就稳定。 */
var SYS_ORDER=['FC','MD','GBA','ARC','DOS','PAL'];
var SYS_LABEL={FC:'FC',MD:'MD',GBA:'GBA',ARC:'街机',DOS:'DOS',PAL:'仙剑'};
function buildTabs(){
  var hosts=gamesInScope().map(function(g){ return g.sys; });
  var uniq=[];
  SYS_ORDER.forEach(function(s){ if(hosts.indexOf(s)>=0) uniq.push(s); });
  /* SCOPES 里可能有开空表的机种，按实际上架的游戏再收一次 */
  uniq=uniq.filter(function(s){
    return gamesInScope().some(function(g){ return g.sys===s && g.games.length>0; });
  });
  var bar=$('tabs'); if(!bar) return;
  bar.replaceChildren();
  var total=flat().length;
  var defs=[{sys:'ALL',label:'全部'}].concat(uniq.map(function(s){ return {sys:s,label:SYS_LABEL[s]||s}; }));
  /* 只有一个机种、且没有"全部"的必要性时，去掉 ALL，避免出现两个等价标签 */
  if(uniq.length===1) defs=[{sys:uniq[0],label:SYS_LABEL[uniq[0]]||uniq[0]}];
  defs.forEach(function(d,i){
    var b=document.createElement('button');
    b.type='button'; b.setAttribute('data-sys',d.sys);
    b.className=(i===0?'on':'');
    var em=document.createElement('b'); em.textContent=String(i+1);
    b.appendChild(em);
    b.appendChild(document.createTextNode(' '+d.label));
    b.addEventListener('click',function(){ setTab(d.sys); });
    bar.appendChild(b);
  });
  tabSys=defs[0].sys;
  return defs;
}

/* 九宫格：3 列，纵向滚动；序号按“当前可见的第一格”往后排 */
function drawMenu(){
  var all=flat();
  flatList=all.filter(function(g){ return tabSys==='ALL'||g.sys===tabSys; });
  var m=$('menu'); m.replaceChildren();
  cells=[];
  flatList.forEach(function(g,i){
    var b=document.createElement('button'); b.type='button'; b.className='cell';
    var art=document.createElement('span'); art.className='art';
    art.style.background='hsl('+hue(g.n)+',34%,26%)';
    art.textContent=g.n.charAt(0);
    var img=document.createElement('img'); img.alt=''; img.style.display='none';
    img.onerror=function(){ img.style.display='none'; };
    img.onload=function(){ art.style.background='transparent'; img.style.display='block'; };
    img.src='/roms/art/'+g.key+'.jpg';
    art.appendChild(img);
    var sys=document.createElement('span'); sys.className='sys'; sys.textContent=g.sys;
    var cap=document.createElement('span'); cap.className='cap'; cap.textContent=g.n;
    b.append(art,sys,cap);
    bindTap(b,function(){ start(i); });
    m.appendChild(b);
    cells.push(b);
  });
  sel=Math.max(0,Math.min(sel,cells.length-1));
  renumber();
  $('status').textContent=(tabSys==='ALL'?'共 ':'')+flatList.length+' 个游戏'+(tabSys==='ALL'?'':' · '+tabSys);
  /* 上次是"卡死后重进"留下的标记：自动进同一个游戏（自动存档会读回进度） */
  try{
    var rn=localStorage.getItem('e5resume');
    if(rn && !window.__resumed && autoIdx<0){
      window.__resumed=1;
      localStorage.removeItem('e5resume');
      for(var ri=0;ri<flatList.length;ri++){
        if(flatList[ri].n===rn){ (function(idx){ setTimeout(function(){ start(idx); },60); })(ri); break; }
      }
    }
  }catch(e){}
}
function setTab(sys){
  tabSys=sys;
  try{
    var bs=document.querySelectorAll('#tabs button');
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on',bs[i].getAttribute('data-sys')===sys);
  }catch(e){}
  sel=0;
  drawMenu();
}
/* 标签按钮由 buildTabs() 动态创建，点击绑定也在那里完成；
   原来这里有一段给写死的静态标签绑事件的 IIFE，拆分后已无意义。 */
function renumber(){
  /* 序号角标已经去掉（数字键改成切 tab），这里只保留"当前可见第一项"的计算，
     十字键翻页仍然需要它。 */
  var m=$('menu'), top=m.getBoundingClientRect().top;
  var first=0;
  for(var i=0;i<cells.length;i++){
    var r=cells[i].getBoundingClientRect();
    if(r.bottom>top+2){ first=i; break; }
  }
  window.__first=first;
}
function selectIdx(i){
  if(!cells.length) return;
  sel=(i+cells.length)%cells.length;
  for(var j=0;j<cells.length;j++) cells[j].classList.toggle('sel', j===sel);
  var c=cells[sel];
  if(c&&c.scrollIntoView) c.scrollIntoView({block:'nearest'});
  renumber();
}
$('menu').addEventListener('scroll',function(){ renumber(); },{passive:true});

/* 重进：原生就重启会话，运行库就顺手清掉可能残缺的核心缓存再重载
   （删除完成之后才重载，不会出现"重载把缓存写坏"的情况），存档会自动读回。
   这里不再切换引擎：引擎在按键设置里选，开局时决定。 */
function resumeGame(){
  if(current&&nativeWanted(current)){
    try{ natStop(); }catch(e){}
    setTimeout(function(){ try{ location.reload(); }catch(e){} },350);
    return;
  }
  clearEjsCoreCache(function(r){
    try{ logs.push('重进清缓存 '+r); }catch(e){}
    setTimeout(function(){ try{ location.reload(); }catch(e){} },250);
  });
}
bindTap($('sresume'),function(){ resumeGame(); });

/* 核心缓存完整性自检。
   运行库把核心文件缓存在 IndexedDB 的 EmulatorJS-core 库里；如果写入过程被打断
   （页面被重载、浏览器被 OOM 杀掉、息屏），缓存里会留下截断的文件。下次启动
   运行库只比对版本号就会拿这份残缺核心去跑，wasm 跑到缺失的那段函数时抛
   "call_indirect to a signature that does not match"，主循环断掉、画面定格。
   这里拿缓存条目的长度和设备上 .data 的实际长度对比，对不上就删掉缓存。 */
function checkCoreCache(cb){
  try{
    if(!window.indexedDB){ if(cb) cb('no-idb'); return; }
    var name=(window.EJS_core||'fceumm')+'-wasm.data';
    var rq=indexedDB.open('EmulatorJS-core',1);
    rq.onerror=function(){ if(cb) cb('no-db'); };
    rq.onsuccess=function(){
      var db=rq.result;
      var tx,st,q;
      try{
        tx=db.transaction(['core'],'readonly');
        st=tx.objectStore('core');
        q=st.get(name);
      }catch(e){ if(cb) cb('ex '+e); return; }
      q.onsuccess=function(){
        var rec=q.result;
        var have=rec&&rec.data?rec.data.byteLength:0;
        if(!have){ if(cb) cb('empty'); return; }
        fetch(BASE+'ejs/data/cores/'+name,{method:'HEAD'}).then(function(r){
          var len=+(r.headers.get('Content-Length')||0);
          if(len && have!==len){
            var d=indexedDB.deleteDatabase('EmulatorJS-core');
            d.onsuccess=function(){ if(cb) cb('truncated '+have+'!='+len+' 已清'); };
            d.onerror=function(){ if(cb) cb('truncated '+have+'!='+len+' 删失败'); };
            d.onblocked=function(){ if(cb) cb('truncated '+have+'!='+len+' 被占用'); };
          }else if(cb) cb('ok '+have);
        }).catch(function(){ if(cb) cb('head-fail'); });
      };
      q.onerror=function(){ if(cb) cb('read-err'); };
    };
  }catch(e){ if(cb) cb('ex2 '+e); }
}

/* 卡死自动恢复：主循环被打断后，核心缓存很可能已经残缺。
   倒计时结束就清缓存 + 重载 + 自动回到同一游戏（存档会读回）。
   每个会话最多自动恢复一次，免得变成"加载→死→重载"的死循环。 */
var stallCount=0, stallTimer=0, autoRecovering=false;
function startStallRecovery(){
  if(autoRecovering||stallTimer) return;
  try{ stallCount=(parseInt(localStorage.getItem('e5stallcount')||'0',10)||0); }catch(e){}
  if(stallCount>=1) return;          /* 已经自动恢复过一次了，改由人来决定 */
  autoRecovering=true;
  var left=6;
  try{ $('stall').classList.add('show'); $('stall').querySelector('.stxt').textContent='画面卡住 '+left+'s 后自动重进'; }catch(e){}
  stallTimer=setInterval(function(){
    left--;
    if(left<=0){
      clearInterval(stallTimer); stallTimer=0;
      try{ localStorage.setItem('e5stallcount',String(stallCount+1)); }catch(e){}
      resumeGame();
      return;
    }
    try{ $('stall').querySelector('.stxt').textContent='画面卡住 '+left+'s 后自动重进'; }catch(e){}
  },1000);
}
function applyKeymap(){
  /* 原生引擎直接发位图，没有运行库的 controls 表可写 */
  if(running&&nativeWanted(current)) return;
  try{
    var em=window.EJS_emulator;
    if(!em||!em.controls||!em.controls[0]) return;
    var c=em.controls[0];
    /* 运行库自己的键盘通道也按当前配置填一遍（它每个按钮只能记一个键码，取最后一个） */
    for(var i=0;i<ACTIONS.length;i++){
      var a=ACTIONS[i], ks=keymap[a.id]||[];
      if(a.btn===undefined) continue;   /* 斜方向是组合动作，运行库没有对应控件 */
      for(var j=0;j<ks.length;j++){
        var code=codeOf(ks[j]);
        if(code!==null && c[a.btn]) c[a.btn].value=code;
      }
    }
    window.__keymap=JSON.stringify(c);
  }catch(e){}
}

document.addEventListener('touchstart',function(){ grabFocus(); },{passive:true,capture:true});

function focusCanvas(){

/* 游戏动作 → libretro 按钮号：0=B 2=SELECT 3=START 4=上 5=下 6=左 7=右 8=A 10=L 11=R
   键位可以改：菜单里的"按键"设置页能重新绑定，存在本机 localStorage。 */
var ACTIONS=[

/* ---- 按键：页面自己在 window 上接，不走 SDK 的转发 ----
   两道闸门会吃掉所有按键：
     - 宿主页面在 appOpen 时 preventDefault 后把焦点搬进 iframe（第一个键必被吞）；
     - SDK 在 blank（息屏）或 input-blocked（通知卡）时直接丢掉按键。
   所以这里直接在 window 上 capture 监听，自己判断 kind、自己处理。 */
function keyKindOf(e){
  var k=e.key, c=e.keyCode;
  if(k==='ContextMenu'||k==='Menu') return 'menu';
  if(k==='F13'||k==='Phone'||k==='PickupPhone'||k==='Call') return 'call';
  if(k==='ArrowLeft'||c===37) return 'left';
  if(k==='ArrowRight'||c===39) return 'right';
  if(k==='ArrowUp'||c===38) return 'up';
  if(k==='ArrowDown'||c===40) return 'down';
  if(k==='Enter'||k==='Select'||k==='Accept'||c===13) return 'ok';
  if(k==='BrowserBack'||k==='GoBack'||k==='Backspace'||k==='Escape'||c===8||c===27||c===166) return 'back';
  if(k==='PowerOff'||k==='Power'||k==='Standby'||k==='Sleep') return 'power';
  /* 这台机器的 # 键是 KEY_NUMERIC_POUND -> numbersign，但 WebKit 报成
     Unidentified + keyCode 51（和数字 3 同一个码），所以只能靠 key 名区分：
     数字 3 会带 key="3"，# 只有码没有名字。 */
  if(c===51&&(!k||k==='Unidentified')) return 'digit';
  if(k&&k.length===1&&((k>='0'&&k<='9')||k==='*'||k==='#')) return 'digit';
  return 'other';
}
/* 返回键的"身份"：硬件一次按压会上报 KEY_BACK(166) 与 Backspace(8) 两个不同身份。
   靠身份配对来区分"同一次按压的孪生事件"和"玩家连按"，避免用时间窗把连击也限速。 */
function backIdOf(e){
  if(e.keyCode===8||e.key==='Backspace') return 'bs';
  if(e.keyCode===166||e.key==='BrowserBack'||e.key==='GoBack') return 'bb';
  return 'k:'+(e.key||'');

/* 返回键按下的时刻：长按退出后手还没松开，按键重复会一波波继续来。
   靠它把那一串重复吞掉，别漏给宿主（漏了宿主就会把整个插件关掉）。 */
var backDownAt=0, backGuardUntil=0, backHeld=false;

   （数字 3 也是 51，但带 key="3"），这里统一折成 "#"，键位表才匹配得到。 */
function keyTok(kind,key,code){
  if(kind==='digit'&&(!key||key==='Unidentified')&&code===51) return '#';
  return key||('code:'+(code||0));

function handleKey(kind,key,repeat,id,code){

  keyCount++; keyLogPush('D:'+kind+(key?(':'+key):'')+(code?('#'+code):'')+(repeat?'!':''));

       只要键还没松，就当同一次按压，一律吞掉 —— 否则会漏给宿主关掉插件。 */
    if(kind==='back'&&(backHeld||Date.now()-backDownAt<1500||Date.now()<backGuardUntil)) return true;
    if(kind==='up'){ selectIdx(sel-3); return true; }
    if(kind==='down'){ selectIdx(sel+3); return true; }
    if(kind==='left'){ selectIdx(sel-1); return true; }
    if(kind==='right'){ selectIdx(sel+1); return true; }

      var idx=parseInt(key,10)-1;

       同一次按压的孪生事件（身份与上一次不同）丢掉；同身份连按不限速，
       保证格斗/射击游戏的连续出拳不会被吞键。 */
    var pairable=(id==='bb'||id==='bs');

                        (id===lastBackId&&now-lastBackTime<150&&!backKeyupSincePress))) return true;
    }else{

       射击游戏里拇指按住这个键当连发时，1.2/1.8 秒的计时会把游戏直接退回列表，
       这就是"玩着玩着突然退出"的主要来源。退出一律用 HUD 上的「退」。 */
    pressBtn(btnOf('b'));

     不一定是 ArrowUp / Enter（有的是 Up、Select、Accept），按种类才稳。
     用户自定义的键位（数字键等）仍按 key 字面值查表。 */
  var tok0=keyTok(kind,key,code);
  if(code) pressedTok[code]=tok0;
  lastKeyAt=Date.now();
  var kindAct={up:'up',down:'down',left:'left',right:'right',ok:'a'};
  if(kindAct[kind]){
    var kb=btnsOf(kindAct[kind]);
    for(var jk=0;jk<kb.length;jk++) if(kb[jk]!==undefined) pressBtn(kb[jk]);
  }
  var acts=actsOf(keyTok(kind,key,code));
  if(acts.length){
    for(var i=0;i<acts.length;i++){
      var bs=btnsOf(acts[i]);
      for(var j=0;j<bs.length;j++) if(bs[j]!==undefined) pressBtn(bs[j]);
    }

  }

window.addEventListener('keydown',function(e){

window.addEventListener('keyup',function(e){

  if(kind==='back'){ backHeld=false; backDownAt=0; backGuardUntil=Date.now()+400; }
  if(!running) return;
  keyLogPush('U:'+kind+(e.key?(':'+e.key):'')+(e.keyCode?('#'+e.keyCode):''));
  if(kind==='back'){
    try{ clearInterval(backTick); }catch(e){}
    backTick=0;
    backKeyupSincePress=true;   /* 出现过 keyup → 下一次同身份事件算新的按压 */
    releaseBtn(btnOf('b'));     /* 短按返回 = 松开 B */

  }
  var tk=(e.keyCode&&pressedTok[e.keyCode])||keyTok(kind,e.key,e.keyCode);

  for(var i=0;i<acts.length;i++){
    var bs=btnsOf(acts[i]);

  }
  /* 按"种类"按下的键（方向键 / 确认键）也要在这里松开 */
  var kindActUp={up:'up',down:'down',left:'left',right:'right',ok:'a'};
  if(kindActUp[kind]){

/* 切走或熄屏时把还按着的键全部松开，免得回来那个键还在按下状态 */

/* SDK 回调只负责告诉宿主"这个键插件收了"（否则宿主会把返回键当退出应用），

   SDK 收到 onKey=false 会调用 onBack，onBack 再返回 false 就发 e5:exit 让宿主关掉插件。 */

     而多键同按时键盘矩阵偶尔会报出一个幽灵 menu 键，正打着就被弹回应用列表。
     退出游戏只有一个明确入口：HUD 上的「退」。返回键在游戏里只当 B，不再兼任退出。 */
  /* 返回键在「不在游戏里」时也要自己处理，不能让 SDK 发 e5:exit：
     长按 1.2 秒退出后手指还按着，键盘会继续送 keydown，超过 1.5 秒的那些
     以前就漏出去了，宿主 closeApp() 直接把插件关掉 —— 表现就是"退出直接到主页"。 */
  function emuOnKey(k){
    if(cfgOpen) return k.kind!=='power';
    if(k.kind==='power'||k.kind==='call') return false;
    if(k.kind==='menu') return !!running;
    /* 只吞「长按退出那一次按压」的余波：手指还按着、或刚松手 400ms 内。

  if(e5.onBack) e5.onBack(function(){
    if(backHeld||Date.now()<backGuardUntil||Date.now()-backDownAt<1500) return true;
    window.__backTaken=running; return running;
  });
}

/* ---- 按键设置面板 ----

function cfgLabel(tok){
  var m={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Enter:'确认',Space:'空格',Backspace:'退格'};
  if(m[tok]) return m[tok];

/* 开局提示：按当前键位配置生成，改了配置提示也跟着变 */
function hintText(){

  return '方向 '+k('up')+k('left')+k('down')+k('right')+'　A '+k('a')+'　B '+k('b')+'　START '+k('start')+'　SELECT '+k('select')+'　「转」=键左/键右/竖屏　退出用「退」';

function buildCfg(){
  var g=$('cfgrid');

    (function(a,idx){
      var d=document.createElement('div');
      d.className='cfgcell'; d.id='cfgcell'+idx;
      d.innerHTML='<div class="nm"></div><div class="kv"></div><button class="clr" type="button">×</button>';
      d.querySelector('.nm').textContent=a.name;

        if(ev && ev.target && ev.target.classList && ev.target.classList.contains('clr')){
          keymap[a.id]=[]; saveKeymap(); refreshCfg(); applyKeymap();
          $('cfgtip').textContent=a.name+' 已清空'; return;
        }
        cfgSel=idx; cfgListen=true; refreshCfg();

  for(var i=0;i<ACTIONS.length;i++){

    var ks=keymap[ACTIONS[i].id]||[];
    d.querySelector('.kv').textContent=ks.length?ks.map(cfgLabel).join(' · '):'未设置';
    d.className='cfgcell'+(i===cfgSel?' sel':'')+(cfgListen&&i===cfgSel?' listen':'');

function assignKey(tok){
  var a=ACTIONS[cfgSel]; if(!a) return;
  var ks=(keymap[a.id]||[]).slice();

  keymap[a.id]=ks; saveKeymap(); applyKeymap();

  $('cfgtip').textContent=a.name+' = '+ks.map(cfgLabel).join(' · ');

function cfgKey(kind,key,repeat,code){
  if(kind==='power') return false;
  if(kind==='back'||kind==='menu'){ closeCfg(); return true; }
  if(cfgListen && kind!=='up' && kind!=='down' && kind!=='left' && kind!=='right' && kind!=='ok'){
    var tok=keyTok(kind,key,code);
    if(BACK_TOKENS.indexOf(tok)>=0){ $('cfgtip').textContent='返回键保留用于退出游戏，不能绑定'; return true; }
    assignKey(tok); return true;

  if(kind==='ok'){ cfgListen=!cfgListen; refreshCfg(); $('cfgtip').textContent=cfgListen?'现在按一个键':'选一项，再按一个键'; return true; }

  if(kind==='up'){ cfgSel=Math.max(0,cfgSel-3); refreshCfg(); return true; }
  if(kind==='down'){ cfgSel=Math.min(ACTIONS.length-1,cfgSel+3); refreshCfg(); return true; }
  if(kind==='left'){ if(cfgSel%3) cfgSel--; refreshCfg(); return true; }
  if(kind==='right'){ if(cfgSel%3<2&&cfgSel+1<ACTIONS.length) cfgSel++; refreshCfg(); return true; }

var cfgPausedNative=false;

      if(natCmd(4)){ nat.paused=true; cfgPausedNative=true; $('bpause').textContent='▶'; }
    }
  }catch(e){}
}
function closeCfg(){
  globalClickGuard(500);
  cfgOpen=false; cfgListen=false; $('cfg').classList.remove('open');
  try{
    if(cfgPausedNative&&running&&nativeWanted(current)&&nat.paused){
      if(natCmd(4)){ nat.paused=false; $('bpause').textContent='❚❚'; }
    }
  }catch(e){}
  cfgPausedNative=false;
  try{ if(typeof e5!=='undefined'&&e5.keepAwake) e5.keepAwake(true); }catch(e){}
}
/* 游戏内打开设置的唯一入口：HUD 上的「设」。键盘上的 # 留给游戏自己用。 */
bindTap($('bset'),function(){ openCfg(); });
try{ bindTap($('bcore'),function(){ coreInstall(); }); }catch(e){}
/* 右上角改成「保存」：改键本来就已经即时落盘，这里只负责收起并确认一下 */
bindTap($('cfgclose'),function(){

});

/* 画面模式（按顺序循环）：
   wide  = 左右铺满、上下保持同一缩放比（不拉伸，像素不变形）——默认
   full  = 高度也铺满（纵向拉伸，不设上限）
   int   = 1:1 原生分辨率不缩放，像素绝对清晰，画面小、四周黑边
   三种都由 JS 用最近邻画到目标尺寸，不依赖引擎的 CSS 缩放过滤器。 */
var FIT_MODES=['wide','full','int'];
var fitMode='wide';
try{
  var fp=new URLSearchParams(location.search).get('fit');
  if(FIT_MODES.indexOf(fp)>=0) fitMode=fp;
  else{ var fm=localStorage.getItem('e5fit'); if(FIT_MODES.indexOf(fm)>=0) fitMode=fm; }
}catch(e){}
var FIT_LABEL={wide:'铺',full:'拉',int:'1:1'};
var FIT_TITLE={wide:'画面：左右铺满，不拉伸',
               full:'画面：上下也拉满',
               int:'画面：原生分辨率不缩放，最清晰但画面小'};
function applyFitMode(){
  try{ localStorage.setItem('e5fit',fitMode); }catch(e){}
  document.body.classList.toggle('fitfull',fitMode==='full');
  var b=$('bview');
  if(b){ b.textContent=FIT_LABEL[fitMode]; b.title=FIT_TITLE[fitMode]; }
  var s=$('cfgscale');
  if(s) s.textContent='比例：'+(fitMode==='wide'?'宽铺':(fitMode==='full'?'拉伸':'原生 1:1'));
}
function cycleFit(){
  fitMode=FIT_MODES[(FIT_MODES.indexOf(fitMode)+1)%FIT_MODES.length];
  applyFitMode(); fit();
}
bindTap($('bview'),cycleFit);
bindTap($('cfgscale'),cycleFit);

/* ---- 横屏三态（键左/键右/竖屏）+ 虚拟按键 ----
   键左（默认）：掌机握法——机身顺时针转（顶部朝东），实体键盘落在左手；
   左手方向键躲不开就靠默认转向键位，屏幕右侧只放虚拟动作键 A/B。
   键右：机身逆时针转（顶部朝西），实体键盘落在右手当动作键，
   左手在屏幕左下用摇杆样式的虚拟十字键。
   两种横屏里虚拟键和实体键共用同一张按键位图（pressBtn/releaseBtn），同时生效。
   键位按「机种 × 方向」三套独立记忆，切方向时一并切换。
   每个游戏单独记忆旋转偏好（e5rot:<机种>-<游戏名>），按机种默认开场。 */
var ROT_MODES=['left','right','portrait'];
var ROT_LABEL={left:'键左',right:'键右',portrait:'竖'};
var rotateMode='left';
function rotKeyFor(g){ return 'e5rot:'+(g&&g.sys?g.sys:'?')+'-'+(g&&g.n?g.n:'?'); }
function loadRotateFor(g){
  rotGKey=rotKeyFor(g);   /* rotGKey 由 setRotate 的调用方保证已有值——见下 */
  var m='left';
  try{ var s=localStorage.getItem(rotGKey); if(ROT_MODES.indexOf(s)>=0) m=s; }catch(e){}
  /* 先有 key 才能存；setRotate 里 saveRot 空转一次没关系 */
  setRotate(m);
}
var rotGKey='';
function saveRot(){ try{ if(rotGKey) localStorage.setItem(rotGKey,rotateMode); }catch(e){} }
function setRotate(m){
  rotateMode=ROT_MODES.indexOf(m)>=0?m:'left';
  try{
    document.body.classList.remove('rot-l','rot-r');
    if(rotateMode==='left') document.body.classList.add('rot-l');
    else if(rotateMode==='right') document.body.classList.add('rot-r');
  }catch(e){}
  /* 横竖屏换方向的同时换这套方向的键位（键位三套独立记忆） */
  try{ setKeymapRot(rotateMode); }catch(e){}
  /* 游戏中切方向要连虚拟键一起重建：键左是右侧 A/B、键右是左侧摇杆，
     不重建的话切换后屏幕上还是上一模式的旧按钮（第一次部署就栽在这里） */
  try{ if(running&&current&&vpadEl){ stopTurbo(); ensureVpad(current.sys); } }catch(e){}
  var h=$('brot'); if(h){ h.textContent=ROT_LABEL[rotateMode];
    h.title='横屏方向：'+(rotateMode==='left'?'键左（键盘在左手）':(rotateMode==='right'?'键右（键盘在右手）':'竖屏')); }
  rotUI();
  vpadUpdate();
  if(running&&current){ try{ fit(); }catch(e){} }
}
function cycleRotate(){
  setRotate(ROT_MODES[(ROT_MODES.indexOf(rotateMode)+1)%ROT_MODES.length]);
  saveRot();
}
bindTap($('brot'),cycleRotate);
/* 设置面板里的三格方向图标：点哪个就切哪个（图标本身就是"手机怎么拿"） */
function rotUI(){
  var bs=document.querySelectorAll('#cfgrot button');
  for(var i=0;i<bs.length;i++){
    var on=bs[i].getAttribute('data-rot')===rotateMode;
    if(on) bs[i].classList.add('on'); else bs[i].classList.remove('on');
  }
}
(function(){
  var bs=document.querySelectorAll('#cfgrot button');
  for(var i=0;i<bs.length;i++){
    (function(b){
      bindTap(b,function(){ setRotate(b.getAttribute('data-rot')); saveRot(); });
    })(bs[i]);
  }
})();

/* ---------- 虚拟按键层 ----------
   只在游戏内 + 横屏两种模式下出现；位置固定在屏幕坐标，不随画面旋转。
   右上角 × 收起，收起后左侧留一个小按钮随时唤回（本次会话内生效）。 */
var vpadOn=true, vpadEl=null, turbo={};
function vpadUpdate(){
  if(vpadEl) vpadEl.classList.toggle('on',!!running&&rotateMode!=='portrait'&&vpadOn);
  var s=$('vpadshow');
  if(s) s.classList.toggle('on',!!running&&rotateMode!=='portrait'&&!vpadOn);
}
/* 连发已按用户要求去掉：键左模式下屏幕只放 A/B，连发靠实体键或以后再说 */
function stopTurbo(){
  for(var k in turbo){
    var t=turbo[k];
    if(t&&t.iv){ try{ clearInterval(t.iv); }catch(e){} }
    if(t&&t.on&&held[+k]) releaseBtn(+k);
    turbo[k]={on:false,iv:0};
  }
}
/* 常按兜底：按住方向键跑图超过 pressBtn 的自动松开时限时，
   touchmove 反复给定时器续期，长按不会断 */
function vKeepAlive(btns){
  for(var i=0;i<btns.length;i++){
    (function(b){
      if(held[b]){
        try{ clearTimeout(held['t'+b]); }catch(e){}
        held['t'+b]=setTimeout(function(){ releaseBtn(b); },15000);
      }
    })(btns[i]);
  }
}
function vbindGroup(btns,el){
  var iv=0;
  function press(){
    el.classList.add('hit');
    for(var i=0;i<btns.length;i++) pressBtn(btns[i]);
    /* 长按兜底：pressBtn 的自动松开定时器每 4 秒续一次期，
       按住跑图多久都不会中途断 */
    try{ clearInterval(iv); }catch(e){}
    iv=setInterval(function(){ vKeepAlive(btns); },4000);
  }
  function release(){
    el.classList.remove('hit');
    try{ clearInterval(iv); }catch(e){} iv=0;
    for(var i=0;i<btns.length;i++) releaseBtn(btns[i]);
  }
  return {press:press,release:release,keep:function(){ vKeepAlive(btns); }};
}
function addVB(txt,cls,pos,btns){
  var d=document.createElement('div');
  d.className='vb'+(cls?' '+cls:''); d.textContent=txt;
  for(var k in pos) d.style[k]=pos[k];
  var g=vbindGroup(btns,d);
  d.addEventListener('touchstart',function(e){ try{ e.preventDefault(); }catch(x){} g.press(); },{passive:false});
  d.addEventListener('touchmove',function(){ g.keep(); },{passive:true});
  d.addEventListener('touchend',function(){ g.release(); },{passive:false});
  d.addEventListener('touchcancel',function(){ g.release(); },{passive:true});
  d.addEventListener('mousedown',function(e){ try{ e.preventDefault(); }catch(x){} g.press(); });
  d.addEventListener('mouseup',function(){ g.release(); });
  d.addEventListener('mouseleave',function(){ g.release(); });
  vpadEl.appendChild(d);
  return d;
}
/* 虚拟摇杆（键右模式的左手方向）：圆盘 + 可拖动帽。
   手感参数（可在 URL 里临时调：?jtune=死区,行程,迟滞）：
   - 死区 7px：手指轻微抖动不误触；
   - 行程 36px：从中心到最大位移；
   - 8 向扇区（每 45°）+ 6° 迟滞：过边界不会来回抖，斜向很好出。 */
var joyCtl=null, joyDocBound=false;
var JOY_DEAD=6, JOY_R=36, JOY_HYST=5;
try{
  var jt=(new URLSearchParams(location.search).get('jtune')||'').split(',');
  if(jt.length===3){
    JOY_DEAD=Math.max(2,Math.min(20,parseFloat(jt[0])||JOY_DEAD));
    JOY_R=Math.max(20,Math.min(48,parseFloat(jt[1])||JOY_R));
    JOY_HYST=Math.max(0,Math.min(15,parseFloat(jt[2])||JOY_HYST));
  }
}catch(e){}
/* 扇区中心角（用户坐标系：0=右，90=上，逆时针为正）与对应按键组合 */
var JOY_CENTERS=[0,45,90,135,180,-135,-90,-45];
var JOY_DIRS=[{right:1},{right:1,up:1},{up:1},{up:1,left:1},
              {left:1},{left:1,down:1},{down:1},{down:1,right:1}];
function joySector(ang, prev){
  var HY=22.5+JOY_HYST;
  if(prev!==null && prev!==undefined){
    var pc=JOY_CENTERS[prev];
    var dd=Math.abs(((ang-pc+540)%360)-180);
    if(dd<=HY) return prev;
  }
  var best=0,bd=999;
  for(var i=0;i<8;i++){
    var d=Math.abs(((ang-JOY_CENTERS[i]+540)%360)-180);
    if(d<bd){ bd=d; best=i; }
  }
  return best;
}
function joyStart(px,py){
  if(!joyCtl) return;
  if(!joyCtl.active){
    joyCtl.active=true;
    joyCtl.prev=null;
    joyCtl.jIv=setInterval(function(){ try{ vKeepAlive([4,5,6,7]); }catch(e){} },4000);
  }
  joyMove(px,py);
}
function joyMove(px,py){
  if(!joyCtl||!joyCtl.active) return;
  var base=joyCtl.base, nub=joyCtl.nub;
  var r=base.getBoundingClientRect();
  var dx=px-(r.left+r.width/2), dy=py-(r.top+r.height/2);
  var len=Math.sqrt(dx*dx+dy*dy)||1;
  if(len>JOY_R){ dx=dx/len*JOY_R; dy=dy/len*JOY_R; }
  nub.style.transform='translate('+Math.round(dx)+'px,'+Math.round(dy)+'px)';
  base.classList.add('hit');
  /* 横屏后 CSS 坐标轴和用户看到的轴差 90°：
     键右（机身逆时针）：CSS +x = 用户上，CSS +y = 用户右；
     键左（机身顺时针）：CSS +x = 用户下，CSS +y = 用户左。
     摇杆方向必须按用户方向判断，否则上下左右全歪。 */
  var ux,uy;
  if(rotateMode==='right'){ ux=dy; uy=dx; }
  else if(rotateMode==='left'){ ux=-dy; uy=-dx; }
  else { ux=dx; uy=-dy; }
  var ulen=Math.sqrt(ux*ux+uy*uy);
  var want={};
  if(ulen>=JOY_DEAD){
    var ang=Math.atan2(uy,ux)*180/Math.PI;
    var idx=joySector(ang,joyCtl.prev);
    joyCtl.prev=idx;
    want=JOY_DIRS[idx];
    /* 斜向要"推得更出去"才算：刚出死区的轻微偏移只给主导轴，
       否则拇指轻轻一碰就判成斜走，平台游戏会感觉在抖。 */
    var diag=(want.up&&want.left)||(want.up&&want.right)||(want.down&&want.left)||(want.down&&want.right);
    if(diag && ulen < JOY_DEAD*1.25){
      if(Math.abs(ux)>=Math.abs(uy)) want=ux>0?{right:1}:{left:1};
      else want=uy>0?{up:1}:{down:1};
    }
  }else{
    joyCtl.prev=null;
  }
  var DIRS=['up','down','left','right'], MAP={up:4,down:5,left:6,right:7};
  for(var i=0;i<DIRS.length;i++){
    var k2=DIRS[i];
    if(want[k2]&&!joyCtl.cur[k2]){ pressBtn(MAP[k2]); joyCtl.cur[k2]=1; }
    else if(!want[k2]&&joyCtl.cur[k2]){ releaseBtn(MAP[k2]); delete joyCtl.cur[k2]; }
  }
}
function joyEnd(){
  if(!joyCtl) return;
  joyCtl.active=false;
  joyCtl.prev=null;
  joyCtl.nub.style.transform='';
  joyCtl.base.classList.remove('hit');
  try{ clearInterval(joyCtl.jIv); }catch(e){} joyCtl.jIv=0;
  var DIRS=['up','down','left','right'], MAP={up:4,down:5,left:6,right:7};
  for(var i=0;i<DIRS.length;i++){
    if(joyCtl.cur[DIRS[i]]){ releaseBtn(MAP[DIRS[i]]); delete joyCtl.cur[DIRS[i]]; }
  }
}
function addJoystick(){
  var base=document.createElement('div'); base.className='joy';
  var nub=document.createElement('div'); nub.className='nub';
  base.appendChild(nub);
  joyCtl={base:base,nub:nub,cur:{},active:false,jIv:0};
  base.addEventListener('touchstart',function(e){
    try{ e.preventDefault(); }catch(x){}
    var t=e.touches&&e.touches[0]; if(!t) return;
    joyStart(t.clientX,t.clientY);
  },{passive:false});
  base.addEventListener('touchmove',function(e){
    var t=e.touches&&e.touches[0]; if(t) joyMove(t.clientX,t.clientY);
  },{passive:true});
  base.addEventListener('touchend',function(){ joyEnd(); },{passive:true});
  base.addEventListener('touchcancel',function(){ joyEnd(); },{passive:true});
  base.addEventListener('mousedown',function(e){ try{ e.preventDefault(); }catch(x){} joyStart(e.clientX,e.clientY); });
  base.addEventListener('mousemove',function(e){ joyMove(e.clientX,e.clientY); });
  /* 鼠标拖到圆盘外也能跟：文档级一直挂一份，只在 active 时干活 */
  if(!joyDocBound){
    joyDocBound=true;
    document.addEventListener('mousemove',function(e){ joyMove(e.clientX,e.clientY); });
    document.addEventListener('mouseup',function(){ joyEnd(); });
  }
  vpadEl.appendChild(base);
}
function ensureVpad(sys){
  var st=$('stage');
  if(!vpadEl){
    vpadEl=document.createElement('div'); vpadEl.id='vpad';
    var close=document.createElement('div'); close.id='vpadclose'; close.textContent='×';
    var hide=function(){ vpadOn=false; vpadUpdate(); };
    close.addEventListener('touchstart',function(e){ try{ e.preventDefault(); }catch(x){} hide(); },{passive:false});
    close.addEventListener('mousedown',hide);
    vpadEl.appendChild(close);
    st.appendChild(vpadEl);
    var show=document.createElement('div'); show.id='vpadshow'; show.textContent='⌨';
    var unhide=function(){ vpadOn=true; vpadUpdate(); };
    show.addEventListener('touchstart',function(e){ try{ e.preventDefault(); }catch(x){} unhide(); },{passive:false});
    show.addEventListener('mousedown',unhide);
    st.appendChild(show);
  }
  /* 连发状态要跟着这一局清零，上一局的 A 连发不能带进新游戏 */
  stopTurbo();
  while(vpadEl.childNodes.length>1) vpadEl.removeChild(vpadEl.lastChild);
  if(rotateMode==='left'){
    /* 键左：方向靠左手实体键盘，屏幕上是**用户视角右下角**的 A/B。
       注意：横屏后 CSS 的 x 轴变成用户的上下、y 轴变成用户的左右，
       所以"用户右下"= CSS 右边缘 + 上边缘（不是 bottom）。 */
    addVB('A','', {right:'26px',top:'34px'},[8]);
    addVB('B','', {right:'26px',top:'104px'},[0]);
  }else if(rotateMode==='right'){
    /* 键右：动作键是右手实体键盘，虚拟摇杆要落在**用户视角左下角**
       （= CSS 左边缘 + 上边缘）。 */
    addJoystick();
  }
  vpadUpdate();
}
/* 开局就按这一局游戏的记忆切方向、装虚拟键 */
function setGameRotate(g){
  stopTurbo();
  rotGKey=rotKeyFor(g);
  loadRotateFor(g);
  ensureVpad(g&&g.sys);
}

/* 画面滤镜：关 / 扫描线 / LCD 网格。只往画面上叠一层 CSS，不改核心、不加每帧开销。 */
var FXS=['off','scan','lcd'], FXN={off:'关',scan:'扫描线',lcd:'LCD 网格'};
var fxMode='off';
try{
  var fxq=new URLSearchParams(location.search).get('fx');
  fxMode=(fxq&&FXN[fxq])?fxq:(localStorage.getItem('e5fx')||'off');
}catch(e){}
if(!FXN[fxMode]) fxMode='off';
function applyFx(){
  try{ localStorage.setItem('e5fx',fxMode); }catch(e){}
  document.body.classList.remove('fx-scan','fx-lcd');
  if(fxMode!=='off') document.body.classList.add('fx-'+fxMode);
  var b=$('cfgscan'); if(b) b.textContent='滤镜：'+FXN[fxMode];
}
bindTap($('cfgscan'),function(){ fxMode=FXS[(FXS.indexOf(fxMode)+1)%FXS.length]; applyFx(); });

/* 引擎固定用原生核心：运行库（EmulatorJS wasm）这条旧路已经从设置里去掉，
   二进制缺失时才由 nativeWanted() 自己退回运行库。 */

/* 同一源：可以给宿主页面注入样式。游戏期间把宿主自己的工具栏和底部主菜单藏掉，
   把整块竖向空间让给画面；退出时立刻恢复。宿主不需要改代码，也不改全局配置。 */
var hostClass='e5-game-full', hostStyleInjected=false, hostWatchInjected=false;
/* 插件页启动时先把标记清掉：上一次如果是被宿主直接销毁的（没走到 pagehide），
   宿主菜单栏会一直藏着，用户就回不去了。 */
function hostChromeReset(){ hostChrome(false); }
/* 焦点丢失（切到通知/来电）时把所有按下的键松开，避免"一直按住" */
window.addEventListener('blur',function(){ releaseAll(); },true);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ try{ window.__hiddenAt=new Date().toISOString(); }catch(e){} releaseAll(); }
});
/* 插件页被关掉/刷新时，务必把宿主工具栏和底部主菜单放回去 */
window.addEventListener('pagehide',function(){
  try{ window.__pagehideAt=new Date().toISOString(); }catch(e){}
  noteExit('pagehide');
  try{ flushStat('pagehide'); }catch(e){}
  hostChrome(false);
  /* 页面关掉就把原生进程收掉，别让它占着 ROM 和 CPU（服务端自己也会 120 秒超时退出） */
  try{ if(nativeActive()) natStop(); }catch(e){}
},true);
window.addEventListener('beforeunload',function(){
  noteExit('beforeunload');
  try{ flushStat('beforeunload'); }catch(e){}
},true);

/* 宿主自己的 keydown 处理只做两件事：记日志、把焦点搬进 iframe，然后就 return，
   这一下按键就丢了。菜单里没有画布抢焦点，所以菜单状态的按键永远到不了本页。
   这里往宿主注入一个转发器：宿主收到键且当前打开的正是本插件时，复制一份
   派发进 iframe。焦点已经在 iframe 里时宿主根本收不到事件，所以不会重复。 */
function hostKeyForward(){
  try{
    var d=window.parent.document;
    if(!d||d.__e5KeyFwd) return;
    d.__e5KeyFwd=true;
    /* 同源，直接挂监听。注入 <script> 在这台 WebKit 上不执行，别再走那条路。 */
    d.addEventListener('keydown',function(e){
      try{
        var f=d.getElementById('app-frame');
        if(!f||f.hidden) return;
        if(!/\/plugins\/e5-emulator\//.test(f.getAttribute('src')||'')) return;
        var w=f.contentWindow; if(!w) return;
        var ev=new w.KeyboardEvent('keydown',{key:e.key,code:e.code,keyCode:e.keyCode,which:e.which,repeat:e.repeat,bubbles:true,cancelable:true});
        w.document.dispatchEvent(ev);
      }catch(x){}
    },false);
  }catch(e){}
}
/* 宿主关掉本插件（closeApp）时一定把隐藏类撤掉。
   原来靠往宿主注入 <script> 的心跳看门狗，但这台 WebKit 不执行注入脚本，
   于是插件一被关，主页就只剩中间内容、菜单全没了。
   同源直接包住宿主的 closeApp —— 它是 app.js 的顶层函数声明，挂在宿主 window 上。
   注意时机：宿主脚本没跑完时 closeApp 还不存在，所以这个函数要能被反复调用。 */
function wrapHostClose(){
  try{
    var w=window.parent;
    if(!w || w===window) return;
    if(w.__e5EmuCloseWrapped) return;
    if(typeof w.closeApp!=='function') return;
    var orig=w.closeApp;
    w.closeApp=function(){
      try{ if(w.document && w.document.body) w.document.body.classList.remove(hostClass); }catch(e){}
      return orig.apply(this,arguments);
    };
    w.__e5EmuCloseWrapped=true;
  }catch(e){}
}
function hostChrome(on){
  try{
    var d=window.parent.document;
    /* 关键：游戏期间把宿主的**状态栏**也藏掉，让 iframe 占满整块屏。
       宿主有一条全局手势：在宿主自己的页面上横向滑动 ≥50px、800ms 内完成，
       就会切换页面；而切页会调用 closeApp() 直接把插件关掉。
       横屏时这条 28px 状态栏正好贴在左手握持的边缘，拇指一滑就命中——
       表现就是"只碰了摇杆和按键，游戏却退出了"。
       iframe 占满后宿主收不到任何触摸，这个手势就无从触发。
       规矩：只改 body 上的类，退出/页面销毁时撤掉；不写宿主 uci 全局配置。 */
    var st=d.getElementById('e5-game-chrome');
    var css='body.'+hostClass+' #mobile-toolbar,body.'+hostClass+' #mobile-nav,body.'+hostClass+' #bar{display:none!important}'+
            'body.'+hostClass+' #app-frame{top:0;bottom:0;height:100%!important}';
    if(!st){
      st=d.createElement('style');
      st.id='e5-game-chrome';
      d.head.appendChild(st);
    }
    if(st.textContent!==css) st.textContent=css;
    hostStyleInjected=true;
    /* 宿主侧看门狗：插件每秒刷新一次心跳，超过 5 秒没有心跳就把隐藏撤掉。
       这样即使插件页被浏览器直接销毁（没机会执行任何清理代码），
       宿主的菜单栏也会自己回来，不会把用户关在"没有菜单"的界面里。 */
    if(!hostWatchInjected){
      try{
        var sc=d.createElement('script');
        sc.id='e5-game-watchdog';
        sc.textContent='(function(){if(window.__e5ChromeWatch)return;window.__e5ChromeWatch=1;'+
          'setInterval(function(){if(Date.now()-(window.__e5GamePing||0)>5000){'+
          'try{document.body.classList.remove("'+hostClass+'");}catch(e){}}},1000);})();';
        (d.head||d.documentElement).appendChild(sc);
        hostWatchInjected=true;
      }catch(e){}
    }
    if(on){ try{ window.parent.__e5GamePing=Date.now(); }catch(e){} }
    d.body.classList.toggle(hostClass,!!on);
    wrapHostClose();
    /* 注入 <script> 的心跳看门狗在这台 WebKit 上不执行，别指望它 */
    if(on) wrapHostClose();
  }catch(e){}
}

var fitLastW=0, fitLastH=0;
function fit(){
  var g=current;
  if(!g||!g.w||!g.h) return;
  /* 原生核心每帧都报真实分辨率（同一个 ROM 也可能换模式，比如 MD 的
     320x224 和 256x192）。外框按核心的实际尺寸算，别拿游戏表里的估计值
     去拉伸，否则画面会被拉长。 */
  if(running&&nativeWanted(g)&&nat.w&&nat.h) g={w:nat.w,h:nat.h};
  var stage=$('stage').getBoundingClientRect();
  var availW=Math.floor(stage.width), availH=Math.floor(stage.height-58);   /* 顶部条 18 + 操作条 40 */
  if(!availW||!availH) return;
  var cw,ch,note;
  if(rotateMode==='left'||rotateMode==='right'){
    /* 横屏：旋转后的外框是 gh×gw，所以按「屏宽/游戏高、屏高/游戏宽」取一个
       统一缩放（不拉伸）；容器仍设成 gw×ch，整体再转 ±90°。
       「1:1」模式在横屏下取不超过可用区的最大整数倍。 */
    var kR=Math.min(availW/g.h, availH/g.w);
    if(fitMode==='int') kR=Math.max(1,Math.floor(kR));
    cw=Math.floor(g.w*kR); ch=Math.floor(g.h*kR);
    note=kR.toFixed(2)+'× · '+(rotateMode==='left'?'键左':'键右');
  }else if(fitMode==='int'){
    /* 点对点：整数倍放大，像素不糊也不变形，四周留黑边 */
    var ki=Math.max(1,Math.floor(Math.min(availW/g.w,availH/g.h)));
    cw=g.w*ki; ch=g.h*ki; note=ki+'× 原始大小';
  }else if(fitMode==='full'){
    /* 全拉：可用区整个铺满，纵向拉伸不设上限 */
    var kx=availW/g.w, h0=g.h*kx;
    if(h0>availH){ var k2=availH/g.h; cw=Math.floor(g.w*k2); ch=Math.floor(g.h*k2); note='等比 '+k2.toFixed(2)+'×'; }
    else{ var sy=availH/h0; cw=availW; ch=Math.floor(h0*sy); note='拉伸 '+kx.toFixed(2)+'×'+sy.toFixed(2)+'×'; }
  }else{
    /* 宽铺（默认）：左右铺满，上下用同一个缩放比（不拉伸），高度不够就等比缩回去 */
    var kx2=availW/g.w, h1=g.h*kx2;
    if(h1>availH){ var k3=availH/g.h; cw=Math.floor(g.w*k3); ch=Math.floor(g.h*k3); note=k3.toFixed(2)+'×'; }
    else{ cw=availW; ch=Math.floor(h1); note=kx2.toFixed(2)+'×'; }
  }
  if(cw<1||ch<1) return;
  /* 画布样式每次都刷（两次属性写入，很便宜）；容器尺寸没变就不动，
     避免每秒触发一次重新布局 */
  try{
    var c=document.querySelector('#ejs_game canvas');
    if(c){ c.style.width='100%'; c.style.height='100%'; }
  }catch(e){}
  if(fitLastW===cw && fitLastH===ch) return;
  fitLastW=cw; fitLastH=ch;
  /* 画布的真实尺寸就是目标尺寸：源帧由 JS 最近邻画上来，CSS 不再做任何缩放 */
  try{
    var cv=document.querySelector('#ejs_game canvas');
    if(cv&&(cv.width!==cw||cv.height!==ch)){ cv.width=cw; cv.height=ch; }
  }catch(e){}
  $('ejs_game').style.width=cw+'px';
  $('ejs_game').style.height=ch+'px';
  $('tres').textContent=g.w+'×'+g.h+' · '+note;
}

var lastFrame=null, lastAt=0;
setInterval(function(){
  /* 宿主把插件框架藏起来（通知、来电、菜单键导致的 closeApp）时 iframe 尺寸会变成 0。
     原生路线：挂起等它回来，游戏进度不丢；旧路线没法恢复，仍按原来的方式退出。 */
  if(running&&!window.innerWidth){
    susp.ticks++;
    if(susp.ticks>=2){
      if(nativeWanted(current)) nativeSuspend('innerWidth0');
      else { susp.ticks=0; try{ leave('hidden'); }catch(e){} }
    }
  }else if(susp.ticks){
    susp.ticks=0;
    if(susp.on) nativeResume();
  }
  if(running&&nativeWanted(current)){ nativeTick(); post(); if(shotWant&&phase==='running'){ shotTick++; if(shotTick%5===0) shotUpload(); } return; }
  if(running){
    fit();
    applyKeymap();
    try{ if(!marks.canvas && document.querySelector('#ejs_game canvas')) marks.canvas=Date.now()-t0; }catch(e){}
    try{
      var gf=gm();
      if(gf&&typeof gf.getFrameNum==='function'){
        var n=gf.getFrameNum(), now=Date.now();
        if(lastFrame===null){ lastFrame=n; lastAt=now; }
        else if(now-lastAt>=1000){ window.__fps=(n-lastFrame)*1000/(now-lastAt); lastFrame=n; lastAt=now; }
      }
    }catch(e){}
    $('tfps').innerHTML='<b>'+(window.__fps?window.__fps.toFixed(1):'--')+'</b> FPS';
    /* 卡死检测：帧号连续 5 秒不动 = 主循环已经死了（wasm 陷阱），给个提示 */
    try{
      var g2=gm();
      if(g2&&typeof g2.getFrameNum==='function'){
        var fn=g2.getFrameNum();
        if(window.__lastFrameNum===fn) stallTicks++; else { stallTicks=0; window.__lastFrameNum=fn; }
        if(stallTicks>=5){ $('tres').textContent='画面卡住'; $('tfps').innerHTML='<b>0</b> FPS'; showStall(); startStallRecovery(); }
      }
    }catch(e){}
    autoTick++;
    if(autoTick%15===0) autoSave();   /* 每 15 秒自动存档一次 */
    /* 加载阶段把进度显示在顶部条的分辨率位置（核心编译慢，让用户知道在等什么） */
    if(phase==='loading'){ $('status').textContent='加载核心 '+current.core+' … '+Math.round((Date.now()-t0)/1000)+'s'; }
    if(phase!=='running') $('tres').textContent=$('status').textContent;
    hostChrome(true);   /* 宿主可能因来电等重排过 body，每秒补一次 */
    if(shotWant && phase==='running') shotUpload();
    if(phase!=='running'&&window.__fps>0){ phase='running'; marks.firstFrame=Date.now()-t0;
      $('status').textContent='运行中 · '+current.sys+' '+current.n; focusCanvas();
      if(!autoLoaded){ autoLoaded=true; autoLoad(); }   /* 第一次出帧后把上次的自动存档读回来 */
    }
    else if(phase!=='running'&&Date.now()-t0>15000){
      phase='stalled';
      var s2=snapshot();
      $('status').textContent='没有开始出帧 · 页面'+(s2.hidden?'不可见':'可见')+' · 画布'+(s2.canvas||'?')+' · 帧'+(s2.frame===undefined?'?':s2.frame);
    }
  }
  post();
},1000);

function statTag(){ try{ var qp=new URLSearchParams(location.search); var t=qp.get('tag')||qp.get('t'); return t||'ui'; }catch(e){ return 'ui'; } }
/* ---- 按键自检（?selftest=1）----
   真机没有 uinput，硬件按键没法自动注入，所以让页面自己合成按键事件，
   走一遍真实的 handleKey → 按键位图 → 原生核心这条路，把每个键的
   位图结果写进遥测（window.__selftest），真机上也能核对映射对不对。 */
var SELFTEST_CASES=[
  {k:'ArrowUp',c:38,want:16},{k:'ArrowDown',c:40,want:32},
  {k:'ArrowLeft',c:37,want:64},{k:'ArrowRight',c:39,want:128},
  {k:'Enter',c:13,want:256},
  {k:'0',c:48,want:8},{k:'1',c:49,want:4},{k:'2',c:50,want:1024},{k:'3',c:51,want:2048},
  {k:'Backspace',c:8,want:1}
];
function runSelftest(){
  var out=[], allOk=true;
  for(var i=0;i<SELFTEST_CASES.length;i++){
    var t=SELFTEST_CASES[i];
    try{
      releaseAll();
      var ev=new KeyboardEvent('keydown',{key:t.k,code:t.k,keyCode:t.c,bubbles:true,cancelable:true});
      window.dispatchEvent(ev);
      var got=(typeof nat!=='undefined')?nat.mask:-1;
      var ok=(got===t.want);
      if(!ok) allOk=false;
      out.push(t.k+'='+got+(ok?'':'!'));
      var ev2=new KeyboardEvent('keyup',{key:t.k,code:t.k,keyCode:t.c,bubbles:true,cancelable:true});
      window.dispatchEvent(ev2);
    }catch(e){ out.push(t.k+'=err'); allOk=false; }
  }
  try{ releaseAll(); }catch(e){}
  window.__selftest=(allOk?'OK ':'BAD ')+out.join(',');
  return window.__selftest;
}
/* 真机没有截图接口。这台 WebKit 的 canvas.toDataURL 对非空画面会吐乱码，
   所以直接把最新一帧的原始 RGB565 像素分块传给后端，由后端那边拼成 PNG。
   宿主的 read_body 超过 4096 字节就整块丢弃，所以分块传。 */
function shotUpload(){
  if(shotState) return;
  if(!nat.rawBuf){ logs.push('shot 还没有帧'); return; }
  shotState=1;
  try{
    var w=nat.rawW, h=nat.rawH;
    var src=new Uint16Array(nat.rawBuf,4,w*h);
    var bytes=new Uint8Array(src.buffer,src.byteOffset,w*h*2);
    /* RGB565 → base64：3 字节变 4 字符 */
    var b64='', i=0, STEP=6000, n=bytes.length;
    while(i<n){
      var sl=bytes.subarray(i,Math.min(i+STEP,n));
      var arr=new Array(sl.length);
      for(var k=0;k<sl.length;k++) arr[k]=String.fromCharCode(sl[k]);
      b64+=btoa(arr.join(''));
      i+=STEP;
    }
    var CH=3000;
    var parts=['w='+w+',h='+h+',n='+n+';'];
    for(var p=0;p<b64.length;p+=CH) parts.push(b64.slice(p,p+CH));
    logs.push('shot 上传 '+w+'x'+h+' '+parts.length+' 块');
    function send(){
      if(shotIdx>=parts.length){ shotState=0; logs.push('shot 发完'); return; }
      var myIdx=shotIdx; shotIdx++;
      natApi('/emu/shot',{part:myIdx, b64:parts[myIdx]}).then(send).catch(function(e){
        shotState=3; logs.push('shot 失败 '+e);
      });
    }
    shotIdx=0;
    send();
  }catch(e){ shotState=3; logs.push('shot 出错 '+e); }
}
var shotIdx=0;
function post(){
  try{
    if(typeof e5!=='undefined'&&e5.api){
      /* 后端 read_body 对超过 4096 字节的 body 直接丢弃（整个变成 {}），
         所以这里先量体积，超了就砍日志再发。 */
      var body={tag:statTag(), phase:phase, core:window.EJS_core||'', fps:window.__fps||null,
        marks:marks, logs:logs.slice(-6).map(function(x){ return x.slice(0,120); }), err:lastErr.slice(0,120),
        t:new Date().toISOString(), snap:snapshot()};
      var raw=JSON.stringify(body);
      if(raw.length>3600){
        body.logs=[]; body.err=body.err.slice(0,60);
        body.snap.keyLog=String(body.snap.keyLog||'').slice(0,600);
        raw=JSON.stringify(body);

    }
  }catch(e){}
}

['log','warn','error'].forEach(function(k){
  var orig=console[k];
  console[k]=function(){
    var a=Array.prototype.slice.call(arguments).map(function(x){ try{ return typeof x==='object'?JSON.stringify(x):String(x); }catch(e){ return String(x); } }).join(' ');
    logs.push(k+': '+a.slice(0,240)); if(logs.length>20) logs.shift();
    if(k==='error'){
      lastErr=a.slice(0,180);
      /* 把异常的堆栈也留下来：wasm 陷阱只给一句话，看不出是在哪条链上抛的 */
      for(var i=0;i<arguments.length;i++){
        try{
          var st=arguments[i]&&arguments[i].stack;
          if(st){ logs.push('stack '+String(st).replace(/\s+/g,' ').slice(0,300)); if(logs.length>20) logs.shift(); break; }
        }catch(x){}
      }
    }
    try{ if(typeof orig==='function') orig.apply(console,arguments); }catch(e){}
  };
});

(function(){

      g.simulateInput=function(a,b,c){ simCalls++; window.__lastBtn=b; if(c) window.__lastVal=c; return orig(a,b,c); };
      g.__counted=true;
    }
    var kt=new URLSearchParams(location.search).get('keytest');
    if(!kt) return;
    if(kt==='menuback'){
      setTimeout(function(){
        window.dispatchEvent(new KeyboardEvent('keydown',{key:'BrowserBack',bubbles:true,cancelable:true}));
        setTimeout(function(){

          window.__keytest='running='+running+' backTaken='+String(window.__backTaken);
        },300);
